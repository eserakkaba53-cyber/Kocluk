<style>
:root{
  --ink:#14243D; --ink-2:#3F5878; --ink-3:#7D8FA8;
  --paper:#ECF0F5; --panel:#FFFFFF; --line:#C7D2E0; --line-soft:#E1E8F0;
  --accent:#2E4A7D; --accent-soft:#DCE6F4; --vurgu:#E8873A;
  --ok:#1F6B58; --warn:#B0710A; --bad:#A73A2C;
  --ok-bg:#DFEDE9; --warn-bg:#F8EEDA; --bad-bg:#F6E3E0;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:"SF Mono",'JetBrains Mono',Consolas,"Liberation Mono",Menlo,monospace;
}
/* ===== TEMALAR — yalnızca renk değişkenleri. ===== */
:root[data-tema="gece"]{
  --ink:#E7EEF0; --ink-2:#AABEC7; --ink-3:#6E8794;
  --paper:#0E1B22; --panel:#16272F; --line:#294249; --line-soft:#1F343B;
  --accent:#43C0AD; --accent-soft:#123833; --vurgu:#E2A63F;
  --ok:#54C58C; --warn:#E2A63F; --bad:#EE7460;
  --ok-bg:#123528; --warn-bg:#33280F; --bad-bg:#37201B;
}
:root[data-tema="kum"]{
  --ink:#2A231E; --ink-2:#5C5046; --ink-3:#94867A;
  --paper:#ECE4D8; --panel:#FBF7EF; --line:#DBCEBB; --line-soft:#EBE2D2;
  --accent:#1B6E62; --accent-soft:#D8E7E2; --vurgu:#B0740F;
  --ok:#3C7A4E; --warn:#B0740F; --bad:#B0432E;
  --ok-bg:#E4EFDD; --warn-bg:#F6EACF; --bad-bg:#F3E0D7;
}
:root[data-tema="lacivert"]{
  --ink:#0B2033; --ink-2:#37506A; --ink-3:#7389A0;
  --paper:#DCE6EE; --panel:#F5F9FC; --line:#C2D2E1; --line-soft:#E1EAF2;
  --accent:#155A8C; --accent-soft:#D6E5F2; --vurgu:#B0710A;
  --ok:#1F7A55; --warn:#B0710A; --bad:#A73A2C;
  --ok-bg:#E1F0E9; --warn-bg:#F7EDD6; --bad-bg:#F5E1DD;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
button{font-family:inherit;font-size:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding:0 14px 70px}
.hdr{background:#03182B;border-bottom:1px solid #0A2942;position:sticky;top:0;z-index:5}
.hdr h1{color:#FFFFFF}
.hdr .meta{color:#7E9BB8 !important}
.hdr .tab{color:#9DB4CC}
.hdr .tab.on{color:#FFFFFF;border-bottom-color:var(--vurgu)}
.hdr .in{max-width:860px;margin:0 auto;padding:12px 14px 0;position:relative}
.hdr .brandrow{display:flex;align-items:center;gap:14px;padding-bottom:2px}
.hdr .brandrow img{width:132px;height:auto;flex:none}
@media(max-width:520px){.hdr .brandrow img{width:92px}
  .hdr h1{font-size:18px}}
.wrap{position:relative}

.card{position:relative;z-index:1}
.hdr h1{margin:0;font-size:20px;font-weight:650;letter-spacing:-.01em}
.hdr .meta{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);margin-top:2px}
.tabs{display:flex;gap:2px;margin-top:12px;overflow-x:auto}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:9px 13px;color:var(--ink-2);font-size:14px;font-weight:550;white-space:nowrap}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;margin:16px 0}
.card>h2{margin:0;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);padding:13px 16px;border-bottom:1px solid var(--line-soft);font-weight:650}
.card .body{padding:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line-soft)}
.stat{background:var(--panel);padding:14px 16px}
.stat .k{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:650}
.stat .v{font-family:var(--mono);font-size:24px;font-weight:600;letter-spacing:-.02em;margin-top:2px}
.stat .n{font-size:11.5px;color:var(--ink-3)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:650;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
td.num,th.num{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
label.f{display:block;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:650;margin-bottom:4px}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:6px;background:#FBFCFE;color:var(--ink)}
input[type=number]{font-family:var(--mono);text-align:right}
.fr{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.fr>div{flex:1;min-width:130px}
.btn{background:var(--accent);color:#fff;border:0;padding:11px 18px;border-radius:6px;font-weight:600;font-size:14px}
.btn:hover{background:#223860}
.btn.ghost{background:none;color:var(--accent);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.mini{padding:5px 11px;font-size:12.5px}
.btn.wide{width:100%;padding:14px;font-size:15px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{background:#fff;border:0;padding:6px 10px;font-size:12.5px;font-weight:600;color:var(--ink-3);border-right:1px solid var(--line-soft)}
.seg button:last-child{border-right:0}
.seg button.on{color:#fff}
.seg button.on[data-v="1"]{background:var(--ok)}
.seg button.on[data-v="2"]{background:var(--vurgu)}
.seg button.on[data-v="3"]{background:var(--bad)}
.seg button.on[data-v="0"]{background:var(--ink-3)}
.flag{display:flex;gap:10px;padding:12px 14px;border-radius:6px;margin-bottom:10px;font-size:14px;align-items:flex-start}
.flag.ok{background:var(--ok-bg);color:#2C5A28}
.flag.warn{background:var(--warn-bg);color:#7A4E06}
.flag.bad{background:var(--bad-bg);color:#7C2B20}
.flag .ic{font-family:var(--mono);font-weight:700;flex:none}
.topic{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line-soft);border-radius:6px;background:#FBFCFE;font-size:13.5px;margin-bottom:6px}
.topic .tn{flex:1;min-width:0}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.dot.t0{background:#D6DEE8}.dot.t1{background:#E8873A}.dot.t2{background:var(--ok)}.dot.t3{background:var(--bad)}
.sec-h{display:flex;align-items:center;gap:10px;margin:16px 0 8px}
.sec-h h3{margin:0;font-size:14px;font-weight:650}
.empty{padding:30px 16px;text-align:center;color:var(--ink-3);font-size:14px}
.hint{font-size:12.5px;color:var(--ink-3);margin-top:6px}
.big{font-family:var(--mono);font-size:12px;word-break:break-all;background:#F2F5F9;border:1px solid var(--line-soft);border-radius:6px;padding:10px;max-height:150px;overflow:auto}
progress{width:100%;height:9px}

/* ================= DAR EKRAN İNCE AYARLARI =================
   Panel zaten mobil odaklı; bunlar telefonda kalan pürüzleri kapatır.
   Geniş ekranlarda hiçbir şey değişmez. */
@media(max-width:640px){

  .wrap{padding:0 10px 70px}
  .card{margin-bottom:12px}
  .card .body{padding:12px}
  .card>h2{padding:11px 12px}

  /* geniş tablolar sıkışıp okunmaz olmasın, kart içinde yatay kaysın */

  /* sekmeler parmakla kaysın, kaydırma çubuğu görünmesin */
  .tabs{scrollbar-width:none;-webkit-overflow-scrolling:touch;flex-wrap:nowrap}
  .tabs::-webkit-scrollbar{display:none}
  .tab{white-space:nowrap}

  /* dokunma hedefleri */
  .btn{min-height:42px}
}
@media(max-width:400px){
  .stats{grid-template-columns:1fr}
}


/* ===== SAYFA YANA KAYMAZ · TABLOLAR KENDİ İÇİNDE KAYAR ===== */
*,*::before,*::after{box-sizing:border-box}
html,body{max-width:100%;overflow-x:hidden}
img,svg,video,canvas,iframe{max-width:100%}

/* Yazı ekran genişliğine göre kendini ayarlar:
   clamp(en küçük, ekrana göre, en büyük) */
body{font-size:clamp(13px,3.4vw,14px)}
.card>h2{font-size:clamp(10.5px,2.7vw,12px)}
.tab{font-size:clamp(11.5px,3vw,13.5px)}

@media(max-width:640px){
  .tabs{overflow-x:visible;flex-wrap:wrap;gap:1px}
  .tab{white-space:normal}
  .wrap{max-width:100%;padding:0 10px 70px}

  /* Geniş tablo sayfayı değil kendi kartını kaydırır */
  .card .body{padding:10px;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .card .body table{table-layout:auto;width:auto;min-width:100%;font-size:11px}
  .card .body th{white-space:nowrap;padding:6px 8px;font-size:9.5px}
  .card .body td{padding:6px 8px;word-break:normal;overflow-wrap:normal;line-height:1.35}
  .card .body td.num,.card .body th.num{white-space:nowrap}
  .pill,.btn{white-space:nowrap}
  .pill{font-size:10px;padding:2px 7px}
  .btn{font-size:12.5px;padding:9px 12px}
  .hint,.empty{font-size:11.5px}
}


/* --- çok dar telefon: bir kademe daha küçük --- */
@media(max-width:400px){
  .card .body table{font-size:10.5px}
  .card .body th{font-size:9px;padding:5px 6px}
  .card .body td{padding:5px 6px}
  .card>h2{padding:9px 10px}
  .btn{font-size:12px;padding:8px 10px}
}


/* ===== MOBİLDE FORM ÖĞELERİ ===== */
@media(max-width:760px){
  /* açılır listeler, sayı kutuları, metin alanları */
  .card .body input,
  .card .body select,
  .card .body textarea{
    font-size:13px;
    padding:6px 8px;
    min-height:34px;
    max-width:100%;
  }
  /* tablo içindeki daracık kutular daha da küçük */
  .card .body table input,
  .card .body table select{
    font-size:12px;
    padding:5px 6px;
    min-height:32px;
  }
  .card .body table input[type=number]{min-width:52px;width:100%}
  .card .body table select{min-width:96px}
  .btn.mini{font-size:11.5px;padding:6px 10px;min-height:32px}

  /* butonun yanındaki açıklama yazısı butonun üstüne binmesin */
  .btn + .hint,
  .btn + span.hint{display:block;margin:8px 0 0 0;font-size:11px}

  /* etiketler */
  label,.f{font-size:11px}
}
@media(max-width:400px){
  .card .body input,.card .body select,.card .body textarea{font-size:12.5px}
  .card .body table input,.card .body table select{font-size:11.5px;min-height:30px}
}


/* ===== TAŞMA DÜZELTMESİ =====
   .flag hem rozet hem uyarı kutusu için kullanılıyor.
   Uyarı kutusu uzun metin taşır — asla tek satıra zorlanmamalı. */
.flag{white-space:normal;max-width:100%}
.flag > span{min-width:0;overflow-wrap:break-word}
.card,.stat,.view,.wrap{max-width:100%}


/* ===== ÖNCELİK ROZETLERİ · mobil uyumlu ===== */
.onc-sat{display:flex;flex-wrap:wrap;gap:3px;margin-top:3px;line-height:1.4}
.onc-sat > span{max-width:100%}
.topic .tn{display:block;min-width:0;overflow-wrap:break-word}
@media(max-width:760px){
  .topic-grid{grid-template-columns:1fr}
  .topic{align-items:flex-start;padding:8px 9px}
  .onc-sat{margin-top:4px}
  .onc-sat > span{font-size:8.5px !important;padding:1px 4px !important}
}
@media(max-width:400px){
  .onc-sat > span{font-size:8px !important;letter-spacing:0 !important}
}

<script>
/* ================= DEPOLAMA ================= */
const KEY='ogrenci_v1_sunucu';   // eski panel 'ogrenci_v1' kullanır
const ESKIKEY='ogrenci_v1'; let MEM=null;
async function load(){
  try{ if(window.storage){const r=await window.storage.get(KEY); if(r&&r.value) return JSON.parse(r.value);} }catch(e){}
  try{ const s=localStorage.getItem(KEY); if(s) return JSON.parse(s); }catch(e){}
  return MEM;
}
async function save(){ sunucuKaydet(); const s=JSON.stringify(D); MEM=D;
  try{ if(window.storage){await window.storage.set(KEY,s); return;} }catch(e){}
  try{ localStorage.setItem(KEY,s); }catch(e){}
}
/* ================= KODLAMA ================= */
/* ================= SUNUCU KATMANI (Supabase REST) =================
   Hazır kütüphane kullanılmaz; doğrudan REST arayüzü çağrılır.
   Böylece dış bağımlılık ve CDN riski yoktur.

   SB.url  : proje adresi        (Settings › API › Project URL)
   SB.key  : anon public anahtar (Settings › API › anon public)
   SB.tok  : oturum jetonu       (girişte alınır, tarayıcıda saklanır)
==================================================================== */
/* Sunucu ayarları sunucu.js dosyasından gelir; yoksa davet linkinden dolar. */
const SUNUCU = (window.SUNUCU_AYAR && window.SUNUCU_AYAR.key)
  ? window.SUNUCU_AYAR : { url:'', key:'' };
var SB = { url:SUNUCU.url||'', key:SUNUCU.key||'', tok:'', ref:'', uid:'', mail:'', sonHata:'' };
var SBKEY = 'ogrenci_sb_oturum';

function sbYukle(){
  try{ var s=localStorage.getItem(SBKEY); if(s) SB=Object.assign(SB,JSON.parse(s)); }catch(e){}
  if(SUNUCU.url) SB.url=SUNUCU.url;
  if(SUNUCU.key) SB.key=SUNUCU.key;
}
function sbSakla(){
  try{ localStorage.setItem(SBKEY,JSON.stringify(SB)); }catch(e){}
}
function sbKurulu(){ return !!(SB.url && SB.key); }
function sbOturum(){ return !!(sbKurulu() && SB.tok); }

/* ---------- düşük seviye çağrı ---------- */
async function sbCagri(yol, secenek){
  secenek = secenek || {};
  var bas = {
    'apikey': SB.key,
    'Authorization': 'Bearer ' + (SB.tok || SB.key),
    'Content-Type': 'application/json'
  };
  if(secenek.basliklar) for(var k in secenek.basliklar) bas[k]=secenek.basliklar[k];
  var cevap = await fetch(SB.url.replace(/\/+$/,'') + yol, {
    method: secenek.method || 'GET',
    headers: bas,
    body: secenek.body ? JSON.stringify(secenek.body) : undefined
  });
  var metin = await cevap.text();
  var veri = null;
  try{ veri = metin ? JSON.parse(metin) : null; }catch(e){ veri = metin; }
  if(!cevap.ok){
    var m = (veri && (veri.message || veri.error_description || veri.error || veri.msg)) || ('HTTP '+cevap.status);
    var h = new Error(m); h.kod = cevap.status; h.govde = veri; throw h;
  }
  return veri;
}

/* ---------- oturum ---------- */
async function sbKayit(mail, sifre, ad){
  var r = await sbCagri('/auth/v1/signup', { method:'POST',
    body:{ email:mail, password:sifre, data:{ ad:ad||'', rol:'koc' } } });
  if(r && r.access_token){ sbOturumKur(r); return { giris:true }; }
  return { giris:false, dogrulama:true };   // e-posta onayı bekleniyor
}
async function sbGiris(mail, sifre){
  var r = await sbCagri('/auth/v1/token?grant_type=password', { method:'POST',
    body:{ email:mail, password:sifre } });
  sbOturumKur(r);
}
function sbOturumKur(r){
  SB.tok = r.access_token || '';
  SB.ref = r.refresh_token || '';
  SB.uid = (r.user && r.user.id) || '';
  SB.mail= (r.user && r.user.email) || '';
  sbSakla();
}
async function sbTazele(){
  if(!SB.ref) throw new Error('Oturum yok');
  var r = await sbCagri('/auth/v1/token?grant_type=refresh_token', { method:'POST',
    body:{ refresh_token: SB.ref } });
  sbOturumKur(r);
}
function sbCikis(){
  SB.tok=''; SB.ref=''; SB.uid=''; SB.mail=''; sbSakla();
}
/* jeton süresi dolmuşsa bir kez tazeleyip yeniden dener */
async function sbGuvenli(fn){
  try{ return await fn(); }
  catch(e){
    if(e.kod===401 && SB.ref){ await sbTazele(); return await fn(); }
    throw e;
  }
}

/* ---------- tablo işlemleri ---------- */
function sbSorgu(tablo, sorgu){
  return sbGuvenli(function(){ return sbCagri('/rest/v1/'+tablo+(sorgu||'')); });
}
function sbYaz(tablo, satirlar, catisma){
  if(!satirlar || !satirlar.length) return Promise.resolve([]);
  return sbGuvenli(function(){
    return sbCagri('/rest/v1/'+tablo + (catisma?('?on_conflict='+catisma):''), {
      method:'POST', body:satirlar,
      basliklar:{ 'Prefer':'resolution=merge-duplicates,return=representation' } });
  });
}
function sbGuncelle(tablo, sorgu, alanlar){
  return sbGuvenli(function(){
    return sbCagri('/rest/v1/'+tablo+sorgu, { method:'PATCH', body:alanlar,
      basliklar:{ 'Prefer':'return=representation' } });
  });
}
function sbSil(tablo, sorgu){
  return sbGuvenli(function(){ return sbCagri('/rest/v1/'+tablo+sorgu, { method:'DELETE' }); });
}

/* ---------- bağlantı denemesi ---------- */
async function sbTest(){
  if(!sbKurulu()) throw new Error('Adres ve anahtar girilmemiş');
  if(!/^https:\/\/[a-z0-9]+\.supabase\.co\/?$/i.test(SB.url.trim()))
    throw new Error('Adres "https://xxxx.supabase.co" biçiminde olmalı');
  await sbCagri('/rest/v1/');
  return true;
}

/* ---------- kimlik üretimi ---------- */
function yeniKimlik(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c){
    var r = Math.random()*16|0, v = c==='x' ? r : (r&0x3|0x8);
    return v.toString(16);
  });
}
function uuidMi(s){ return /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(s||''); }

/* ================= ÖĞRENCİ: SUNUCU ÇEVİRİCİSİ ================= */
var OGRID=null, KOCID=null;

async function ogrKimlik(){
  var r = await sbGuvenli(function(){ return sbCagri('/rest/v1/rpc/ogrenci_kim',{method:'POST',body:{}}); });
  return r || {bagli:false};
}
async function ogrBaglan(kod){
  return await sbGuvenli(function(){
    return sbCagri('/rest/v1/rpc/ogrenci_baglan',{method:'POST',body:{kod:kod}});
  });
}

/* ---------- SUNUCUDAN OKU ---------- */
var SONKIM=null;
async function ogrSunucudanOku(){
  var k = await ogrKimlik();
  SONKIM=k;
  if(!k.bagli) return null;
  if(k.lisans===false) { OGRID=k.id; KOCID=k.koc_id; }
  OGRID=k.id; KOCID=k.koc_id;

  var o = (await sbSorgu('ogrenciler','?id=eq.'+OGRID+'&select=*'))[0];
  var koc = (await sbSorgu('koclar','?id=eq.'+KOCID+'&select=ad,telefon,site_url,ayarlar'))[0] || {};
  var f='?ogrenci_id=eq.'+OGRID+'&select=*';
  var odev = await sbSorgu('odevler',f+'&order=tarih');

async function ogrSunucuyaYaz(){
  if(!OGRID) return;
  /* ödev durumları ve çözülen sorular */
  var deg=(D.tasks||[]).filter(function(t){ return uuidMi(t.id); });
  if(deg.length){
    await sbYaz('odevler', deg.map(function(t){
      return { id:t.id, ogrenci_id:OGRID, tarih:t.date, ders:t.sub, konu:t.konu||'',
        soru:t.q||0, yapilan:t.yap||0, durum:t.s||0, rutin:!!t.rutin, ekstra:!!t.ekstra,
        dk_soru:t.dks==null?null:t.dks, aciklama:t.txt||'',
        dogru:+t.dg||0, yanlis:+t.yn||0, bos:+t.bs||0 };
    }), 'id');
  }
  /* öğrencinin kendi eklediği çalışmalar */
  var yeniEk=(D.tasks||[]).filter(function(t){ return t.ekstra && !uuidMi(t.id); });
  if(yeniEk.length){
    yeniEk.forEach(function(t){ t.id=yeniKimlik(); });
    await sbYaz('odevler', yeniEk.map(function(t){
      return { id:t.id, ogrenci_id:OGRID, tarih:t.date, ders:t.sub, konu:t.konu||'',
        soru:t.q||0, yapilan:t.yap||0, durum:t.s||1, rutin:false, ekstra:true, aciklama:'Öğrencinin kendi çalışması' };
    }), 'id');
  }
  /* konu durumları */
  var kSat=[];
  for(var ders in (D.topics||{}))
    for(var konu in D.topics[ders])
      kSat.push({ ogrenci_id:OGRID, ders:ders, konu:konu, durum:D.topics[ders][konu] });
  if(kSat.length) await sbYaz('konular', kSat, 'ogrenci_id,ders,konu');
  /* denemeler */
  var yeniDen=(D.exams||[]).filter(function(e){ return !uuidMi(e.id); });
  if(yeniDen.length){
    yeniDen.forEach(function(e){ e.id=yeniKimlik(); });
    await sbYaz('denemeler', yeniDen.map(function(e){
      return { id:e.id, ogrenci_id:OGRID, tarih:e.date, ad:e.name||'', tur:e.tur||'tyt',
        netler:e.n||{}, konu_analiz:[] };
    }), 'id');
  }
  /* hedef değişikliği */
  if(D.hedef){
    var alan={};
    if(D.hedef.dept)  alan.bolum=D.hedef.dept;
    if(D.hedef.score!==undefined) alan.hedef_puan=String(D.hedef.score||'');
    if(D.hedef.rank)  alan.hedef_sira=String(D.hedef.rank);
    if(D.hedef.tabanPuan) alan.taban_puan=String(D.hedef.tabanPuan);
    if(D.hedef.tabanSira) alan.taban_sira=String(D.hedef.tabanSira);
    if(D.hedef.tabanYil)  alan.taban_yil=String(D.hedef.tabanYil);
    if(D.hedef.refNets){
      var yeni=Object.assign({},D.refNets||{},D.hedef.refNets);
      alan.hedef_netler=yeni; D.refNets=yeni;
    }
    if(D.dip!=='' && D.dip!=null) alan.diploma_notu=Number(D.dip);
    if(D.obp!=='' && D.obp!=null) alan.obp=Number(D.obp);
    alan.yerlesti=!!D.yerlesti;
    if(Object.keys(alan).length) await sbGuncelle('ogrenciler','?id=eq.'+OGRID, alan);
  } else if(D.dip!=='' || D.obp!=='' ){
    await sbGuncelle('ogrenciler','?id=eq.'+OGRID, {
      diploma_notu: D.dip===''||D.dip==null?null:Number(D.dip),
      obp: D.obp===''||D.obp==null?null:Number(D.obp),
      yerlesti: !!D.yerlesti });
  }
}

function kopruAdres(kimlik){ return 'https://script.google.com/macros/s/'+kimlik+'/exec'; }
function yeniAnahtar(){ return (Date.now().toString(36)+Math.random().toString(36).slice(2,5)).toUpperCase(); }
async function kopruOku(kimlik,anahtar){
  const r=await fetch(kopruAdres(kimlik)+'?al='+encodeURIComponent(anahtar),{cache:'no-store'});
  const j=await r.json();
  if(!j||!j.bulundu) throw new Error('Kod bulunamadı ya da süresi dolmuş');
  return j.veri;
}
async function kopruYaz(kimlik,veri){
  const anahtar=yeniAnahtar(), url=kopruAdres(kimlik)+'?koy='+anahtar;
  try{
    const r=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:veri});
    const j=await r.json();
    if(j&&j.ok) return anahtar;
  }catch(e){}
  try{
    await fetch(url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:veri});
  }catch(e){ throw new Error('Gönderilemedi: '+(e.message||e)); }
  for(let i=0;i<4;i++){
    await new Promise(r=>setTimeout(r,600));
    try{ const v=await kopruOku(kimlik,anahtar); if(v) return anahtar; }catch(e){}
  }
  throw new Error('Kod hazırlanamadı. İnternetini kontrol et ya da uzun kodu gönder.');
}

/* ================= SIKIŞTIRMA =================
   LZW (12 bit). WhatsApp uzun linkleri sonuna kadar tıklanabilir yapmıyor;
   paket ve rapor kodları bu yüzden sıkıştırılıp kısaltılır. */
/* LZW — sabit 12 bit kod, sözlük dolunca sıfırlanır. Senkron, kütüphanesiz. */
var LZW_MAX=4096;
function _enc(s){
  var d={}, next=256, w='', codes=[], i;
  for(i=0;i<256;i++) d[String.fromCharCode(i)]=i;
  for(i=0;i<s.length;i++){
    var c=s[i], wc=w+c;
    if(d[wc]!==undefined){ w=wc; }
    else{
      codes.push(d[w]);
      if(next<LZW_MAX){ d[wc]=next++; }
      else{ d={}; for(var j=0;j<256;j++) d[String.fromCharCode(j)]=j; next=256; }
      w=c;
    }
  }
  if(w!=='') codes.push(d[w]);
  return codes;
}
function _dec(codes){
  var d=[], next=256, i;
  for(i=0;i<256;i++) d[i]=String.fromCharCode(i);
  var w=d[codes[0]], out=w;
  for(i=1;i<codes.length;i++){
    var k=codes[i], entry = d[k]!==undefined ? d[k] : w+w.charAt(0);
    out+=entry;
    if(next<LZW_MAX){ d[next++]=w+entry.charAt(0); }
    else{ d=[]; for(var j=0;j<256;j++) d[j]=String.fromCharCode(j); next=256; }
    w=entry;
  }
  return out;
}
/* 12 bitlik kodları bayta paketle: 2 kod = 3 bayt */
function _pack(codes){
  var n=codes.length, b=new Uint8Array(3+Math.ceil(n*3/2));
  b[0]=(n>>16)&255; b[1]=(n>>8)&255; b[2]=n&255;
  var p=3;
  for(var i=0;i<n;i+=2){
    var a=codes[i], c=(i+1<n)?codes[i+1]:0;
    b[p++]=a>>4; b[p++]=((a&15)<<4)|(c>>8); b[p++]=c&255;
  }
  return b;
}
function _unpack(b){
  var n=(b[0]<<16)|(b[1]<<8)|b[2], codes=[], p=3;
  while(codes.length<n){
    var x=b[p++], y=b[p++], z=b[p++];
    codes.push((x<<4)|(y>>4));
    if(codes.length<n) codes.push(((y&15)<<8)|z);
  }
  return codes;
}
function sikistir(str){
  var utf=unescape(encodeURIComponent(str));
  var b=_pack(_enc(utf)), bin='';
  for(var i=0;i<b.length;i+=8192) bin+=String.fromCharCode.apply(null,b.subarray(i,i+8192));
  return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function ac(b64){
  var s=b64.replace(/-/g,'+').replace(/_/g,'/');
  var bin=atob(s+'==='.slice((s.length+3)%4));
  var b=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) b[i]=bin.charCodeAt(i);
  return decodeURIComponent(escape(_dec(_unpack(b))));
}


function b64e(s){const b=new TextEncoder().encode(s);let o='';for(let i=0;i<b.length;i+=8192)o+=String.fromCharCode(...b.subarray(i,i+8192));return btoa(o);}
function b64d(s){return new TextDecoder().decode(Uint8Array.from(atob(s),c=>c.charCodeAt(0)));}

function norm(s){
  return s.toLocaleLowerCase('tr-TR')
    .replace(/[ıİ]/g,'i').replace(/[şŞ]/g,'s').replace(/[ğĞ]/g,'g')
    .replace(/[üÜ]/g,'u').replace(/[öÖ]/g,'o').replace(/[çÇ]/g,'c')
    .replace(/\s+/g,' ').trim();
}
function solveLine(nums,q){
  let best=null;
  for(let i=0;i<nums.length;i++)for(let j=0;j<nums.length;j++){
    if(i===j) continue;
    const D=nums[i],Y=nums[j];
    if(!Number.isInteger(D)||!Number.isInteger(Y)||D<0||Y<0||D>q||Y>q||D+Y>q) continue;
    const nt=D-Y/4;
    let sc=0;
    if(nums.some((v,x)=>x!==i&&x!==j&&Math.abs(v-nt)<0.06)) sc+=3;      // net satırda var
    if(nums.some((v,x)=>x!==i&&x!==j&&Number.isInteger(v)&&D+Y+v===q)) sc+=2; // boş tutuyor
    if(i<j) sc+=1;                                                       // D genelde Y'den önce
    if(sc<3) continue;                                                   // en az bir güçlü kanıt şart
    if(!best||sc>best.sc||(sc===best.sc&&i<best.i)) best={D,Y,sc,i};
  }
  return best;
}

function kDersBul(satir){

/* Bir satırda BİRDEN FAZLA ders olabilir:
   "TYT Türkçe 40 31 5 4 29,75 % 74   Matematik-1 30 8 2 20 7,50 % 25"
   Hepsini yerleriyle döndürür; her ders kendi parçasındaki sayılarla çözülür. */
function kDersleriBul(satir){
  const L=norm(satir);
  const bulunan=[];
  for(const [ad,kod] of KARNE_DERS){
    let i=0;
    while((i=L.indexOf(ad,i))>=0){
      const onceki = i===0 ? ' ' : L[i-1];
      const sonraki = L[i+ad.length]||' ';
      const bas=i, son=i+ad.length;
      i=son;
      if(/[a-z0-9çğıöşü]/.test(onceki)) continue;          // kelime ortası
      if(/[a-zçğıöşü]/.test(sonraki)) continue;            // daha uzun bir adın parçası
      if(bulunan.some(x=>bas<x.son && son>x.bas)) continue; // daha uzun eşleşmeyle çakışıyor
      bulunan.push({kod, bas, son});
    }
  }
  return bulunan.sort((a,b)=>a.bas-b.bas);
}

/* Sayı dizisinden (D,Y) çöz — beyan edilen net ile doğrula.
   Kanıt gücü: SDYB-net(4) > SDY-net(3) > SDYB(2) > DY-net(1) */
function kNetCoz(nums, soru){
  const yak=(a,b)=>Math.abs(a-b)<0.02;
  let en=null;
  const koy=(d,y,g,p)=>{ if(!en||p>en.p) en={d,y,g,p}; };
  // 1) [S,D,Y,B,Net] / [S,D,Y,Net]
  for(let i=0;i+2<nums.length;i++){
    const S=nums[i], D=nums[i+1], Y=nums[i+2];
    if(!Number.isInteger(S)||!Number.isInteger(D)||!Number.isInteger(Y)) continue;
    if(S<=0||S>200||D<0||Y<0||D+Y>S) continue;
    if(soru && S!==soru) continue;          // soru sayısı biliniyorsa birebir tutmalı
    const B=nums[i+3], N=nums[i+4];
    if(Number.isInteger(B)&&B>=0&&D+Y+B===S&&yak(N,D-Y/4)) koy(D,Y,'SDYB-net',4);
    else if(yak(B,D-Y/4)) koy(D,Y,'SDY-net',3);
    else if(Number.isInteger(B)&&B>=0&&D+Y+B===S) koy(D,Y,'SDYB',2);
  }
  // 2) [D,Y,Net] — soru sayısı satırda yok. Sıfır satırları kabul edilmez.
  if(!en) for(let i=0;i+2<nums.length;i++){
    const D=nums[i], Y=nums[i+1], N=nums[i+2];
    if(!Number.isInteger(D)||!Number.isInteger(Y)||D<0||Y<0) continue;
    if(D+Y===0) continue;                   // "Türkçe 0 0 0 0" gibi başlık satırlarını ele
    if(soru && D+Y>soru) continue;
    if(yak(N,D-Y/4)) koy(D,Y,'DY-net',1);
  }
  return en;
}

/* ---------- A) SATIR TABANLI ---------- */
function karneSatirlardan(text, list){
  const out={}, kanit={}, puan={};
  const soruSay={}; list.forEach(([k,,q])=>soruSay[k]=q);
  soruSay.tyt_mat_top=40; soruSay.ayt_mat_top=40; soruSay.tyt_fen_top=20; soruSay.tyt_sos_top=20;
  text.split(/[\r\n]+/).forEach(raw=>{
    const bul=kDersleriBul(raw);
    if(!bul.length) return;
    bul.forEach((b,j)=>{
      if(b.kod==='__atla') return;
      // bu dersin parçası: kendi adından sonraki ders adına kadar
      const son = j+1<bul.length ? bul[j+1].bas : raw.length;
      const parca = raw.slice(b.son, son);
      const nums=(parca.match(/-?\d+(?:[.,]\d+)?/g)||[]).map(s=>parseFloat(s.replace(',','.')));
      if(nums.length<3) return;
      const r=kNetCoz(nums, soruSay[b.kod]);
      if(!r) return;
      const eski=puan[b.kod];
      if(eski!==undefined && eski>=r.p) return;
      out[b.kod]={d:r.d,y:r.y}; kanit[b.kod]=r.g; puan[b.kod]=r.p;
    });
  });
  return {out,kanit};
}

/* ---------- B) SÜTUN TABANLI (AKBİM, İlk Adım) ---------- */
function karneSutunlardan(text){
  const sat=text.split(/[\r\n]+/);
  const out={};
  // başlık: ders adlarını sırayla içeren satır
  let bas=-1, kodlar=null;
  for(let i=0;i<sat.length;i++){
    const L=norm(sat[i]);
    if(!/turkce/.test(L)) continue;
    const parca=sat[i].split(/\s{1,}/).filter(Boolean);
    const k=parca.map(p=>kDersBul(p));
    const dolu=k.filter(x=>x&&x!=='__atla');
    if(dolu.length>=3){ bas=i; kodlar=k; break; }
  }
  if(bas<0) return {out,kanit:{}};
  // sonraki 12 satırda DOĞRU / YANLIŞ / NET satırlarını ara
  let D=null,Y=null,N=null;
  for(let i=bas;i<Math.min(sat.length,bas+14);i++){
    const L=norm(sat[i]);
    const nums=(sat[i].match(/-?\d+(?:[.,]\d+)?/g)||[]).map(s=>parseFloat(s.replace(',','.')));
    if(/dogru/.test(L)&&!D) D=nums;
    else if(/yanlis/.test(L)&&!Y) Y=nums;
    else if(/^net\b/.test(L)&&!N) N=nums;
  }
  if(!D||!Y||!N) return {out,kanit:{}};
  const kanit={};
  const gecerli=kodlar.filter(x=>x&&x!=='__atla');
  // hizalama: ders sayısı ile sayı sayısı uyuşmalı
  const n=Math.min(gecerli.length, D.length, Y.length, N.length);
  for(let j=0;j<n;j++){
    const kod=gecerli[j];
    if(out[kod]) continue;
    if(Math.abs(N[j]-(D[j]-Y[j]/4))<0.02){ out[kod]={d:D[j],y:Y[j]}; kanit[kod]='sutun'; }
  }
  return {out,kanit};
}

/* ---------- C) SABİT SÜTUN DÜZENLERİ (İlk Adım gibi) ----------
   "S.Sayısı 40 5 5 5 5 40 7 7 6 20 20 120" satırı düzeni ele verir. */
const SUTUN_DUZEN=[
  { soru:[40,5,5,5,5,40,7,7,6,20,20,120],
    ders:['tyt_tur','tyt_tar','tyt_cog','tyt_fel','tyt_din','tyt_mat_top','tyt_fiz','tyt_kim','tyt_biy',null,null,null] },
  { soru:[40,20,40,20],
    ders:['tyt_tur',null,'tyt_mat_top',null] }
];
function karneSabitDuzen(text){
  const sat=text.split(/[\r\n]+/);
  const out={}, kanit={};
  const sayilar=s=>(s.match(/-?\d+(?:[.,]\d+)?/g)||[]).map(x=>parseFloat(x.replace(',','.')));
  let S=null,D=null,Y=null,N=null;
  for(let i=0;i<sat.length;i++){
    const L=norm(sat[i]);
    const T=L.trim(), sy=sayilar(sat[i]);
    if(sy.length<2) continue;                      // sayı içermeyen satır etiket değildir
    if(!S && /^(s\.?\s?sayisi|soru sayisi)/.test(T)) S=sy.filter(x=>Number.isInteger(x));
    else if(!D && /^dogru( cevap)?\b/.test(T)) D=sy;
    else if(!Y && /^yanlis( cevap)?\b/.test(T)) Y=sy;
    else if(!N && /^net\b/.test(T)) N=sy;
  }
  if(!S||!D||!Y||!N) return {out,kanit};
  const duzen=SUTUN_DUZEN.find(z=>z.soru.length===S.length && z.soru.every((v,j)=>v===S[j]));
  if(!duzen) return {out,kanit};
  const n=Math.min(duzen.ders.length,D.length,Y.length,N.length);
  for(let j=0;j<n;j++){
    const kod=duzen.ders[j]; if(!kod) continue;
    if(Math.abs(N[j]-(D[j]-Y[j]/4))<0.02) { out[kod]={d:D[j],y:Y[j]}; kanit[kod]='sabit sütun'; }
  }
  return {out,kanit};
}

/* ---------- D) KONU TABLOSUNDAN TOPLAM ----------
   Bazı karnelerde (AKBİM) özet tablo ders ders vermez; konu analizi tablosunun
   satırları toplanarak doğru/yanlış çıkarılır. */
function karneKonudanToplam(text, st){
  const out={}, kanit={};
  let kt=null;
  try{ kt=parseKonuTablo(text, st); }catch(e){ return {out,kanit}; }
  if(!kt) return {out,kanit};
  for(const kod in kt){
    const v=kt[kod];
    if(!v || !v.konu || !v.konu.length) continue;
    let d=0,y=0,ss=0;
    v.konu.forEach(k=>{ ss+=(k.ss||0); d+=(k.d||0); y+=(k.y||0); });
    if(!ss) continue;
    out[kod]={d,y}; kanit[kod]='konu tablosundan toplandı';
  }
  return {out,kanit};
}

/* ---------- BİRLEŞTİR ---------- */
function parseKarne(text, st){
  const list=subs(st);
  const A=karneSatirlardan(text, list);
  let out=A.out, kanit=A.kanit;
  const zayif=k=>kanit[k]==='DY-net';
  const ekle=(kaynak)=>{ for(const k in kaynak.out){
    if(out[k]===undefined || zayif(k)){ out[k]=kaynak.out[k]; kanit[k]=kaynak.kanit[k]; } } };
  if(Object.keys(out).length<10) ekle(karneSabitDuzen(text));
  if(Object.keys(out).length<10) ekle(karneSutunlardan(text));
  if(Object.keys(out).length<10) ekle(karneKonudanToplam(text, st));
  // toplam satırlarını çöz: TYT Matematik = Matematik-1 + Geometri
  if(out.tyt_mat_top){
    if(!out.tyt_mat && !out.tyt_geo){ out.tyt_mat=out.tyt_mat_top; kanit.tyt_mat=(kanit.tyt_mat_top||'')+' (geometri dahil)'; }
    else if(out.tyt_mat && !out.tyt_geo){
      const g={d:out.tyt_mat_top.d-out.tyt_mat.d, y:out.tyt_mat_top.y-out.tyt_mat.y};
      if(g.d>=0&&g.y>=0&&(g.d||g.y)){ out.tyt_geo=g; kanit.tyt_geo='toplamdan çıkarıldı'; }
    }
    delete out.tyt_mat_top;
  }
  if(out.ayt_mat_top){
    if(!out.ayt_mat && !out.ayt_geo){ out.ayt_mat=out.ayt_mat_top; kanit.ayt_mat=(kanit.ayt_mat_top||'')+' (geometri dahil)'; }
    else if(out.ayt_mat && !out.ayt_geo){
      const g={d:out.ayt_mat_top.d-out.ayt_mat.d, y:out.ayt_mat_top.y-out.ayt_mat.y};
      if(g.d>=0&&g.y>=0&&(g.d||g.y)){ out.ayt_geo=g; kanit.ayt_geo='toplamdan çıkarıldı'; }
    }
    delete out.ayt_mat_top;
  }
  delete out.tyt_fen_top; delete out.tyt_sos_top;
  delete kanit.tyt_mat_top; delete kanit.ayt_mat_top;

  const log=[];
  const isim={}; list.forEach(([k,nm])=>isim[k]=nm);
  Object.keys(out).forEach(k=>{
    const {d,y}=out[k];
    log.push(`${isim[k]||k}: ${d} doğru / ${y} yanlış → ${n1(d-y/4)} net`);
  });
  return {out, log, kanit};
}

/* ---------- ödevlerim ---------- */
/* "Yaptım" işaretlenen konu-ödevi, ilgili konuyu otomatik "Bitti"ye (durum=2) taşır.
   Böylece Konular sekmesi, kalan süre ve otomatik öneri kendiliğinden senkron kalır.
   Yalnızca gerçek bir konuya bağlı, rutin olmayan ödevlerde çalışır; geri almaz. */
function odevKonuBitir(t){
  if(t && t.konu && t.sub && !t.rutin){
    D.topics=D.topics||{}; D.topics[t.sub]=D.topics[t.sub]||{}; D.topics[t.sub][t.konu]=2;
  }
}
function setTask(id,s){
  const t=D.tasks.find(x=>x.id===id); if(!t) return;
  t.s=s;
  if(t.q && (s===1||s===2)) DYBACIK[id]=true;   // döküm girebilsin diye açık kalsın
  if(s===1) odevKonuBitir(t);                    // Yaptım → konu Bitti
  save(); render();
}
function weekKey(ds){const d=new Date(ds+'T00:00');const g=(d.getDay()+6)%7;d.setDate(d.getDate()-g);return d.toISOString().slice(0,10);}
function haftaFarki(ds){const a=new Date(weekKey(ds)+'T00:00'),b=new Date(weekKey(today())+'T00:00');return Math.round((b-a)/604800000);}
function setSoru(id,v){const t=D.tasks.find(x=>x.id===id); if(t){t.yap=Math.max(0,+v||0);save();render();}}
function setYap(id,v){const t=D.tasks.find(x=>x.id===id); if(!t)return;
  t.yap=Math.max(0,+v||0); const o=t.q?t.yap/t.q:0; t.s=o>=0.9?1:o>0?2:0;
  if(t.s===1) odevKonuBitir(t);                  // çözdüğü ≥%90 → Yaptım → konu Bitti
  save(); render();}
function yedekUyari(){
  // Sunucu modunda veri zaten sunucuda; yedek uyarısı anlamsız ve
  // gösterdiği "Ayarlar" sekmesi de gizli. Sadece eski (tarayıcı) panelde çıkar.
  if(typeof sbOturum==='function' && sbOturum() && OGRID) return '';
  const s=D.sonYedek;
  const g=s?Math.round((new Date(today())-new Date(s))/86400000):999;
  if(g<14) return '';
  return `<div class="card" style="border-color:var(--vurgu)"><div class="body">
    <div class="flag warn"><span class="ic">!</span><span>${s?`Son yedeğinin üzerinden ${g} gün geçti.`:'Hiç yedek almadın.'}
      Telefonun sıfırlanırsa ya da tarayıcı verilerin silinirse buradaki her şey gider.
      <b>Ayarlar → Yedek indir</b> ile 10 saniyede güvenceye al.</span></div>
    <button class="btn ghost" onclick="TAB='ayar';render()">Ayarlara git</button>
  </div></div>`;
}
/* Ödevde çözülen soruların doğru/yanlış/boş dökümü.
   Toplam, öğretmenin verdiği soru sayısını AŞAMAZ.
   Toplam < verilen soru  → "Yarım"
   Toplam = verilen soru  → "Yaptım" */
function dyb(t){ return { d:+t.dg||0, y:+t.yn||0, b:+t.bs||0 }; }
function dybTop(t){ const v=dyb(t); return v.d+v.y+v.b; }
function setDYB(id,alan,v){
  const t=D.tasks.find(x=>x.id===id); if(!t) return;
  t[alan]=Math.max(0,parseInt(v,10)||0);
  const s=dyb(t);
  t.yap=s.d+s.y+s.b;          // çözülen soru = doğru+yanlış+boş
  save(); render();
}
function dybAc(id){ DYBACIK[id]=!DYBACIK[id]; render(); }
let DYBACIK={};
/* Kendi çalışmam bölümünün seçili ders/ünite durumu ve arşiv görünürlüğü */

      <div class="hint" style="margin-top:6px">Bu sayılar öğretmenine iletilir. Ödevin durumunu yukarıdaki

/* ---------- KENDİNE ÖDEV VER (solo öğrenci) ----------
   Koçu olmayan öğrenci, hedef önceliğine göre sıradaki konuyu alır ve
   kendine ödev yazar. Ödev kaydı koçun verdiğiyle aynı yapıda tutulur;
   sonradan bir öğretmene bağlanırsa geçmişi kaybolmaz. */
/* Solo mu? Öğrencinin koç kimliği kendi kullanıcı kimliğine eşitse koçu yok demektir. */
function soloMu(){
  if(SOLO) return true;
  try{ const u=(SB&&SB.tok)?JSON.parse(atob(SB.tok.split('.')[1])).sub:null;
       return !!(u && KOCID && KOCID===u); }catch(e){ return false; }
}

/* Her ders için: bitmemiş, ödevi verilmemiş ilk konu (öncelik sırasıyla) */
function soloSiradaki(){
  const out=[];
  for(const [sk,ad] of subs(D)){
    const m=(D.topics&&D.topics[sk])||{};
    const verilmis=new Set(D.tasks.filter(t=>t.sub===sk&&!t.rutin).map(t=>t.konu));
    const oc=konuOncelik(sk);
    const liste = oc ? oc.sirali.map(x=>({konu:x.konu,unite:x.unite,
                        oncelik:x.oncelik,kilit:x.kilit,agirlik:x.agirlik}))
                     : (KONU[sk]||[]).flatMap(([u,ks])=>ks.map(t=>({konu:t,unite:u})));
    const bul = liste.find(x=>(m[x.konu]||0)!==2 && !verilmis.has(x.konu));
    if(bul) out.push({sub:sk, ad, ...bul, dk:sureOf(sk,bul.konu)});
  }
  return out;
}

function soloOdevVer(sub, konu){
  const q=parseInt(document.getElementById('soloQ')?.value||'30',10)||30;
  D.tasks.push({ id:'s'+Date.now().toString(36), date:today(), sub:sub, konu:konu,
                 q:q, yap:0, s:0, rutin:false, txt:'', kendi:true });
  save(); render();
}

/* Konu başına hedef soru sayısı: konunun ÖSYM'de (2018-2025) yılda getirdiği
   ortalama soruya göre ölçekli. Aralık 120–600. */
function hedefSoru(sk, konu){
  var sy = (AGIRLIK && AGIRLIK.agirlik && AGIRLIK.agirlik[sk] && AGIRLIK.agirlik[sk][konu])
             ? (+AGIRLIK.agirlik[sk][konu].soru_yil||0) : 0;
  var v = Math.round((120 + 72*sy)/10)*10;
  return Math.max(120, Math.min(600, v));
}
/* ===== TAVSİYE EDİLEN HAFTALIK ÖDEV (yalnızca koçsuz / solo öğrenci) =====
   Kapsam: ön koşul + çekirdek + güvenlik payı (genişleme HARİÇ).
   Haftalık yük = kalan kapsam süresi / sınava kalan hafta. Çalışma beyanı yükü
   belirlemez; yalnızca gerçekçilik uyarısı için kullanılır. */
function tavsiyeHesap(){
  const hk = haftaKalan();
  if(!AGIRLIK) return {durum:'agirlik'};
  if(hk===null) return {durum:'tarih'};
  if(hk<=0) return {durum:'gecti'};
  let kapsamDk=0, cekDk=0; const havuz=[];
  for(const [sk] of subs(D)){
    const oc = konuOncelik(sk); if(!oc) continue;
    const m = (D.topics||{})[sk]||{};
    const verilmis = new Set(D.tasks.filter(t=>t.sub===sk&&!t.rutin).map(t=>t.konu));
    oc.sirali.forEach(x=>{
      if(x.oncelik==='ensons') return;           // genişleme kapsam dışı
      const durum=m[x.konu]||0; if(durum===2) return;    // bitti
      const dk=sureOf(sk,x.konu)*(durum===1?0.5:durum===3?0.7:1);
      kapsamDk+=dk;
      if(x.oncelik==='once') cekDk+=dk;
      if(!verilmis.has(x.konu))
        // faz: 0 TYT çekirdek(+ön koşul) · 1 AYT çekirdek · 2 TYT güvenlik · 3 AYT güvenlik
        havuz.push({sub:sk, konu:x.konu, unite:x.unite, oncelik:x.oncelik,
                    kilit:x.kilit, agirlik:x.agirlik, grup:x.grup, mufredat:x.mufredat,
                    faz:(x.grup<=1?0:1)*2 + (sk.indexOf('ayt_')===0?1:0),
                    soru:hedefSoru(sk, x.konu), dk});
    });
  }
  const haftalikDk = kapsamDk/hk;
  // Önce TYT çekirdeği, sonra AYT çekirdeği, sonra güvenlik (TYT→AYT); her faz içinde müfredat.
  havuz.sort((a,b)=> (a.faz-b.faz) || (a.mufredat-b.mufredat) || (b.agirlik-a.agirlik));
  const secim=[]; let topla=0;
  for(const x of havuz){ if(secim.length && topla>=haftalikDk) break; secim.push(x); topla+=x.dk; }
  const beyanDk=(+D.haftalikSaat||0)*60;
  const gercekci = beyanDk>0 ? (haftalikDk<=beyanDk) : null;
  return {durum:'ok', hk, kapsamDk, cekDk, haftalikDk, beyanDk, gercekci, secim, secimDk:topla};
}
function tavsiyeUygula(){
  const r=tavsiyeHesap();
  if(r.durum!=='ok' || !r.secim.length){ alert('Verilecek uygun konu bulunamadı.'); return; }
  const gun=today();
  r.secim.forEach((x,i)=>{ D.tasks.push({ id:'s'+Date.now().toString(36)+i, date:gun, sub:x.sub,
    konu:x.konu, q:(x.soru||hedefSoru(x.sub,x.konu)), yap:0, s:0, rutin:false, txt:'Haftalık plan', kendi:true }); });
  save(); render();
}
function tavsiyeHaftalikKart(){
  const r=tavsiyeHesap();
  const ADMAP=Object.fromEntries(subs(D));
  const sar=(ic)=>`<div class="card" style="border:1px solid var(--vurgu)"><h2>Bu haftanın planı<small>Ön koşul + çekirdek + güvenlik payı konuları; seni sınava kadar yetiştiren otomatik plan.</small></h2><div class="body">${ic}</div></div>`;
  if(r.durum==='agirlik') return sar(`<div class="flag warn"><span class="ic">i</span><span>Konu ağırlık verisi yüklenemedi; plan hesaplanamıyor.</span></div>`);
  if(r.durum==='tarih')   return sar(`<div class="flag warn"><span class="ic">i</span><span><b>Sınav tarihini</b> gir (Hedefe uzaklık sekmesi); plan buna göre çıkar.</span></div>`);
  if(r.durum==='gecti')   return sar(`<div class="flag bad"><span class="ic">!</span><span>Sınav tarihi geçmiş görünüyor; plan üretilemedi.</span></div>`);
  if(!r.secim.length)     return sar(`<div class="flag ok"><span class="ic">✓</span><span>Kapsamdaki tüm konuları ya bitirmişsin ya da zaten kendine vermişsin. Yeni plan yok — devam!</span></div>`);

  let valf='';
  if(r.gercekci===false){
    valf=`<div class="flag bad" style="margin-top:2px"><span class="ic">!</span><span>
      <b>Gerçekçilik uyarısı:</b> Bu plan haftada <b>~${saatY(r.haftalikDk/60)}</b> gerektiriyor ama sen haftada <b>${+D.haftalikSaat||0} saat</b> çalıştığını yazmışsın.
      Bu tempoyla yetişmek zor. Ya haftalık süreni artır, ya da güvenlik payı konularını sonraya bırakıp önce çekirdek + ön koşula odaklan
      (o zaman tempo ~${saatY(r.cekDk/r.hk/60)}'e iner).</span></div>`;
  } else if(r.gercekci===true){
    valf=`<div class="flag ok" style="margin-top:2px"><span class="ic">✓</span><span>Bu tempo senin çalışma sürenle (${+D.haftalikSaat||0} saat/hafta) uyumlu — plan gerçekçi.</span></div>`;
  } else {
    valf=`<div class="flag warn" style="margin-top:2px"><span class="ic">i</span><span>Haftalık çalışma süreni girmemişsin; gerçekçilik kontrolü yapılamadı (Hedefe uzaklık sekmesi).</span></div>`;

function cycleT(sk,t){D.topics[sk]=D.topics[sk]||{};D.topics[sk][t]=((D.topics[sk][t]||0)+1)%4;save();render();}
function dersOzet(sk){
  const m=D.topics[sk]||{}; let top=0,bit=0,isl=0,eks=0;
  (KONU[sk]||[]).forEach(([,ks])=>ks.forEach(t=>{const v=m[t]||0;top++;
    if(v===2)bit++;else if(v===1)isl++;else if(v===3)eks++;}));
  return {top,bit,isl,eks,kalan:top-bit,yuzde:top?Math.round(bit/top*100):0};
}

/* ============ HEDEFE GÖRE KONU ÖNCELİĞİ (öğrenci görünümü) ============
   Koç panelindekiyle aynı hesap; sadece etiketler öğrenciye göre yazıldı.
   "GENİŞLEME" yerine "EN SON" denir — çünkü hiçbir konu atlanmaz, SIRA verilir. */
let AGIRLIK=null;
const AGIRLIK_KEY='kocluk_agirlik_v1';
async function agirlikYukle(){
  try{ const c=localStorage.getItem(AGIRLIK_KEY);
    if(c){ const j=JSON.parse(c); if(j&&j.agirlik) AGIRLIK=j; } }catch(e){}
  try{ const r=await fetch('agirlik-2027.json',{cache:'no-cache'});
    if(r.ok){ const j=await r.json();
      if(j&&j.agirlik){ AGIRLIK=j; try{ localStorage.setItem(AGIRLIK_KEY, JSON.stringify(j)); }catch(e){} } }
  }catch(e){}
}
/* Geometri hedefi matematiğe eklenir — konu ağacı birleşik. */
/* Geometri panelde ayrı ders (KONU.tyt_geo / ayt_geo) ve ayrı hedef neti var;
   ağırlık tablosu da öyle bölündü. Birleştirme yapılmaz. */
const BIRLESIK_HEDEF={};
function hedefNet(sk){
  const r=D&&D.refNets; if(!r) return null;
  const liste=BIRLESIK_HEDEF[sk]||[sk];
  let t=0, varMi=false;
  liste.forEach(k=>{ if(r[k]!=null && r[k]!==''){ t+=(+r[k]||0); varMi=true; } });
  return varMi ? t : null;
}
function konuOncelik(sk){
  if(!AGIRLIK || !AGIRLIK.agirlik[sk]) return null;
  const tab=AGIRLIK.agirlik[sk];
  const hedef=hedefNet(sk);
  const kalem=[]; let _s=0;
  for(const [u,ks] of (KONU[sk]||[])) for(const t of ks){
    const a=tab[t]||{soru_yil:0,kilit:false};
    kalem.push({konu:t,unite:u,agirlik:+a.soru_yil||0,kilit:!!a.kilit,mufredat:_s++});
  }
  kalem.sort((x,y)=> y.agirlik-x.agirlik || x.konu.localeCompare(y.konu,'tr'));
  const toplam=kalem.reduce((a,x)=>a+x.agirlik,0)||1;
  const e1 = hedef!=null ? hedef*1.25 : toplam*0.50;
  const e2 = hedef!=null ? hedef*1.55 : toplam*0.80;
  let kum=0; const bilgi={};
  kalem.forEach(x=>{
    kum+=x.agirlik;
    let o = kum<=e1?'once':(kum<=e2?'sonra':'ensons');
    if(x.kilit) o='once';
    x.oncelik=o;
    bilgi[x.konu]={oncelik:o,kilit:x.kilit,agirlik:x.agirlik,
                   kapsam: hedef?Math.min(100,Math.round(kum/hedef*100)):Math.round(kum/toplam*100)};
  });
  /* Ön koşullar kendi kademesinin başına: temel konu, üstüne bina edilenden önce. */
  /* Gruplar: 0 temel (ön koşul) · 1 önce bu · 2 sonra · 3 en son
     Her grup kendi içinde müfredat sırasıyla. */
  const KAD_SIRA={once:1, sonra:2, ensons:3};
  kalem.forEach(x=>{ x.grup = x.kilit ? 0 : KAD_SIRA[x.oncelik]; });
  kalem.sort((x,y)=> (x.grup-y.grup) || (x.mufredat-y.mufredat));
  return {bilgi, hedef, sirali:kalem};
}

  const aytN=anahtar.filter(k=>k.indexOf('ayt_')===0).length;

}

/* ---------- çözülen soru istatistiği ---------- */
function soruIstat(){
  const m={}; let top=0;
  (D.tasks||[]).forEach(t=>{const y=+t.yap||0; if(!y)return; m[t.sub]=(m[t.sub]||0)+y; top+=y;});
  (D.soruGecmis||[]).forEach(r=>{ m[r.k]=(m[r.k]||0)+r.n; top+=r.n; });
  return {m,top};
}
function soruKarti(){
  const {m,top}=soruIstat();
  const l=subs(D).map(([k,nm])=>({k,nm,n:m[k]||0})).filter(x=>x.n).sort((a,b)=>b.n-a.n);
  const enCok=l.length?l[0].n:1;
  return `<div class="card"><h2>Çözdüğün soru — toplam ${top.toLocaleString('tr-TR')}</h2><div class="body">
    ${l.length?l.map(x=>`<div style="display:flex;align-items:center;gap:10px;margin-bottom:9px">
      <div style="width:120px;font-size:13px;flex:none">${x.nm}</div>
      <div style="flex:1;height:16px;background:#E7ECF2;border-radius:3px;overflow:hidden">
        <div style="height:100%;width:${Math.round(x.n/enCok*100)}%;background:var(--accent);border-radius:3px"></div></div>
      <b style="font-family:var(--mono);font-size:13px;width:56px;text-align:right">${x.n.toLocaleString('tr-TR')}</b></div>`).join('')
     :'<div class="empty">Ödevlerinde kaç soru çözdüğünü yazdıkça burası dolar.</div>'}
  </div></div>`;
}

/* ---------- gelişimim: TYT / AYT grafikleri ---------- */
function netOf(e,k){const v=e.n[k]; if(!v) return null; return v.net!==undefined?v.net:net(v.d||0,v.y||0);}
function toplamNet(e){let t=0;for(const s in e.n){const v=netOf(e,s); if(v!==null)t+=v;}return t;}
function cizgi(veri,renk,tavan){
  // veri: [{x:'05-12', y:53.75, ad:'3D TYT-4'}]
  if(veri.length<1) return '<div class="empty">Henüz deneme yok.</div>';
  const w=680,hh=210,sol=16,sag=16,ust=24,alt=32;
  const mx=Math.max(tavan*0.25, ...veri.map(v=>v.y))*1.12;
  const mn=Math.min(0, ...veri.map(v=>v.y));
  const rg=(mx-mn)||1;
  const X=i=>veri.length===1?(sol+(w-sol-sag)/2):sol+i*(w-sol-sag)/(veri.length-1);
  const Y=v=>hh-alt-((v-mn)/rg)*(hh-ust-alt);
  const pts=veri.map((v,i)=>[X(i),Y(v.y)]);
  const cizgiler='';
  const alan=veri.length>1?`<polygon points="${pts.map(p=>p.join(',')).join(' ')} ${pts[pts.length-1][0]},${hh-alt} ${pts[0][0]},${hh-alt}" fill="${renk}" opacity=".10"/>`:'';
  return `<svg viewBox="0 0 ${w} ${hh}" width="100%" height="215" role="img" aria-label="Net gelişimi">
    ${cizgiler}${alan}
    ${veri.length>1?`<polyline fill="none" stroke="${renk}" stroke-width="2.5" stroke-linejoin="round" points="${pts.map(p=>p.join(',')).join(' ')}"/>`:''}
    ${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#fff" stroke="${renk}" stroke-width="2.5"/>
      <text x="${p[0]}" y="${p[1]-11}" text-anchor="middle" font-family="var(--mono)" font-size="11" font-weight="600" fill="${renk}">${n1(veri[i].y)}</text>
      <text x="${p[0]}" y="${hh-12}" text-anchor="middle" font-family="var(--mono)" font-size="9.5" fill="var(--ink-3)">${veri[i].x}</text>`).join('')}
  </svg>`;
}
function dersTrend(exs,liste){
  if(exs.length<1) return '';
  const son=exs.slice(-3);
  return `<table><thead><tr><th>Ders</th><th class="num">Son denemeler</th><th class="num">Ortalama</th></tr></thead><tbody>
  ${liste.map(([k,nm,q])=>{
    const dizi=son.map(e=>netOf(e,k));
    if(dizi.every(v=>v===null)) return '';
    const dolu=dizi.filter(v=>v!==null);
    const ort=dolu.reduce((a,b)=>a+b,0)/dolu.length;
    const yon=dolu.length>1?(dolu[dolu.length-1]-dolu[0]):0;
    return `<tr><td>${nm}</td>
      <td class="num" style="color:var(--ink-3);font-size:12px">${dizi.map(v=>v===null?'·':n1(v)).join(' → ')}</td>
      <td class="num" style="font-weight:650">${n1(ort)} <span style="color:${yon>0.4?'var(--ok)':yon<-0.4?'var(--bad)':'var(--ink-3)'};font-size:11px">${yon>0.4?'▲':yon<-0.4?'▼':'—'}</span></td></tr>`;
  }).join('')}</tbody></table>`;
}
function vGelisim(){

    <table><tbody>${brs.slice().reverse().map(e=>{const ds=Object.keys(e.n)[0];
      return `<tr><td class="num" style="color:var(--ink-3);font-size:12px">${e.date.slice(5)}</td>
      <td><b>${esc(subName(ds))}</b><div style="font-size:11px;color:var(--ink-3)">${esc(e.name||'')}</div></td>
      <td class="num" style="font-weight:650">${n1(toplamNet(e))} net</td></tr>`;}).join('')}
    </tbody></table></div>
    <div class="body" style="border-top:1px solid var(--line-soft)"><div class="hint">Branş denemeleri tek dersten olduğu için ayrı tutulur, TYT/AYT grafiğine karışmaz.</div></div>
  </div>`:''}
  ${!ex.length?`<div class="card"><div class="empty">Deneme girdikçe grafiklerin burada oluşacak. <b>Denememi gir</b> sekmesinden başla.</div></div>`:''}`;

/* ---------- puan hesabı (yaklaşık ham puan modeli) ---------- */
const KTYT={tyt_tur:3.3,tyt_mat:3.3,tyt_geo:3.3,tyt_fiz:3.4,tyt_kim:3.4,tyt_biy:3.4,tyt_tar:3.4,tyt_cog:3.4,tyt_fel:3.4,tyt_din:3.4};
const KAYT={SAY:{ayt_mat:3.0,ayt_geo:3.0,ayt_fiz:2.85,ayt_kim:3.07,ayt_biy:3.07},
  EA:{ayt_mat:3.0,ayt_geo:3.0,ayt_edb:3.0,ayt_tar1:2.8,ayt_cog1:3.33},
  SOZ:{ayt_edb:3.0,ayt_tar1:2.8,ayt_cog1:3.33,ayt_tar2:2.91,ayt_cog2:2.91,ayt_fel:3.0,ayt_din:3.33},
  DIL:{ydt:3.0}};
function puanHesapla(n){
  let t=0; for(const k in KTYT) t+=(+n[k]||0)*KTYT[k];
  let a=0; const ka=KAYT[D.track]||{}; for(const k in ka) a+=(+n[k]||0)*ka[k];
  const obp=(+D.obp||0)*(D.yerlesti?0.06:0.12);
  return {tyt:100+t+obp, yer:100+0.4*t+a+obp};
}
function son3Ort(){
  const ex=[...D.exams].filter(e=>e.tur!=='brans').sort((a,b)=>b.date.localeCompare(a.date)).slice(0,3);
  const s={},c={};
  ex.forEach(e=>{for(const k in e.n){const v=net(e.n[k].d||0,e.n[k].y||0);s[k]=(s[k]||0)+v;c[k]=(c[k]||0)+1;}});
  for(const k in s) s[k]=s[k]/c[k];
  return {nets:s,adet:ex.length};
}
/* ---------- YÖK bölüm veritabanı ---------- */
let ATLAS=null, ATLASDURUM='', ATLASARA='', ATLASSON=[];
const AKEY='ogrenci_atlas_v1';
const LESS={1:'ayt_biy',2:'ayt_cog1',3:'ayt_cog2',4:'ayt_din',5:'ayt_fel',6:'ayt_fiz',7:'ayt_kim',
  8:'ayt_mat',9:'ayt_tar1',10:'ayt_tar2',11:'ayt_edb',13:'tyt_mat',15:'tyt_tur',16:'ydt'};
const FEN={tyt_fiz:7,tyt_kim:7,tyt_biy:6}, SOS={tyt_tar:5,tyt_cog:5,tyt_fel:5,tyt_din:5};
async function atlasDepodan(){
  try{ if(window.storage){const r=await window.storage.get(AKEY); if(r&&r.value) return JSON.parse(r.value);} }catch(e){}
  try{ const s=localStorage.getItem(AKEY); if(s) return JSON.parse(s); }catch(e){}
  return null;
}
async function atlasSakla(js){
  try{ if(window.storage){await window.storage.set(AKEY,js); return true;} }catch(e){}
  try{ localStorage.setItem(AKEY,js); return true; }catch(e){ return false; }
}
function atlasAdaylari(){
  const a=['atlas.json','Atlas.json','ATLAS.json','atlas (1).json','data/atlas.json'];
  const kok=location.origin+location.pathname.replace(/[^/]*$/,'');
  const l=a.map(x=>kok+x);
  if(D.url){ const s=D.url.replace(/\/?$/,'/'); a.forEach(x=>l.push(s+x)); }
  return [...new Set(l)];
}
async function atlasYukle(){
  if(ATLAS) return true;
  ATLASDURUM='Aranıyor...'; render();
  const d=await atlasDepodan();
  if(d&&d.length){ ATLAS=d; ATLASDURUM=''; render(); return true; }
  for(const url of atlasAdaylari()){
    try{
      const r=await fetch(url+'?v='+Date.now(),{cache:'no-store'});
      if(!r.ok) continue;
      const js=await r.text(); const pp=JSON.parse(js);
      if(!Array.isArray(pp)||!pp.length) continue;
      ATLAS=pp; await atlasSakla(js); ATLASDURUM=''; render();
      alert(pp.length.toLocaleString('tr-TR')+' bölüm yüklendi.'); return true;
    }catch(e){}
  }
  ATLAS=null; ATLASDURUM='YOK'; render(); return false;
}
function atlasAra(q){
  ATLASARA=q;
  if(!ATLAS||q.trim().length<3){ATLASSON=[];render();return;}
  const pt=({SAY:'SAY',EA:'EA',SOZ:'SÖZ',DIL:'DİL'})[D.track];
  const kel=norm(q).split(' ').filter(Boolean), bul=[];
  for(const r of ATLAS){
    if(pt&&r[3]!==pt) continue;
    const m=norm(r[1]+' '+r[2]+' '+r[4]);
    if(!kel.every(k=>m.includes(k))) continue;
    bul.push(r); if(bul.length>=400) break;
  }
  bul.sort((a,b)=>(b[8]||0)-(a[8]||0));
  ATLASSON=bul.slice(0,30); render();
}
function atlasSec(kod){
  const r=ATLAS.find(x=>x[0]===kod); if(!r) return;
  D.hedef=D.hedef||{}; D.hedef.refNets=D.hedef.refNets||{};
  D.hedef.dept=r[1]+' — '+r[2]+(r[4]&&r[4]!=='Ücretsiz'?' ('+r[4]+')':'');
  if(r[8]!=null) D.hedef.score=String(Math.ceil(r[8]));
  if(r[9]!=null) D.hedef.rank=r[9].toLocaleString('tr-TR');
  if(r[8]!=null) D.hedef.tabanPuan=String(r[8]).replace('.',',');
  if(r[9]!=null) D.hedef.tabanSira=r[9].toLocaleString('tr-TR');
  D.hedef.tabanYil=String(r[5]);
  const n=r[11]||{}, gecerli=new Set(subs(D).map(x=>x[0]));
  let yaz=0;
  for(const id in n){ const v=n[id];
    if(id==='12'){ for(const k in FEN) if(gecerli.has(k)){D.hedef.refNets[k]=Math.round(v*FEN[k]/20*100)/100;yaz++;} }
    else if(id==='14'){ for(const k in SOS) if(gecerli.has(k)){D.hedef.refNets[k]=Math.round(v*SOS[k]/20*100)/100;yaz++;} }
    else { const k=LESS[id]; if(k&&gecerli.has(k)){D.hedef.refNets[k]=v;yaz++;} } }
  ATLASSON=[]; ATLASARA=''; save(); render();
  alert(`${r[2]} seçildi.\n\nTaban puan: ${r[8]??'—'}\nBaşarı sırası: ${r[9]!=null?r[9].toLocaleString('tr-TR'):'—'}\nKontenjan: ${r[6]??'—'}\nVeri yılı: ${r[5]}\n\n${yaz} ders için hedef net dolduruldu.\n\nRapor gönderdiğinde öğretmenine iletilecek.`);
}

      <div class="v">${hk===null?'—':hk}</div>
      <div class="n">${hk===null?'sınav tarihi gir':'hafta'}</div></div>

/* ---------- rapor ---------- */
/* Konu adlarını sıra numarasına çevirir — iki panelde KONU ağacı özdeş olduğu için güvenli.
   "CANLILARIN YAPISINDA BULUNAN TEMEL BİLEŞİKLER" (44 karakter) yerine 12 yazılır. */
function konuIndeksle(topics){
  // Ardışık konu numaralarını aralık olarak yazar: "0-40,45,47" gibi.
  const out={};
  for(const sk in topics){
    const duz=(KONU[sk]||[]).flatMap(u=>u[1]);
    const grup={}, adli=[];
    for(const t in topics[sk]){
      const d=topics[sk][t], i=duz.indexOf(t);
      if(i>=0){ (grup[d]=grup[d]||[]).push(i); } else adli.push([t,d]);
    }
    const par={};
    for(const d in grup){
      const a=grup[d].sort((x,y)=>x-y), pr=[];
      let bas=a[0], on=a[0];
      for(let j=1;j<=a.length;j++){
        if(a[j]===on+1){ on=a[j]; continue; }
        pr.push(bas===on?String(bas):bas+'-'+on);
        bas=a[j]; on=a[j];
      }
      par[d]=pr.join(',');
    }
    if(Object.keys(par).length||adli.length) out[sk]={r:par,a:adli};
  }
  return out;
}
function konuAcik(k){
  const topics={};
  for(const sk in (k||{})){
    const duz=(KONU[sk]||[]).flatMap(u=>u[1]); topics[sk]={};
    const blok=k[sk];
    if(Array.isArray(blok)){ // eski biçim
      blok.forEach(([i,d])=>{ const ad=typeof i==='number'?duz[i]:i; if(ad!==undefined) topics[sk][ad]=d; });
      continue;
    }
    for(const d in (blok.r||{})){
      String(blok.r[d]).split(',').filter(Boolean).forEach(par=>{
        const [a,b]=par.split('-').map(Number);
        for(let i=a;i<=(isNaN(b)?a:b);i++){ if(duz[i]!==undefined) topics[sk][duz[i]]=+d; }
      });
    }
    (blok.a||[]).forEach(([ad,d])=>topics[sk][ad]=d);
  }
  return topics;
}
function raporKodu(){
  // daha önce gönderilmiş deneme ve çalışmalar tekrar yollanmaz — rapor zamanla şişmez
  const yeniEx=(D.exams||[]).filter(e=>!e.g);
  const yeniEk=(D.ekstra||[]).filter(x=>!x.g);
  const p={v:2,id:D.id,ad:D.ad,
    t:D.tasks.filter(x=>!x.ark).map(x=>[x.id,x.s,x.yap||0]),
    k:konuIndeksle(D.topics||{}),
    e:yeniEx.map(e=>({d:e.date,a:e.name||'',u:e.tur||'tyt',n:e.n})),
    x:yeniEk.map(x=>({i:x.id,d:x.date,s:x.sub,k:x.konu,q:x.q||0,y:x.yap||0,z:x.s||1})),
    h:D.hedef||null,
    n:(document.getElementById('rNot')?.value||'').slice(0,500)};
  const js=JSON.stringify(p);
  const sik='KOCRAPOR2:'+sikistir(js), duz='KOCRAPOR1:'+b64e(js);
  return sik.length<duz.length ? sik : duz;
}

function kopyala(){

let RKISA=null, RHAZIR=false, RDURUM='';
async function kisaKodHazirla(){
  if(!D.kopru){ alert('Öğretmenin köprü kurmamış. Uzun kodu gönderebilirsin, o da çalışır.'); return; }
  RHAZIR=false; RDURUM='Hazırlanıyor...'; render();
  try{
    const anahtar=await kopruYaz(D.kopru, raporKodu());
    RKISA='KOCM:'+D.kopru+'.'+anahtar;
    RHAZIR=true; RDURUM='OK|Kısa kod hazır ('+RKISA.length+' karakter). Şimdi gönder.';
    gonderildiIsaretle();
  }catch(e){ RKISA=null; RDURUM='HATA|'+e.message; }
  render();
}
function raporLink(){
  if(RHAZIR&&RKISA) return RKISA;
  const k=raporKodu();
  return D.url ? D.url.replace(/\/?$/,'/')+'kocluk-paneli.html#'+encodeURIComponent(k) : k;
}
async function notGonder(){
  const el=document.getElementById('rNot'); const m=(el&&el.value||'').trim();
  if(!m){ alert('Önce bir not yaz.'); return; }
  try{ await ogrNotGonder(m); await ogrSunucuyaYaz();
    if(el) el.value=''; D.not=''; save(); render();
    alert('Notun ve bu haftaki çalışman öğretmenine iletildi.');
  }catch(e){ alert('Gönderilemedi: '+(e.message||e)); }
}
function waGonder(){
  const k=raporLink();
  const bas=`${D.ad} — haftalık rapor (${today()})\n`;

  const url=(tel?`https://wa.me/${tel}`:'https://wa.me/')+'?text='+encodeURIComponent(bas+k);
  window.open(url,'_blank','noopener');
  gonderildiIsaretle(); render();
}

function yedekAl(){

function yedekYukle(ev){
  const f=ev.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);
    if(!d.id){alert('Bu dosya bir çalışma yedeği değil.');return;}
    if(!confirm('Mevcut veriler bu yedekle değiştirilecek. Devam?'))return;
    D=d; save(); TAB='odev'; render();
  }catch(e){alert('Dosya okunamadı.');}};
  r.readAsText(f); ev.target.value='';
}

/* ---------- DAVET LİNKİNDEN KURULUM ---------- */
function davettenKur(hs){
  const m=hs.match(/^KUR:([A-Za-z0-9_\-]+)$/);
  if(!m) return false;
  try{
    const s=m[1].replace(/-/g,'+').replace(/_/g,'/');
    const p=JSON.parse(b64d(s+'==='.slice((s.length+3)%4)));
    if(!p.u||!p.k) return false;
    SB.url=p.u; SB.key=p.k; sbSakla();
    BEKLEYENKOD=(p.d||'').toUpperCase();
    return true;
  }catch(e){ return false; }
}
/* giriş/kayıt sonrası: bekleyen kod varsa kendiliğinden bağlan */
async function otoBaglan(){
  if(!BEKLEYENKOD) return false;
  try{
    const r=await ogrBaglan(BEKLEYENKOD);
    if(r&&r.ok){ BEKLEYENKOD=''; return true; }
    GHATA=(r&&r.hata)||'Kod kabul edilmedi'; BEKLEYENKOD='';
  }catch(e){ GHATA=e.message||String(e); BEKLEYENKOD=''; }
  return false;
}

let GMOD='giris', GHATA='', GBEKLE=false, SYAZ='', SKUYRUK=null, BEKLEYENKOD='';
function sbAyarla(a,v){ SB[a]=v.trim(); sbSakla(); render(); }
async function gTest(){

async function teshisAl(){

async function gSifreUnuttum(){
  const m=(document.getElementById('gMail')?.value||'').trim();
  if(!m){ GHATA='Önce e-posta adresini yaz, sonra bu bağlantıya bas.'; render(); return; }
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(m)){ GHATA='Geçerli bir e-posta adresi yaz.'; render(); return; }
  GBEKLE=true; GHATA=''; render();
  try{
    /* redirect_to GÖVDEDE değil SORGUDA gönderilir; yoksa Supabase
       Site URL'e (tanıtım sayfası) düşer ve şifre ekranı hiç açılmaz. */
    const geri = encodeURIComponent(location.origin+location.pathname);
    await sbCagri('/auth/v1/recover?redirect_to='+geri,{method:'POST',body:{ email:m }});
    GHATA='OK|'+m+' adresine sıfırlama bağlantısı gönderildi.\nGelen kutunu ve gereksiz/spam klasörünü kontrol et.';
  }catch(e){
    GHATA = /rate|limit|too many/i.test(e.message||'')
      ? 'Çok fazla deneme yapıldı. Birkaç dakika bekle.'
      : 'Gönderilemedi. Öğretmeninden yardım iste.';
  }
  GBEKLE=false; render();
}
async function gYeniSifre(){
  const a=document.getElementById('nS1').value, b=document.getElementById('nS2').value;
  if(a.length<8){ GHATA='Şifre en az 8 karakter olmalı.'; render(); return; }
  if(a!==b){ GHATA='İki şifre aynı değil.'; render(); return; }
  GBEKLE=true; GHATA=''; render();
  try{
    await sbCagri('/auth/v1/user',{method:'PUT',body:{password:a}});
    GMOD='giris'; GHATA='OK|Şifren değiştirildi. Yeni şifrenle giriş yap.'; sbCikis();
  }catch(e){ GHATA='Değiştirilemedi: '+(e.message||e); }
  GBEKLE=false; render();
}
async function gGiris(){
  const m=document.getElementById('gMail').value.trim(), s=document.getElementById('gSifre').value;
  if(!m||!s){ GHATA='E-posta ve şifre gerekli.'; render(); return; }
  if(GMOD==='kayit'){
    const m2=(document.getElementById('gMail2')?.value||'').trim();
    if(m.toLowerCase()!==m2.toLowerCase()){
      GHATA='İki e-posta aynı değil. Yazdığını kontrol et — şifreni unutursan bu adrese gerek duyacaksın.';
      render(); return;
    }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(m)){ GHATA='E-posta adresi geçerli görünmüyor.'; render(); return; }
    const s2=(document.getElementById('gSifre2')?.value||'');
    if(s!==s2){ GHATA='İki şifre aynı değil.'; render(); return; }
    const kod=(document.getElementById('gKodK')?.value||'').trim();
    if(!kod){ GHATA='Öğretmeninin verdiği 6 haneli kodu yaz.'; render(); return; }
    BEKLEYENKOD=kod.toUpperCase().replace(/[^A-Z0-9]/g,'');
  }
  GBEKLE=true; GHATA=''; render();
  try{
    if(GMOD==='kayit'){
      if(s.length<8) throw new Error('Şifre en az 8 karakter olmalı');
      const r=await sbCagri('/auth/v1/signup',{method:'POST',body:{email:m,password:s,data:{rol:'ogrenci'}}});
      if(r&&r.access_token) sbOturumKur(r);
      else {
        // e-posta doğrulaması açıksa oturum gelmez
        GBEKLE=false;
        GHATA='OK|Hesabın açıldı. E-postana gelen bağlantıya tıkla, sonra buradan giriş yap.';
        GMOD='giris'; render(); return;
      }
    } else await sbGiris(m,s);
    await sunucuAc();
  }catch(e){
    const ham=(e&&e.message)?String(e.message):String(e);
    GHATA =
        /invalid login/i.test(ham) ? 'E-posta ya da şifre yanlış.'
      : /already registered|already exists|user_already/i.test(ham)
        ? 'Bu e-posta ile zaten bir hesap var.\n\nDaha önce kayıt olduysan "Zaten hesabım var" deyip giriş yap.\nŞifreni unuttuysan "Şifremi unuttum" bağlantısını kullan.'
      : /signups?[ _](are[ _])?(not[ _]allowed|disabled)|signup_disabled/i.test(ham)
        ? 'Yeni kayıtlar şu an kapalı. Öğretmenine haber ver.'
      : /over_email_send_rate|email[ _]rate[ _]limit|only request this after/i.test(ham)
        ? 'Sunucunun e-posta sınırına takıldı.\n\nHesabın YİNE DE açılmış olabilir: "Zaten hesabım var" deyip aynı e-posta ve şifreyle giriş yapmayı dene.\n\nOlmazsa birkaç dakika sonra tekrar dene.'
      : /over_request_rate|too many requests|429/i.test(ham)
        ? 'Çok hızlı denendi. Yarım dakika bekleyip tekrar dene.'
      : /password/i.test(ham) && /short|least|weak/i.test(ham)
        ? 'Şifre çok kısa ya da zayıf. En az 8 karakter, harf ve rakam karışık olsun.'
      : /database error|unexpected_failure/i.test(ham)
        ? 'Sunucu kaydı oluşturamadı. Öğretmenine haber ver.\n\nTeknik ayrıntı: '+ham
      : ham + '\n\n(Bu mesajı öğretmenine iletebilirsin.)';
  }
  GBEKLE=false; render();
}

async function gKodGir(){
  const k=document.getElementById('gKod').value.trim();
  if(!k){ GHATA='Öğretmeninin verdiği kodu yaz.'; render(); return; }
  GBEKLE=true; GHATA=''; render();
  try{
    const r=await ogrBaglan(k);
    if(!r||!r.ok) throw new Error((r&&r.hata)||'Kod kabul edilmedi');
    await sunucuAc();
  }catch(e){ GHATA=e.message||String(e); }
  GBEKLE=false; render();

async function sunucuAc(){
  if(BEKLEYENKOD) await otoBaglan();
  const d=await ogrSunucudanOku();
  if(!d){
    GMOD='kod';
    if(!GHATA) GHATA='Hesabın açıldı. Şimdi öğretmeninin verdiği kodu gir.';
    render(); return;
  }
  if(SONKIM && SONKIM.lisans===false){
    if(SONKIM.solo){
      /* Koçsuz öğrenci: deneme süresi doldu. Veriler duruyor, panel donuk.
         Paket ekranına düşer, WhatsApp'tan iletişime geçer. */
      SOLO=true; GMOD='paket'; GHATA=''; render(); return;
    }
    GHATA='Öğretmeninin kullanım süresi dolmuş. Ödevlerin duruyor ama panel şu an açılamıyor.\nÖğretmenine haber ver.';
    GMOD='giris'; render(); return;
  }
  D=d; try{ localStorage.setItem(KEY,JSON.stringify(D)); }catch(e){}
  TAB='odev'; GHATA=''; render();
}
function sunucuKaydet(){
  if(!sbOturum()||!OGRID) return;
  clearTimeout(SKUYRUK);
  SKUYRUK=setTimeout(async()=>{
    try{ SYAZ='y'; sYaz(); await ogrSunucuyaYaz(); SYAZ='ok'; sYaz();
      setTimeout(()=>{ if(SYAZ==='ok'){SYAZ='';sYaz();} },1600);
    }catch(e){ SYAZ='h|'+(e.message||e); sYaz(); }
  },900);
}
function sYaz(){
  const el=document.getElementById('sbDurum'); if(!el) return;
  el.innerHTML = SYAZ==='y'?'<span style="color:#7E9BB8">kaydediliyor…</span>'
    : SYAZ==='ok'?'<span style="color:#7FD1A8">✓ kaydedildi</span>'
    : SYAZ.startsWith('h|')?'<span style="color:#F0A79C">⚠ kaydedilemedi</span>' : '';
}
async function sbCikisYap(){

  sbCikis(); OGRID=null; D=null; GMOD='giris'; GHATA=''; render();

    <div class="hint" style="margin-bottom:10px">

    <div class="fr">
      <div style="flex:2"><label class="f">Adın</label>

        <select id="gSoloAlan">
          <option value="SAY">Sayısal</option><option value="EA">Eşit Ağırlık</option>
          <option value="SOZ">Sözel</option><option value="DIL">Dil</option>

    <button class="btn wide" style="margin-top:10px" ${GBEKLE?'disabled':''} onclick="soloKur()">

    ${GMOD==='kayit'&&BEKLEYENKOD?`<div class="flag ok" style="margin-bottom:12px"><span class="ic">✓</span><span>

/* ---------- nereden açıldı? ---------- */
function kaynakUyarisi(){
  if(location.protocol!=='file:') return '';
  return `<div class="card" style="border:2px solid var(--bad)"><div class="body">
    <div class="flag bad"><span class="ic">!</span><span>
      <b>Bu paneli bilgisayardaki dosyadan açtın.</b><br>
      Öğretmeninin gönderdiği <b>internet adresinden</b> açman gerekiyor; yoksa güncellemeler gelmez ve
      işaretlerin bu dosyaya hapsolur. Öğretmeninin mesajındaki bağlantıyı kullan.</span></div>
  </div></div>`;
}

/* ---------- açılış ---------- */
(async()=>{
  sbYukle();
  agirlikYukle().then(()=>{ try{render();}catch(e){} });
  const hh=location.hash||'';
  /* ---- ŞİFRE SIFIRLAMA: üç olası biçim de tanınır ---- */
  {
    const qp = new URLSearchParams(location.search||'');
    const hp = new URLSearchParams((location.hash||'').replace(/^#/,''));

    const hata = hp.get('error_code')||hp.get('error')||qp.get('error_code')||qp.get('error');
    if(hata){
      history.replaceState(null,'',location.pathname);
      GHATA = /expired|otp/i.test(hata)
        ? 'Bu bağlantı artık geçerli değil. Bağlantılar tek kullanımlıktır ve 1 saat geçerlidir. Öğretmeninden yeni bağlantı iste.'
        : 'Bağlantı doğrulanamadı. Yeni bir bağlantı iste.';
      GMOD='giris'; render(); return;
    }

    if(hh.indexOf('type=recovery')>=0 && hp.get('access_token')){
      SB.tok=hp.get('access_token'); SB.ref=hp.get('refresh_token')||''; sbSakla();
      history.replaceState(null,'',location.pathname);
      GMOD='yenisifre'; render(); return;
    }
    if(qp.get('token_hash') && (qp.get('type')||'')==='recovery'){
      try{
        const r = await sbCagri('/auth/v1/verify',{method:'POST',
          body:{ type:'recovery', token_hash: qp.get('token_hash') }});
        if(r && r.access_token){
          SB.tok=r.access_token; SB.ref=r.refresh_token||''; sbSakla();
          history.replaceState(null,'',location.pathname);
          GMOD='yenisifre'; render(); return;
        }
      }catch(e){
        history.replaceState(null,'',location.pathname);
        GHATA='Bağlantı geçersiz ya da süresi dolmuş. Öğretmeninden yeni bağlantı iste.';
        GMOD='giris'; render(); return;
      }
    }
    if(qp.get('code')){
      try{
        const r = await sbCagri('/auth/v1/token?grant_type=pkce',{method:'POST',
          body:{ auth_code: qp.get('code') }});
        if(r && r.access_token){
          SB.tok=r.access_token; SB.ref=r.refresh_token||''; sbSakla();
          history.replaceState(null,'',location.pathname);
          GMOD='yenisifre'; render(); return;
        }
      }catch(e){
        history.replaceState(null,'',location.pathname);
        GHATA='Bağlantı doğrulanamadı. Yeni bir bağlantı iste.';
        GMOD='giris'; render(); return;
      }
    }
  }
  const hs0=decodeURIComponent(location.hash.slice(1)||'');
  if(hs0.indexOf('KUR:')===0 && davettenKur(hs0)){
    history.replaceState(null,'',location.pathname+location.search);
    // Davet linki her zaman KAYIT ekranını açar.
    // Cihazda başka birinin oturumu kalmış olabilir; onu kapatıyoruz ki
    // öğrenci başkasının hesabına bağlanmasın.
    sbCikis(); OGRID=null; D=null;
    GMOD='kayit'; render(); return;
  }
  if(sbOturum()){
    try{ const dd=await ogrSunucudanOku();
      if(dd){ D=dd; render(); return; }
      GMOD='kod'; render(); return;
    }catch(e){
      if(e.kod===401){ try{ await sbTazele(); const dd=await ogrSunucudanOku(); if(dd){D=dd;render();return;} }catch(e2){ sbCikis(); } }
      else GHATA='Sunucuya ulaşılamadı: '+(e.message||e);
    }
  }
  const d=await load(); if(d&&d.id) D=d;
  render();
  const hs=decodeURIComponent(location.hash.slice(1)||'');
  const km=hs.match(/^KM:([A-Za-z0-9_\-]+)\.([A-Za-z0-9]+)$/);
  if(km){
    const v=document.getElementById('view');
    if(v) v.innerHTML='<div class="card"><div class="empty">Ödevlerin indiriliyor...</div></div>';
    try{
      const kod=await kopruOku(km[1],km[2]);
      history.replaceState(null,'',location.pathname+location.search);
      paketYukle(kod);
    }catch(e){
      if(v) v.innerHTML=`<div class="card"><div class="body"><div class="flag bad"><span class="ic">!</span><span>
        <b>Ödevler indirilemedi.</b> ${esc(e.message)}<br><br>
        İnternete bağlı olduğundan emin ol ve linke yeniden tıkla.
        Sorun sürerse öğretmeninden yeni link iste.</span></div></div></div>`;
    }
    return;
  }
  if(/KOCPAKET[12]:/.test(hs)){
    history.replaceState(null,'',location.pathname+location.search);
    paketYukle(hs);
  }
})();
</script>
