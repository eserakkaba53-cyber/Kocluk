<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Çalışma Panelim</title>
<style>
:root{
  --ink:#1B2418; --ink-2:#4A5744; --ink-3:#8A9683;
  --paper:#EFF1EC; --panel:#FFFFFF; --line:#CFD6C8; --line-soft:#E4E9DF;
  --accent:#4F6B2A; --accent-soft:#E3EDD5;
  --ok:#3F7D3A; --warn:#B0710A; --bad:#A73A2C;
  --ok-bg:#E6F0E2; --warn-bg:#F8EEDA; --bad-bg:#F6E3E0;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:"SF Mono",'JetBrains Mono',Consolas,"Liberation Mono",Menlo,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
button{font-family:inherit;font-size:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding:0 14px 70px}
.hdr{background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.hdr .in{max-width:860px;margin:0 auto;padding:14px 14px 0}
.hdr h1{margin:0;font-size:20px;font-weight:650;letter-spacing:-.01em}
.hdr .meta{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);margin-top:2px}
.tabs{display:flex;gap:2px;margin-top:12px;overflow-x:auto}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:9px 13px;color:var(--ink-2);font-size:14px;font-weight:550;white-space:nowrap}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;margin:16px 0}
.card>h2{margin:0;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);padding:13px 16px;border-bottom:1px solid var(--line-soft);font-weight:650}
.card .body{padding:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line-soft)}
.stat{background:var(--panel);padding:14px 16px}
.stat .k{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:650}
.stat .v{font-family:var(--mono);font-size:24px;font-weight:600;letter-spacing:-.02em;margin-top:2px}
.stat .n{font-size:11.5px;color:var(--ink-3)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:650;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
td.num,th.num{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
label.f{display:block;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:650;margin-bottom:4px}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:6px;background:#FCFDFB;color:var(--ink)}
input[type=number]{font-family:var(--mono);text-align:right}
.fr{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.fr>div{flex:1;min-width:130px}
.btn{background:var(--accent);color:#fff;border:0;padding:11px 18px;border-radius:6px;font-weight:600;font-size:14px}
.btn:hover{background:#3F5622}
.btn.ghost{background:none;color:var(--accent);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.mini{padding:5px 11px;font-size:12.5px}
.btn.wide{width:100%;padding:14px;font-size:15px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{background:#fff;border:0;padding:6px 10px;font-size:12.5px;font-weight:600;color:var(--ink-3);border-right:1px solid var(--line-soft)}
.seg button:last-child{border-right:0}
.seg button.on{color:#fff}
.seg button.on[data-v="1"]{background:var(--ok)}
.seg button.on[data-v="2"]{background:var(--warn)}
.seg button.on[data-v="3"]{background:var(--bad)}
.seg button.on[data-v="0"]{background:var(--ink-3)}
.flag{display:flex;gap:10px;padding:12px 14px;border-radius:6px;margin-bottom:10px;font-size:14px;align-items:flex-start}
.flag.ok{background:var(--ok-bg);color:#2C5A28}
.flag.warn{background:var(--warn-bg);color:#7A4E06}
.flag.bad{background:var(--bad-bg);color:#7C2B20}
.flag .ic{font-family:var(--mono);font-weight:700;flex:none}
.topic{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line-soft);border-radius:6px;background:#FCFDFB;font-size:13.5px;margin-bottom:6px}
.topic .tn{flex:1;min-width:0}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.dot.t0{background:#DCE2D6}.dot.t1{background:#D8A63C}.dot.t2{background:var(--ok)}.dot.t3{background:var(--bad)}
.sec-h{display:flex;align-items:center;gap:10px;margin:16px 0 8px}
.sec-h h3{margin:0;font-size:14px;font-weight:650}
.empty{padding:30px 16px;text-align:center;color:var(--ink-3);font-size:14px}
.hint{font-size:12.5px;color:var(--ink-3);margin-top:6px}
.big{font-family:var(--mono);font-size:12px;word-break:break-all;background:#F5F7F2;border:1px solid var(--line-soft);border-radius:6px;padding:10px;max-height:150px;overflow:auto}
progress{width:100%;height:9px}
</style>

const S={

       ['tyt_kim','TYT Kimya',7],['tyt_biy','TYT Biyoloji',6],['tyt_tar','TYT Tarih',5],

  SAY:[['ayt_mat','AYT Matematik',40],['ayt_fiz','AYT Fizik',14],['ayt_kim','AYT Kimya',13],['ayt_biy','AYT Biyoloji',13]],
  EA :[['ayt_mat','AYT Matematik',40],['ayt_edb','AYT Edebiyat',24],['ayt_tar1','AYT Tarih-1',10],['ayt_cog1','AYT Coğrafya-1',6]],
  SOZ:[['ayt_edb','AYT Edebiyat',24],['ayt_tar1','AYT Tarih-1',10],['ayt_cog1','AYT Coğrafya-1',6],

const subs=st=>S.TYT.concat(S[st.track]||[]);
const subName=k=>{for(const g in S)for(const s of S[g])if(s[0]===k)return s[1];return k;};
const subQ=k=>{for(const g in S)for(const s of S[g])if(s[0]===k)return s[2];return 0;};
const uniteOf={}; for(const k in KONU){uniteOf[k]={};KONU[k].forEach(([u,ks])=>ks.forEach(t=>uniteOf[k][t]=u));}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const n1=v=>(Math.round(v*100)/100).toFixed(2).replace(/\.00$/,'');
const today=()=>new Date().toISOString().slice(0,10);
const uid=()=>Math.random().toString(36).slice(2,9);
const net=(d,y)=>d-y/4;
const SL=['Bekliyor','Yaptım','Yarım','Yapamadım'];
const TL=['Görmedim','İşliyorum','Bitirdim','Eksiğim var'];

let D=null, TAB='odev', KSUB=null;
const TABS=[['odev','Ödevlerim'],['konu','Konularım'],['deneme','Denememi gir'],['rapor','Rapor gönder'],['ayar','Ayarlar']];

/* ---------- paket yükleme ---------- */
function hashKod(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return (h>>>0).toString(36);}
function paketYukle(metin){
  const t=(metin!==undefined?metin:(document.getElementById('pkText')?.value||'')).trim();
  const m=t.match(/KOCPAKET1:([A-Za-z0-9+/=]+)/);
  if(!m){alert('Geçerli bir davet kodu bulunamadı. Öğretmeninin gönderdiği "KOCPAKET1:" ile başlayan metnin tamamını yapıştır.');return;}
  const hk=hashKod(m[1]);
  if(D&&D.sonPaket===hk){ alert('Bu paketi zaten yüklemiştin ('+(D.sonPaketT||'')+'). Yeni bir şey eklenmedi.'); TAB='odev'; render(); return; }
  try{
    const p=JSON.parse(b64d(m[1]));
    if(D&&D.id===p.id){ // güncelleme: kendi işaretlerini koru, ödevleri tazele
      D.tasks=p.tasks; D.ad=p.ad; D.track=p.track; D.grade=p.grade;
      D.dept=p.dept; D.rank=p.rank; D.sinav=p.sinav; D.tel=p.tel;
    }else{
      D={id:p.id,ad:p.ad,track:p.track,grade:p.grade,dept:p.dept,rank:p.rank,sinav:p.sinav,tel:p.tel,
         tasks:p.tasks||[],topics:p.topics||{},exams:[],not:''};
    }
    D.sonPaket=hk; D.sonPaketT=today(); D.url=p.url||D.url||'';
    save(); TAB='odev'; render();
    alert('Paket yüklendi. '+(D.tasks.length)+' ödev var.');
  }catch(e){alert('Kod okunamadı, eksik kopyalanmış olabilir. Tamamını yeniden yapıştır.');}
}
function haftaKalan(){ if(!D.sinav) return null; const d=(new Date(D.sinav)-new Date())/86400000; return d>0?Math.floor(d/7):0; }

/* ---------- görünüm ---------- */
function render(){
  const v=document.getElementById('view');
  if(!D){
    document.getElementById('hAd').textContent='Çalışma Panelim';
    document.getElementById('hMeta').textContent='';
    document.getElementById('tabs').innerHTML='';
    v.innerHTML=`<div class="card"><h2>Başlarken</h2><div class="body">
      <div class="flag ok"><span class="ic">1</span><span>Öğretmenin sana WhatsApp'tan bir <b>davet kodu</b> gönderdi. "KOCPAKET1:" ile başlayan metnin tamamını kopyala.</span></div>
      <div class="flag ok"><span class="ic">2</span><span>Aşağıya yapıştır ve <b>Paketi yükle</b>'ye bas.</span></div>
      <div class="flag ok"><span class="ic">3</span><span>Bu sayfayı yer imlerine ekle. Bilgilerin sadece bu cihazda tutulur, hiçbir yere gönderilmez.</span></div>
      <textarea id="pkText" rows="5" placeholder="KOCPAKET1:..." style="margin-top:10px"></textarea>
      <button class="btn wide" style="margin-top:12px" onclick="paketYukle()">Paketi yükle</button>
    </div></div>`;
    return;
  }
  document.getElementById('hAd').textContent=D.ad;
  const hk=haftaKalan();
  document.getElementById('hMeta').textContent=
    [D.grade+'. SINIF', D.dept?D.dept.toUpperCase():null, hk!==null?'SINAVA '+hk+' HAFTA':null].filter(Boolean).join(' · ');
  document.getElementById('tabs').innerHTML=TABS.map(t=>`<button class="tab ${TAB===t[0]?'on':''}" onclick="TAB='${t[0]}';render()">${t[1]}</button>`).join('');
  v.innerHTML=({odev:vOdev,konu:vKonu,deneme:vDeneme,rapor:vRapor,ayar:vAyar})[TAB]();
}

/* ---------- ödevlerim ---------- */
function setTask(id,s){const t=D.tasks.find(x=>x.id===id); if(t){t.s=s;save();render();}}
function setYap(id,v){const t=D.tasks.find(x=>x.id===id); if(!t)return;
  t.yap=Math.max(0,+v||0); const o=t.q?t.yap/t.q:0; t.s=o>=0.9?1:o>0?2:0; save(); render();}
function vOdev(){
  const rut=D.tasks.filter(t=>t.rutin), kon=D.tasks.filter(t=>!t.rutin).sort((a,b)=>a.date.localeCompare(b.date));
  const bit=D.tasks.filter(t=>t.s===1).length;
  return `
  <div class="card"><div class="stats">
    <div class="stat"><div class="k">Bu hafta</div><div class="v">${D.tasks.length}</div><div class="n">ödev var</div></div>
    <div class="stat"><div class="k">Tamamladığın</div><div class="v" style="color:var(--ok)">${bit}</div><div class="n">${D.tasks.length?Math.round(bit/D.tasks.length*100):0}%</div></div>
    <div class="stat"><div class="k">Kalan</div><div class="v" style="color:${D.tasks.length-bit?'var(--warn)':'var(--ok)'}">${D.tasks.length-bit}</div><div class="n">ödev</div></div>
  </div></div>

  ${rut.length?`<div class="card"><h2>Sabit rutin — her hafta zorunlu</h2><div class="body">
    ${rut.map(t=>{const o=t.q?Math.min(100,Math.round((t.yap||0)/t.q*100)):0;
      return `<div style="margin-bottom:16px">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
          <b style="flex:1">${esc(t.konu)}</b>
          <input type="number" min="0" value="${t.yap||0}" onchange="setYap('${t.id}',this.value)" style="width:90px">
          <span style="color:var(--ink-3);font-family:var(--mono);font-size:13px">/ ${t.q}</span></div>
        <progress value="${o}" max="100"></progress>
        <div class="hint">Kaç tane yaptıysan yaz. Günde ~${Math.ceil(t.q/7)} soru hedefle.</div>
      </div>`;}).join('')}
  </div></div>`:''}

  <div class="card"><h2>Konu ödevleri</h2><div class="body">
    ${kon.length?kon.map(t=>`<div style="padding:12px 0;border-bottom:1px solid var(--line-soft)">
      <div style="font-size:11px;color:var(--ink-3);font-family:var(--mono)">${t.date} · ${subName(t.sub)}${t.q?' · '+t.q+' soru':''}</div>
      <div style="font-weight:600;margin:3px 0 8px">${esc(t.konu||'—')}</div>
      ${t.txt&&t.txt!=='Sabit haftalık rutin'?`<div style="font-size:13px;color:var(--ink-2);margin-bottom:8px">${esc(t.txt)}</div>`:''}
      <div class="seg">${[1,2,3].map(s=>`<button data-v="${s}" class="${t.s===s?'on':''}" onclick="setTask('${t.id}',${s})">${SL[s]}</button>`).join('')}</div>
    </div>`).join(''):'<div class="empty">Bu hafta konu ödevi yok.</div>'}
  </div></div>`;
}

/* ---------- konularım ---------- */
function cycleT(sk,t){D.topics[sk]=D.topics[sk]||{};D.topics[sk][t]=((D.topics[sk][t]||0)+1)%4;save();render();}
function vKonu(){
  const list=subs(D); if(!KSUB||!list.find(l=>l[0]===KSUB)) KSUB=list[0][0];
  const m=D.topics[KSUB]||{};
  const say=(KONU[KSUB]||[]).reduce((a,[,ks])=>a+ks.length,0);
  const bit=(KONU[KSUB]||[]).reduce((a,[,ks])=>a+ks.filter(t=>(m[t]||0)===2).length,0);
  return `
  <div class="card"><div class="body">
    <label class="f">Ders</label>
    <select onchange="KSUB=this.value;render()">${list.map(([k,nm])=>`<option value="${k}" ${k===KSUB?'selected':''}>${nm}</option>`).join('')}</select>
    <div style="margin-top:12px;display:flex;align-items:center;gap:10px">
      <progress value="${bit}" max="${say}" style="flex:1"></progress>
      <span style="font-family:var(--mono);font-size:13px;font-weight:600">${bit}/${say}</span></div>
    <div class="hint">Her konuya dokundukça durum değişir: Görmedim → İşliyorum → Bitirdim → Eksiğim var. Dürüst işaretle; öğretmenin buna göre ödev veriyor.</div>
  </div></div>
  ${(KONU[KSUB]||[]).map(([u,ks])=>`<div class="card"><h2>${esc(u)}</h2><div class="body">
    ${ks.map(t=>`<div class="topic"><span class="dot t${m[t]||0}"></span>
      <span class="tn">${esc(t)}</span>
      <button class="btn ghost mini" onclick="cycleT('${KSUB}',${JSON.stringify(t).replace(/"/g,'&quot;')})">${TL[m[t]||0]}</button>
    </div>`).join('')}
  </div></div>`).join('')}`;
}

/* ---------- denemem ---------- */
function denemeKaydet(){
  const n={}; let bos=true;
  subs(D).forEach(([k])=>{
    const d=document.getElementById('sd_'+k).value, y=document.getElementById('sy_'+k).value;
    if(d!==''||y!==''){n[k]={d:+d||0,y:+y||0};bos=false;}
  });
  if(bos){alert('En az bir derse doğru/yanlış yaz.');return;}
  D.exams.push({id:uid(),date:document.getElementById('sD').value||today(),name:document.getElementById('sN').value.trim(),n});
  save(); render(); alert('Deneme kaydedildi. Rapor gönderdiğinde öğretmenine iletilecek.');
}
function denemeSil(id){D.exams=D.exams.filter(e=>e.id!==id);save();render();}
function vDeneme(){
  const list=subs(D);
  return `
  <div class="card"><h2>Yeni deneme</h2><div class="body">
    <div class="fr">
      <div><label class="f">Tarih</label><input type="date" id="sD" value="${today()}"></div>
      <div style="flex:2"><label class="f">Deneme adı</label><input type="text" id="sN" placeholder="ör. 3D TYT-4"></div>
    </div>
    <table><thead><tr><th>Ders</th><th class="num">Soru</th><th class="num">Doğru</th><th class="num">Yanlış</th></tr></thead><tbody>
      ${list.map(([k,nm,q])=>`<tr><td>${nm}</td><td class="num" style="color:var(--ink-3)">${q}</td>
        <td class="num" style="width:85px"><input type="number" min="0" max="${q}" id="sd_${k}" placeholder="—"></td>

    <button class="btn wide" style="margin-top:14px" onclick="denemeKaydet()">Denemeyi kaydet</button>

  ${D.exams.length?`<div class="card"><h2>Gönderilmeyi bekleyen denemeler (${D.exams.length})</h2><div class="body" style="padding:0">
    <table><tbody>${D.exams.map(e=>{let t=0;for(const s in e.n)t+=net(e.n[s].d,e.n[s].y);
      return `<tr><td class="num" style="color:var(--ink-3)">${e.date}</td><td>${esc(e.name||'—')}</td>
      <td class="num" style="font-weight:650">${n1(t)} net</td>
      <td style="width:60px"><button class="btn ghost mini" onclick="denemeSil('${e.id}')">sil</button></td></tr>`;}).join('')}
    </tbody></table></div></div>`:''}`;

/* ---------- rapor ---------- */
function raporKodu(){
  const p={v:1,id:D.id,ad:D.ad,
    tasks:D.tasks.map(t=>({i:t.id,s:t.s,y:t.yap||0})),
    topics:D.topics, exams:D.exams, not:(document.getElementById('rNot')?.value||'').slice(0,500)};
  return 'KOCRAPOR1:'+b64e(JSON.stringify(p));
}
function vRapor(){
  const bit=D.tasks.filter(t=>t.s===1).length, yar=D.tasks.filter(t=>t.s===2).length, yok=D.tasks.filter(t=>t.s===3).length;
  const bek=D.tasks.filter(t=>t.s===0).length;
  return `
  <div class="card"><h2>Bu hafta ne yaptın</h2><div class="body" style="padding:0">
    <div class="stats">
      <div class="stat"><div class="k">Yaptım</div><div class="v" style="color:var(--ok)">${bit}</div><div class="n">ödev</div></div>
      <div class="stat"><div class="k">Yarım</div><div class="v" style="color:var(--warn)">${yar}</div><div class="n">ödev</div></div>
      <div class="stat"><div class="k">Yapamadım</div><div class="v" style="color:var(--bad)">${yok}</div><div class="n">ödev</div></div>
      <div class="stat"><div class="k">Deneme</div><div class="v">${D.exams.length}</div><div class="n">gönderilecek</div></div>
    </div></div></div>

  ${bek?`<div class="card"><div class="body"><div class="flag warn"><span class="ic">!</span>
    <span><b>${bek} ödevi hiç işaretlememişsin.</b> Ödevlerim sekmesinden hepsini işaretle, sonra raporu gönder. Yapamadığını yazmak sorun değil — yazmamak sorun.</span></div></div></div>`:''}

  <div class="card"><h2>Öğretmenine not (isteğe bağlı)</h2><div class="body">
    <textarea id="rNot" rows="4" placeholder="Nerede zorlandın? Neyi anlamadın? Bu hafta seni ne engelledi?" oninput="D.not=this.value">${esc(D.not||'')}</textarea>
    <div class="hint">Bu kısım en değerli yer. "Türevde zincir kuralını anlamadım" gibi tek cümle, bir sonraki haftanı değiştirir.</div>
  </div></div>

  <div class="card"><h2>Raporu gönder</h2><div class="body">
    <button class="btn wide" onclick="waGonder()">WhatsApp ile gönder</button>
    <button class="btn ghost wide" style="margin-top:10px" onclick="kopyala()">Kodu kopyala</button>
    <div class="hint" style="margin-top:10px">Kod uzun görünür, normaldir. Tamamını gönder, ortasından kesme.</div>
    <div class="big" id="kodKutu" style="margin-top:10px">${esc(raporLink())}</div>
  </div></div>`;
}
function kopyala(){
  const ta=document.createElement('textarea'); ta.value=raporLink();
  document.body.appendChild(ta); ta.select();
  try{document.execCommand('copy');alert('Kod kopyalandı. Öğretmenine WhatsApp\'tan yapıştır.');}
  catch(e){alert('Kopyalanamadı. Aşağıdaki kutudan elle seçip kopyala.');}
  document.body.removeChild(ta);
}
function raporLink(){
  const k=raporKodu();
  return D.url ? D.url.replace(/\/?$/,'/')+'kocluk-paneli.html#'+encodeURIComponent(k) : k;
}
function waGonder(){
  const k=raporLink();
  const bas=`${D.ad} — haftalık rapor (${today()})\n`;
  let tel=String(D.tel||'').replace(/\D/g,'');
  if(tel.startsWith('0')) tel='90'+tel.slice(1); else if(tel.length===10&&tel.startsWith('5')) tel='90'+tel;
  const url=(tel?`https://wa.me/${tel}`:'https://wa.me/')+'?text='+encodeURIComponent(bas+k);
  window.open(url,'_blank','noopener');
}

/* ---------- ayarlar ---------- */
function vAyar(){
  return `
  <div class="card"><h2>Yeni paket yükle</h2><div class="body">
    <div class="hint" style="margin:0 0 10px">Öğretmenin yeni ödev gönderdiğinde kodu buraya yapıştır. Konu işaretlerin ve denemelerin korunur, sadece ödev listesi yenilenir.</div>
    <textarea id="pkText" rows="5" placeholder="KOCPAKET1:..."></textarea>
    <button class="btn wide" style="margin-top:10px" onclick="paketYukle()">Paketi yükle</button>
    ${D.sonPaketT?`<div class="hint" style="margin-top:8px">Son yüklenen paket: ${esc(D.sonPaketT)}</div>`:''}
  </div></div>

  <div class="card"><h2>Verilerim</h2><div class="body">
    <div class="hint" style="margin:0 0 10px">Bilgilerin sadece bu cihazda tutuluyor. Telefon değiştireceksen önce yedek al.</div>
    <button class="btn ghost wide" onclick="yedekAl()">Yedek indir (.json)</button>
    <button class="btn ghost wide" style="margin-top:10px" onclick="document.getElementById('ydk').click()">Yedek yükle</button>
    <input type="file" id="ydk" accept=".json" style="display:none" onchange="yedekYukle(event)">
  </div></div>

  <div class="card"><h2>Çıkış</h2><div class="body">
    <div class="flag warn"><span class="ic">!</span><span>Çıkış yaptığında bu cihazdaki tüm işaretlerin, konu durumların ve kaydettiğin denemeler silinir. Öğretmenine göndermediğin bir rapor varsa <b>önce onu gönder</b>.</span></div>
    <button class="btn wide" style="background:var(--bad)" onclick="cikis()">Çıkış yap ve verileri sil</button>
  </div></div>`;
}
function yedekAl(){
  const b=new Blob([JSON.stringify(D,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(b);
  a.download='calisma-yedek-'+today()+'.json'; a.click(); URL.revokeObjectURL(a.href);
}
function yedekYukle(ev){
  const f=ev.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);
    if(!d.id){alert('Bu dosya bir çalışma yedeği değil.');return;}
    if(!confirm('Mevcut veriler bu yedekle değiştirilecek. Devam?'))return;
    D=d; save(); TAB='odev'; render();
  }catch(e){alert('Dosya okunamadı.');}};
  r.readAsText(f); ev.target.value='';
}
async function cikis(){
  if(!confirm('Tüm verilerin silinecek ve başlangıç ekranına döneceksin. Emin misin?')) return;
  if(!confirm('Son kez soruyorum: göndermediğin rapor varsa kaybolacak. Devam edilsin mi?')) return;
  try{ if(window.storage) await window.storage.delete(KEY); }catch(e){}
  try{ localStorage.removeItem(KEY); }catch(e){}
  MEM=null; D=null; TAB='odev'; render();
}

/* ---------- açılış ---------- */
(async()=>{
  const d=await load(); if(d&&d.id) D=d;
  render();
  const hs=decodeURIComponent(location.hash.slice(1)||'');
  if(hs.includes('KOCPAKET1:')){
    history.replaceState(null,'',location.pathname+location.search);
    paketYukle(hs);
  }
})();
</script>
