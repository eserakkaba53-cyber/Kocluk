<meta charset="utf-8">
<style>
:root{
  --ink:#122430;
  --ink-2:#3D5566;
  --ink-3:#7E939F;
  --paper:#E9EDEF;
  --panel:#FFFFFF;
  --line:#CBD6DB;
  --line-soft:#E2E9EC;
  --accent:#186C68;
  --accent-soft:#D8E8E6;
  --ok:#1F7A55;
  --warn:#B0710A;
  --bad:#A73A2C;
  --ok-bg:#E2F0EA;
  --warn-bg:#F8EEDA;
  --bad-bg:#F6E3E0;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:"SF Mono",'JetBrains Mono',Consolas,"Liberation Mono",Menlo,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5}
button{font-family:inherit;font-size:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:flex;min-height:100vh}

/* ---- sol ray ---- */
.rail{width:246px;flex:none;background:var(--ink);color:#DCE6EA;display:flex;flex-direction:column}
.rail-top{padding:18px 16px 14px;border-bottom:1px solid rgba(255,255,255,.12)}
.brand{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#7FA8A5;font-weight:600}
.brand b{display:block;font-size:17px;letter-spacing:0;text-transform:none;color:#fff;margin-top:3px;font-weight:600}
.rail-list{flex:1;overflow:auto;padding:8px 0}
.st-item{display:block;width:100%;text-align:left;background:none;border:0;color:#C6D5DB;padding:9px 16px;border-left:3px solid transparent}
.st-item:hover{background:rgba(255,255,255,.06);color:#fff}
.st-item.on{background:rgba(255,255,255,.11);border-left-color:#4FB3A9;color:#fff}
.st-item .nm{font-weight:600}
.st-item .sub{font-size:11.5px;color:#88A3AE;font-family:var(--mono)}
.rail-bot{padding:12px 14px;border-top:1px solid rgba(255,255,255,.12);display:flex;flex-direction:column;gap:7px}
.rail-bot button{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);color:#DCE6EA;padding:7px 10px;border-radius:5px;font-size:12.5px}
.rail-bot button:hover{background:rgba(255,255,255,.17)}

/* ---- ana ---- */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.hdr{background:var(--panel);border-bottom:1px solid var(--line);padding:16px 26px 0}
.hdr-row{display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap}
.hdr h1{margin:0;font-size:23px;font-weight:650;letter-spacing:-.01em}
.hdr .meta{font-family:var(--mono);font-size:12px;color:var(--ink-3);letter-spacing:.02em}
.hdr .goal{margin-left:auto;text-align:right}
.hdr .goal .d{font-size:13.5px;font-weight:600}
.hdr .goal .r{font-family:var(--mono);font-size:12px;color:var(--ink-2)}
.tabs{display:flex;gap:2px;margin-top:14px}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:9px 14px;color:var(--ink-2);font-size:13.5px;font-weight:550}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.view{padding:22px 26px 60px;flex:1}

/* ---- kart ---- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:7px;margin-bottom:18px}
.card>h2{margin:0;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);padding:13px 18px;border-bottom:1px solid var(--line-soft);font-weight:650}
.card .body{padding:18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:980px){.grid2{grid-template-columns:1fr}}

/* ---- imza: hedef farkı çubuğu ---- */
.gap-row{display:grid;grid-template-columns:150px 1fr 200px;gap:14px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line-soft)}
.gap-row:last-child{border-bottom:0}
.gap-name{font-size:13px;font-weight:550}
.gap-bar{position:relative;height:19px;background:#EDF1F3;border-radius:3px;overflow:hidden}
.gap-fill{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:3px 0 0 3px}
.gap-def{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(45deg,#E8BCB5,#E8BCB5 4px,#F3D8D3 4px,#F3D8D3 8px)}
.gap-tick{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink)}
.gap-nums{font-family:var(--mono);font-size:12.5px;display:flex;gap:10px;justify-content:flex-end;letter-spacing:-.01em}
.gap-nums .cur{font-weight:600}
.gap-nums .t{color:var(--ink-3)}
.gap-nums .d{font-weight:600;min-width:52px;text-align:right}
.d.neg{color:var(--bad)} .d.pos{color:var(--ok)}

/* ---- istatistik ---- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line-soft)}
@media(max-width:820px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--panel);padding:15px 18px}
.stat .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.stat .v{font-family:var(--mono);font-size:25px;font-weight:600;letter-spacing:-.02em;margin-top:3px}
.stat .n{font-size:11.5px;color:var(--ink-3)}

/* ---- uyarı ---- */
.flag{display:flex;gap:10px;padding:11px 14px;border-radius:5px;margin-bottom:8px;font-size:13px;align-items:flex-start}
.flag:last-child{margin-bottom:0}
.flag.bad{background:var(--bad-bg);color:#7C2B20}
.flag.warn{background:var(--warn-bg);color:#7A4E06}
.flag.ok{background:var(--ok-bg);color:#155C40}
.flag .ic{font-family:var(--mono);font-weight:700;flex:none}

/* ---- tablo ---- */
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:650;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:8px 10px;border-bottom:1px solid var(--line-soft)}
td.num,th.num{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
tr:hover td{background:#F7FAFB}

/* ---- form ---- */
label.f{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:650;margin-bottom:4px}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:5px;background:#FCFDFD;color:var(--ink)}
input[type=number]{font-family:var(--mono);text-align:right}
.fr{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.fr>div{flex:1;min-width:130px}
.btn{background:var(--accent);color:#fff;border:0;padding:8px 16px;border-radius:5px;font-weight:600;font-size:13px}
.btn:hover{background:#125552}
.btn.ghost{background:none;color:var(--accent);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.mini{padding:4px 10px;font-size:12px}
.btn.danger{background:none;color:var(--bad);border:1px solid var(--line)}
.btn.danger:hover{background:var(--bad-bg)}

/* ---- ödev durumu ---- */
.pill{border:1px solid var(--line);background:#fff;border-radius:20px;padding:3px 11px;font-size:12px;font-weight:600}
.pill.s0{color:var(--ink-3)}
.pill.s1{background:var(--ok-bg);border-color:#B6D8C8;color:var(--ok)}
.pill.s2{background:var(--warn-bg);border-color:#E6CF9C;color:var(--warn)}
.pill.s3{background:var(--bad-bg);border-color:#E4B8B1;color:var(--bad)}

/* ---- konu ---- */
.topic-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:7px}
.topic{display:flex;align-items:center;gap:9px;padding:6px 9px;border:1px solid var(--line-soft);border-radius:5px;background:#FCFDFD;font-size:12.5px}
.topic .dot{width:9px;height:9px;border-radius:50%;flex:none;border:1px solid rgba(0,0,0,.15)}
.topic .tn{flex:1;min-width:0}
.dot.t0{background:#DDE4E7}.dot.t1{background:#E8B44A}.dot.t2{background:var(--ok)}.dot.t3{background:var(--bad)}
.legend{display:flex;gap:16px;font-size:12px;color:var(--ink-2);margin-bottom:12px;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:6px}

.empty{padding:34px 18px;text-align:center;color:var(--ink-3);font-size:13.5px}
.hint{font-size:12px;color:var(--ink-3);margin-top:6px}
.sec-h{display:flex;align-items:center;gap:12px;margin:0 0 12px}
.sec-h h3{margin:0;font-size:14px;font-weight:650}
.spark{display:block}
</style>

<div class="app">
  <aside class="rail">
    <div class="rail-top">
      <div class="brand">Koç Paneli<b id="railTitle">Öğrenciler</b></div>
    </div>
    <div class="rail-list" id="railList"></div>
    <div class="rail-bot">
      <button onclick="addStudent()">+ Öğrenci ekle</button>
      <button onclick="exportData()">Yedek indir (.json)</button>
      <button onclick="document.getElementById('imp').click()">Yedek yükle</button>
      <input type="file" id="imp" accept=".json" style="display:none" onchange="importData(event)">
    </div>
  </aside>
  <main class="main">
    <div class="hdr">
      <div class="hdr-row">
        <div>
          <h1 id="stName">—</h1>
          <div class="meta" id="stMeta"></div>
        </div>
        <div class="goal" id="stGoal"></div>
      </div>
      <div class="tabs" id="tabs"></div>
    </div>
    <div class="view" id="view"></div>
  </main>
</div>

<script>
/* ================= DEPOLAMA =================

   Gerçek yedek her zaman .json dosyasıdır. Haftada bir indir. */
const KEY='kocluk_v1';
let MEM=null;
async function load(){
  try{ if(window.storage){const r=await window.storage.get(KEY); if(r&&r.value) return JSON.parse(r.value);} }catch(e){}
  try{ const s=localStorage.getItem(KEY); if(s) return JSON.parse(s); }catch(e){}
  return MEM;
}
async function save(){
  const s=JSON.stringify(DB); MEM=DB;
  try{ if(window.storage){await window.storage.set(KEY,s); return;} }catch(e){}
  try{ localStorage.setItem(KEY,s); }catch(e){}
}

/* ================= DERSLER ================= */
const S={
  TYT:[['tyt_tur','TYT Türkçe',40],['tyt_mat','TYT Matematik',40],['tyt_fiz','TYT Fizik',7],
       ['tyt_kim','TYT Kimya',7],['tyt_biy','TYT Biyoloji',6],['tyt_tar','TYT Tarih',5],
       ['tyt_cog','TYT Coğrafya',5],['tyt_fel','TYT Felsefe',5],['tyt_din','TYT Din',5]],
  SAY:[['ayt_mat','AYT Matematik',40],['ayt_fiz','AYT Fizik',14],['ayt_kim','AYT Kimya',13],['ayt_biy','AYT Biyoloji',13]],
  EA :[['ayt_mat','AYT Matematik',40],['ayt_edb','AYT Edebiyat',24],['ayt_tar1','AYT Tarih-1',10],['ayt_cog1','AYT Coğrafya-1',6]],
  SOZ:[['ayt_edb','AYT Edebiyat',24],['ayt_tar1','AYT Tarih-1',10],['ayt_cog1','AYT Coğrafya-1',6],
       ['ayt_tar2','AYT Tarih-2',11],['ayt_cog2','AYT Coğrafya-2',11],['ayt_fel','AYT Felsefe Grubu',12],['ayt_din','AYT Din',6]],
  DIL:[['ydt','YDT Yabancı Dil',80]]
};
const subs=st=>S.TYT.concat(S[st.track]||[]);
const subName=k=>{for(const g in S)for(const s of S[g])if(s[0]===k)return s[1];return k;};

/* ================= KONULAR =================
   Kaynak: kullanicinin yukledigi YKS konu listesi (unite -> konu).
   Yapi: KONU[dersKodu] = [[uniteAdi,[konu,...]],...]  */

/* ================= PUAN KATSAYILARI =================
   Yaklaşık ham puan yöntemi. ÖSYM gerçek puanı standart puana (o yılın
   ortalama + standart sapması) dayanır; bu hesap deneme kitapçıklarının
   kullandığı ham puan modelidir. Sapma tipik olarak ±10-15 puandır. */
const KTYT={tyt_tur:3.3,tyt_mat:3.3,tyt_fiz:3.4,tyt_kim:3.4,tyt_biy:3.4,tyt_tar:3.4,tyt_cog:3.4,tyt_fel:3.4,tyt_din:3.4};
const KAYT={
  SAY:{ayt_mat:3.0,ayt_fiz:2.85,ayt_kim:3.07,ayt_biy:3.07},
  EA :{ayt_mat:3.0,ayt_edb:3.0,ayt_tar1:2.8,ayt_cog1:3.33},
  SOZ:{ayt_edb:3.0,ayt_tar1:2.8,ayt_cog1:3.33,ayt_tar2:2.91,ayt_cog2:2.91,ayt_fel:3.0,ayt_din:3.33},
  DIL:{ydt:3.0}
};
/* n: {dersKodu: net} , obp: 250-500 , yerlesti: bool */
function hesapla(track,n,obp,yerlesti){
  let tytX=0; for(const k in KTYT) tytX += (+n[k]||0)*KTYT[k];
  let aytX=0; const ka=KAYT[track]||{}; for(const k in ka) aytX += (+n[k]||0)*ka[k];
  const tytHam = 100 + tytX;
  const yerHam = 100 + 0.4*tytX + aytX;
  const obpPay = (+obp||0) * (yerlesti?0.06:0.12);
  return {tytHam, yerHam, obpPay, tytPuan: tytHam+obpPay, yerPuan: yerHam+obpPay};
}

/* ================= KARNE AYRIŞTIRICI =================
   Yayınevi düzenine değil, matematiksel tutarlılığa dayanır:
   net = D - Y/4  ve  D + Y + Boş = soru sayısı  eşitliklerini
   aynı anda sağlayan sayı ikilisini seçer. */
const ALIAS={
 tyt_tur:['turkce'], tyt_mat:['temel matematik','matematik'],
 tyt_fiz:['fizik'], tyt_kim:['kimya'], tyt_biy:['biyoloji'],
 tyt_tar:['tarih'], tyt_cog:['cografya'], tyt_fel:['felsefe'], tyt_din:['din kulturu','din kult','din'],
 ayt_mat:['matematik'], ayt_fiz:['fizik'], ayt_kim:['kimya'], ayt_biy:['biyoloji'],
 ayt_edb:['turk dili ve edebiyati','edebiyat'], ayt_tar1:['tarih-1','tarih 1','tarih1','tarih'],
 ayt_cog1:['cografya-1','cografya 1','cografya1','cografya'],
 ayt_tar2:['tarih-2','tarih 2','tarih2'], ayt_cog2:['cografya-2','cografya 2','cografya2'],
 ayt_fel:['felsefe grubu','felsefe'], ayt_din:['din kulturu','din'],
 ydt:['yabanci dil','ingilizce','ydt']
};
function norm(s){
  return s.toLocaleLowerCase('tr-TR')
    .replace(/[ıİ]/g,'i').replace(/[şŞ]/g,'s').replace(/[ğĞ]/g,'g')
    .replace(/[üÜ]/g,'u').replace(/[öÖ]/g,'o').replace(/[çÇ]/g,'c')
    .replace(/\s+/g,' ').trim();
}
function solveLine(nums,q){
  let best=null;
  for(let i=0;i<nums.length;i++)for(let j=0;j<nums.length;j++){
    if(i===j) continue;
    const D=nums[i],Y=nums[j];
    if(!Number.isInteger(D)||!Number.isInteger(Y)||D<0||Y<0||D>q||Y>q||D+Y>q) continue;
    const nt=D-Y/4;
    let sc=0;
    if(nums.some((v,x)=>x!==i&&x!==j&&Math.abs(v-nt)<0.06)) sc+=3;      // net satırda var
    if(nums.some((v,x)=>x!==i&&x!==j&&Number.isInteger(v)&&D+Y+v===q)) sc+=2; // boş tutuyor
    if(i<j) sc+=1;                                                       // D genelde Y'den önce
    if(sc<3) continue;                                                   // en az bir güçlü kanıt şart
    if(!best||sc>best.sc||(sc===best.sc&&i<best.i)) best={D,Y,sc,i};
  }
  return best;
}
function parseKarne(text,st){
  const list=subs(st), out={}, log=[];
  let sec=null;
  text.split(/[\r\n]+/).forEach(raw=>{
    const L=norm(raw);
    if(!L) return;
    if(/\bayt\b/.test(L)) sec='AYT';
    else if(/\btyt\b/.test(L)) sec='TYT';
    // ders eşleştir: en uzun eşleşen takma ad kazanır
    let hit=null,hitLen=0;
    list.forEach(([k,nm,q])=>{
      const isTyt=k.startsWith('tyt_');
      if(sec==='TYT'&&!isTyt) return;
      if(sec==='AYT'&&isTyt) return;
      (ALIAS[k]||[]).forEach(a=>{
        if(L.includes(a)&&a.length>hitLen){hit=[k,nm,q];hitLen=a.length;}
      });
    });
    if(!hit||out[hit[0]]) return;
    const nums=(raw.match(/-?\d+(?:[.,]\d+)?/g)||[]).map(s=>parseFloat(s.replace(',','.')));
    if(nums.length<3) return;
    const r=solveLine(nums,hit[2]);
    if(r){ out[hit[0]]={d:r.D,y:r.Y}; log.push(`${hit[1]}: ${r.D} doğru / ${r.Y} yanlış → ${n1(r.D-r.Y/4)} net`); }
  });
  return {out,log};
}

  const ty=PENDING_AN.reduce((a,r)=>a+r.y,0), tb=PENDING_AN.reduce((a,r)=>a+r.b,0);
  box.innerHTML=`${log.length?`<div class="flag ok"><span class="ic">✓</span><span><b>${log.length} dersin neti okundu.</b> Yukarıdaki forma yazıldı, yeşil alanlar doldurulanlar.<br>${log.join('<br>')}</span></div>`:''}
    ${PENDING_AN.length?`<div class="flag ok"><span class="ic">✓</span><span><b>${PENDING_AN.length} konu okundu</b> — ${ty} yanlış, ${tb} boş. Aşağıda dökümü var; deneme kaydedilince iliştirilecek.</span></div>`
      :`<div class="flag warn"><span class="ic">·</span><span>Konu analizi bulunamadı. Karnede konu dökümü yoksa ya da düzeni tanınmadıysa normaldir — denemeyi kaydettikten sonra <b>konu gir</b> butonuyla elle ekleyebilirsin.</span></div>`}
    ${miss.length&&log.length?`<div class="flag warn"><span class="ic">·</span><span>Neti okunamayan: ${miss.join(', ')}. Karnede yoksa boş bırak, varsa elle gir.</span></div>`:''}
    <div class="flag warn"><span class="ic">!</span><span>Kaydetmeden önce sayıları karneyle karşılaştır. Ayrıştırıcı hata yapabilir; kontrol adımı senin.</span></div>
    ${anOnizle(PENDING_AN)}`;
  window.scrollTo({top:0,behavior:'smooth'});
}

/* --- 2. katman: karnedeki konu analizinden yanlış/boş konuları çıkar --- */
function dersBul(L,sec,list){
  let hit=null,hl=0;
  list.forEach(([k,nm,q])=>{
    const isT=k.startsWith('tyt_');
    if(sec==='TYT'&&!isT) return;
    if(sec==='AYT'&&isT) return;
    (ALIAS[k]||[]).forEach(a=>{ if(L.includes(a)&&a.length>hl){hit=k;hl=a.length;} });
  });
  return hit;
}
function konuCoz(nums,mod){
  // döner: {y,b}  (yanlış, boş adetleri)
  if(nums.length>=4){
    for(let i=0;i<nums.length-3;i++){
      const [a,b,c,d]=nums.slice(i,i+4);
      if([a,b,c,d].every(Number.isInteger)&&a===b+c+d&&a>0&&a<=60) return {y:c,b:d};
    }
  }
  if(nums.length===3&&nums.every(Number.isInteger)) return {y:nums[1],b:nums[2]};
  if(nums.length===2&&nums.every(Number.isInteger)) return mod==='b'?{y:0,b:nums[1]}:{y:nums[1],b:0};
  if(nums.length===1&&Number.isInteger(nums[0])&&nums[0]>0&&nums[0]<=40)
    return mod==='b'?{y:0,b:nums[0]}:{y:nums[0],b:0};
  return mod==='b'?{y:0,b:1}:{y:1,b:0};
}
function parseKonular(text,st){
  const list=subs(st), bulunan=[]; 
  let sec=null, ders=null, mod='y';
  // ders başına havuz: hem konu adları hem ünite adları
  const havuz={};
  list.forEach(([k])=>{
    const p=[];
    (KONU[k]||[]).forEach(([u,ks])=>{
      p.push([norm(u),u,u]);              // karneler çoğunlukla ünite adı yazar
      ks.forEach(t=>p.push([norm(t),t,u]));
    });
    havuz[k]=p;
  });

  text.split(/[\r\n]+/).forEach(raw=>{
    const L=norm(raw); if(L.length<3) return;
    if(/\bayt\b/.test(L)) sec='AYT'; else if(/\btyt\b/.test(L)) sec='TYT';
    if(/\bbos\b|bos birak|bos kal/.test(L)) mod='b';
    else if(/yanlis/.test(L)) mod='y';
    const d=dersBul(L,sec,list); if(d) ders=d;
    if(!ders) return;

    const nums=(raw.match(/-?\d+(?:[.,]\d+)?/g)||[]).map(s=>parseFloat(s.replace(',','.')));
    if(nums.length>5) return;                                     // net tablosu satırı
    if(nums.length>=4&&nums.some(v=>!Number.isInteger(v))) return; // ondalık net içeren özet satırı

    let best=null,bl=0;
    (havuz[ders]||[]).forEach(([nk,orj,un])=>{
      if(nk.length<5) return;
      if((L.includes(nk)||(nk.length>12&&nk.includes(L)&&L.length>10))&&nk.length>bl){best=[orj,un];bl=nk.length;}
    });
    if(!best) return;
    const c=konuCoz(nums,mod);
    if(!c.y&&!c.b) return;
    bulunan.push({sub:ders,konu:best[0],unite:best[1],y:c.y,b:c.b});
  });
  // aynı konu birden çok satırda geçtiyse topla
  const agg={};
  bulunan.forEach(x=>{
    const k=x.sub+'||'+x.konu;
    const a=agg[k]=agg[k]||{sub:x.sub,konu:x.konu,unite:x.unite,y:0,b:0};
    a.y+=x.y; a.b+=x.b;
  });
  return Object.values(agg);
}
function anOnizle(rows){
  if(!rows.length) return '';
  const g={};
  rows.forEach(r=>{ (g[r.sub]=g[r.sub]||{})[r.unite]=((g[r.sub]||{})[r.unite]||[]); g[r.sub][r.unite].push(r); });
  return `<div class="card" style="margin-top:14px"><h2>Karneden çıkarılan yanlış/boş konular — ${rows.length} konu</h2><div class="body" style="padding:0">
  ${Object.keys(g).map(sk=>{
    let ty=0,tb=0; Object.values(g[sk]).forEach(a=>a.forEach(r=>{ty+=r.y;tb+=r.b;}));
    return `<div style="padding:14px 18px;border-bottom:1px solid var(--line-soft)">
      <div class="sec-h"><h3>${subName(sk)}</h3>
        <span style="font-family:var(--mono);font-size:12px"><span style="color:var(--bad)">${ty} yanlış</span> · <span style="color:var(--warn)">${tb} boş</span></span></div>
      <table><thead><tr><th style="width:34%">Ünite</th><th>Konu</th><th class="num">Yanlış</th><th class="num">Boş</th></tr></thead><tbody>
      ${Object.keys(g[sk]).map(u=>g[sk][u].map((r,j)=>`<tr>
        <td style="color:var(--ink-3);font-size:12px">${j===0?esc(u):''}</td><td><b>${esc(r.konu)}</b></td>
        <td class="num" style="color:${r.y?'var(--bad)':'var(--ink-3)'};font-weight:${r.y?'650':'400'}">${r.y||'·'}</td>
        <td class="num" style="color:${r.b?'var(--warn)':'var(--ink-3)'};font-weight:${r.b?'650':'400'}">${r.b||'·'}</td></tr>`).join('')).join('')}
      </tbody></table></div>`;
  }).join('')}
  </div><div class="body" style="border-top:1px solid var(--line-soft)">
    <div class="hint">Bu liste, aşağıdaki <b>Denemeyi kaydet</b> butonuna bastığında denemeye iliştirilir. Yanlışsa <b>Konuları at</b> ile temizle, elle girersin.</div>
    <button class="btn ghost mini" style="margin-top:8px" onclick="PENDING_AN=[];render()">Konuları at</button>
  </div></div>`;
}

/* ================= KONU SÜRELERİ =================
   Konu başına süre veren yayınlanmış bir kaynak yok; literatür ders/hafta düzeyinde
   toplam bütçe veriyor (yoğun hazırlıkta ~800 saat, haftada 30-44 saat).
   Buradaki değerler o bütçeden geriye türetildi ve konu sayısına bölündü:
   SAY ~787 sa, EA ~669 sa, SÖZ ~613 sa (deneme/tekrar hariç).
   İçine konu anlatımı VE soru çözümü birlikte dahildir. Hepsi elle düzenlenebilir. */
const SURE_VAR={tyt_mat:150,ayt_mat:180,tyt_fiz:120,ayt_fiz:150,tyt_kim:100,ayt_kim:130,
  tyt_biy:100,ayt_biy:120,tyt_tur:75,ayt_edb:90,tyt_tar:50,ayt_tar1:60,ayt_tar2:60,
  tyt_cog:55,ayt_cog1:65,ayt_cog2:65,tyt_fel:45,ayt_fel:55,tyt_din:35,ayt_din:40,ydt:80};
/* bilinen ağır konular ×1,5 — kümülatif ya da işlem yoğun oldukları için */
const AGIR=['problemler','turev','integral','limit','trigonometri','logaritma','polinom',
 'carpanlara','permutasyon','kombinasyon','olasilik','2.dereceden','ikinci dereceden','ucgenler',
 'analitik','kati cisimler','donusum','elektrik','manyetizma','optik','dalga','modern fizik',
 'kuvvet ve hareket','cembersel','harmonik','momentum','organik','karbon','mol kavrami',
 'kimyasal hesap','denge','gazlar','cozunurluk','genden proteine','kalitim','fotosentez',
 'solunum','sinir sistemi','insan fizyolojisi','hucre bolunmeleri','paragraf','divan'];
function sureOf(sk,konu){
  const o=(DB.sureler||{})[sk]||{};
  if(o[konu]!==undefined) return o[konu];
  const n=norm(konu), taban=SURE_VAR[sk]||90;
  return AGIR.some(a=>n.includes(a))?Math.round(taban*1.5/15)*15:taban;
}
function setSure(sk,konu,dk){
  DB.sureler=DB.sureler||{}; DB.sureler[sk]=DB.sureler[sk]||{};
  if(dk===''||dk===null) delete DB.sureler[sk][konu]; else DB.sureler[sk][konu]=+dk;
  save();
}
/* açık (bitmemiş) konuların toplam süresi, dakika */
function kalanSure(st,sk){
  const m=st.topics[sk]||{}; let dk=0,ad=0;
  (KONU[sk]||[]).forEach(([,ks])=>ks.forEach(t=>{
    const d=m[t]||0;
    if(d===2) return;                       // bitti
    const carp=d===1?0.5:d===3?0.7:1;       // işleniyor yarım, eksik kısmi tekrar
    dk+=sureOf(sk,t)*carp; ad++;
  }));
  return {dk,ad};
}
function haftaKalan(st){
  if(!st.sinavTarihi) return null;
  const d=(new Date(st.sinavTarihi)-new Date())/86400000;
  return d>0?Math.floor(d/7):0;
}

/* ================= SABİT HAFTALIK RUTİN =================
   Konudan bağımsız, her hafta tekrar eden zorunlu iş. Varsayılan: 100 paragraf + 100 problem. */
const RUTIN_VAR=[{ad:'Paragraf',sub:'tyt_tur',adet:100,dks:1.5},{ad:'Problem',sub:'tyt_mat',adet:100,dks:2}];
function rutinler(){ const r=DB.rutin||(DB.rutin=RUTIN_VAR.map(x=>({...x}))); r.forEach(x=>{if(x.dks===undefined)x.dks=1.5;}); return r; }
function rutinVar(st,wk){ return st.tasks.filter(t=>t.rutin&&weekKey(t.date)===wk); }

/* haftalık hedef çalışma süresi (dakika): rutin + konu ödevleri */
function haftaSure(st,wk){
  let rut=0,konu=0;
  st.tasks.filter(t=>weekKey(t.date)===wk).forEach(t=>{
    if(t.rutin) rut+=(t.q||0)*(t.dks||1.5);
    else if(t.konu) konu+=sureOf(t.sub,t.konu);
  });
  return {rut,konu,top:rut+konu};
}
function sa(dk){const h=Math.floor(dk/60),m=Math.round(dk%60);return h?`${h} sa${m?' '+m+' dk':''}`:`${m} dk`;}
function rutinYap(id,v){

      <span>Eksik rutin: <b>${eksik.map(r=>r.ad+' '+r.adet).join(', ')}</b>. Rutin her hafta zorunludur.</span></div>

/* ================= ÖĞRENCİ PANELİ İLE ALIŞVERİŞ ================= */
function b64e(s){const b=new TextEncoder().encode(s);let o='';for(let i=0;i<b.length;i+=8192)o+=String.fromCharCode(...b.subarray(i,i+8192));return btoa(o);}
function b64d(s){return new TextDecoder().decode(Uint8Array.from(atob(s),c=>c.charCodeAt(0)));}
function hashKod(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return (h>>>0).toString(36);}
function paketUret(st){
  const wk=weekKey(today());
  const p={v:1,id:st.id,ad:st.name,track:st.track,grade:st.grade,dept:st.dept,rank:st.rank,
    sinav:st.sinavTarihi||'',tel:st.tel||'',url:DB.siteUrl||'',topics:st.topics,
    tasks:st.tasks.filter(t=>weekKey(t.date)===wk).map(t=>({id:t.id,date:t.date,sub:t.sub,konu:t.konu,
      q:t.q||0,txt:t.txt||'',rutin:!!t.rutin,dks:t.dks,yap:t.yap||0,s:t.s}))};
  const kod='KOCPAKET1:'+b64e(JSON.stringify(p));
  return DB.siteUrl ? DB.siteUrl.replace(/\/?$/,'/')+'ogrenci-paneli.html#'+encodeURIComponent(kod) : kod;
}
function setSite(v){ DB.siteUrl=v.trim(); PAKET=null; save(); render(); }
function paketGoster(){

  const el=document.getElementById('pkKutu'); if(el) el.textContent=kod;
  PAKET=kod; render();
}
let PAKET=null;
function paketWa(){

  let tel=String(st.tel||'').replace(/\D/g,'');

/* yapılandırılmış rapor kodunu oku */
function raporKodOku(st,txt){
  const m=txt.match(/KOCRAPOR1:([A-Za-z0-9+/=]+)/);
  if(!m) return null;
  const hk=hashKod(m[1]);
  const onceki=(st.uygulanan||[]).find(x=>x.h===hk);
  if(onceki&&!confirm(`Bu rapor daha önce işlendi (${onceki.t}). Aynı kodu yeniden uygulamak bir şey değiştirmez ama yine de bakılsın mı?`)) return null;
  let p; try{ p=JSON.parse(b64d(m[1])); }catch(e){ alert('Rapor kodu bozuk ya da eksik kopyalanmış.'); return null; }
  if(p.id&&p.id!==st.id&&!confirm('Bu rapor başka bir öğrenciye ait görünüyor ('+(p.ad||'?')+'). Yine de uygulansın mı?')) return null;
  const P={rutin:[],odev:[],konu:[],deneme:[],not:p.not||'',log:[],kod:true,h:hk};
  (p.tasks||[]).forEach(r=>{
    const t=st.tasks.find(x=>x.id===r.i); if(!t) return;
    if(t.rutin){ if((t.yap||0)!==r.y||t.s!==r.s){P.rutin.push({id:t.id,yap:r.y,ad:t.konu,hedef:t.q});P.log.push(`Rutin — ${t.konu}: ${r.y}/${t.q}`);} }
    else if(t.s!==r.s){ P.odev.push({id:t.id,s:r.s,ad:t.konu}); P.log.push(`Ödev — ${subName(t.sub)} / ${t.konu}: ${SL[r.s]}`); }
  });
  for(const sk in (p.topics||{})) for(const kk in p.topics[sk]){
    const yeni=p.topics[sk][kk], eski=(st.topics[sk]||{})[kk]||0;
    if(yeni!==eski){ P.konu.push({sub:sk,konu:kk,durum:yeni});
      P.log.push(`Konu — ${subName(sk)} / ${kk}: ${['Görülmedi','İşleniyor','Bitti','Eksik'][yeni]}`); }
  }
  (p.exams||[]).forEach(e=>{
    if(st.exams.some(x=>x.date===e.date&&(x.name||'')===(e.name||''))) return;
    P.deneme.push(e); let t=0; for(const s in e.n)t+=net(e.n[s].d,e.n[s].y);
    P.log.push(`Deneme — ${e.date} ${e.name||''}: ${n1(t)} net`);
  });
  if(p.not) P.log.push(`Öğrenci notu: "${p.not.slice(0,120)}"`);
  return P;
}

/* ================= ÖĞRENCİ RAPORU AYRIŞTIRICI =================
   Öğrencinin WhatsApp'tan yazdığı serbest metni okur, önizleme üretir.
   Hiçbir şey onaysız uygulanmaz. */
const KLM={
  yok:['yapamadim','yapmadim','yetismedi','yetistiremedim','bitiremedim','baslayamadim','olmadi','hic','sifir'],
  yarim:['yarim','yarisi','kismen','biraz','bir kismi','yarisini','az'],
  tamam:['yaptim','bitirdim','bitti','tamamladim','tamam','hallettim','cozdum','okudum','yapildi']
};
function durumBul(L){
  if(KLM.yok.some(k=>L.includes(k))) return 3;
  if(KLM.yarim.some(k=>L.includes(k))) return 2;
  if(KLM.tamam.some(k=>L.includes(k))) return 1;
  return null;
}
let RAPOR_ON=null;
function raporIsle(){
  const st=cur(), txt=document.getElementById('rpText').value;
  if(!txt.trim()){alert('Öğrencinin mesajını yapıştır.');return;}
  if(txt.includes('KOCRAPOR1:')){
    const P=raporKodOku(st,txt);
    if(P){ RAPOR_ON=P; render(); if(!P.log.length) alert('Rapor okundu ama değişen bir şey yok.'); }
    return;
  }
  const wk=weekKey(today());
  const hafta=st.tasks.filter(t=>weekKey(t.date)===wk);
  const rutinT=hafta.filter(t=>t.rutin), konuT=hafta.filter(t=>!t.rutin);
  const P={rutin:[],odev:[],konu:[],log:[]};
  let mod=null;   // 'biten' bölümü

  txt.split(/[\r\n]+/).forEach(raw=>{
    const L=norm(raw); if(L.length<2) return;
    if(/biten konu|bitirdigim konu|tamamladigim konu/.test(L)){mod='biten';return;}
    if(/odev|calisma/.test(L)&&L.length<25) mod=null;
    const nums=(raw.match(/\d+/g)||[]).map(Number);

    // 1) sabit rutin: adı geçiyorsa sayıyı al
    let rutinHit=false;
    rutinT.forEach(t=>{
      if(!L.includes(norm(t.konu))) return;
      rutinHit=true;
      const v=nums.length?nums[0]:(durumBul(L)===1?t.q:0);
      P.rutin.push({id:t.id,yap:v,ad:t.konu,hedef:t.q});
      P.log.push(`Rutin — ${t.konu}: ${v}/${t.q}`);
    });
    if(rutinHit) return;

    // 2) haftanın konu ödevleri
    let odevHit=false;
    konuT.forEach(t=>{
      const nk=norm(t.konu||''); if(nk.length<5) return;
      if(!L.includes(nk)&&!(nk.length>14&&nk.includes(L)&&L.length>8)) return;
      const d=durumBul(L); if(d===null) return;
      odevHit=true;
      P.odev.push({id:t.id,s:d,ad:t.konu,ders:subName(t.sub)});
      P.log.push(`Ödev — ${subName(t.sub)} / ${t.konu}: ${SL[d]}`);
    });
    if(odevHit) return;

    // 3) bitirdiği konular (tüm müfredattan)
    const d=durumBul(L);
    if(mod==='biten'||d===1){
      let best=null,bl=0;
      subs(st).forEach(([sk])=>{
        (KONU[sk]||[]).forEach(([u,ks])=>{
          ks.forEach(t=>{const nt=norm(t);
            if(nt.length>=6&&L.includes(nt)&&nt.length>bl){best=[sk,t,u];bl=nt.length;}});
          const nu=norm(u);
          if(nu.length>=6&&L.includes(nu)&&nu.length>bl){best=[sk,u,u];bl=nu.length;}
        });
      });
      if(best&&(st.topics[best[0]]||{})[best[1]]!==2){
        P.konu.push({sub:best[0],konu:best[1],unite:best[2]});
        P.log.push(`Konu bitti — ${subName(best[0])} / ${best[1]}`);
      }
    }
  });
  RAPOR_ON=P; render();
  if(!P.log.length) alert('Mesajdan işlenebilir bir şey çıkmadı. Öğrenci konu adlarını yazmamış olabilir; elle güncelle.');
}
function raporUygula(){
  const st=cur(), P=RAPOR_ON; if(!P) return;
  P.rutin.forEach(r=>{const t=st.tasks.find(x=>x.id===r.id); if(!t)return;
    t.yap=r.yap; const o=t.q?t.yap/t.q:0; t.s=o>=0.9?1:o>0?2:0;});
  P.odev.forEach(o=>{const t=st.tasks.find(x=>x.id===o.id); if(t)t.s=o.s;});
  P.konu.forEach(k=>{st.topics[k.sub]=st.topics[k.sub]||{}; st.topics[k.sub][k.konu]=k.durum!==undefined?k.durum:2;});
  (P.deneme||[]).forEach(e=>st.exams.push({id:uid(),date:e.date,name:e.name||'',n:e.n,an:[]}));
  if(P.not){ st.notlar=st.notlar||[]; st.notlar.unshift({t:today(),m:P.not}); }

}

/* ================= HESAP ================= */
function avgNets(st,k=3){
  const out={},cnt={};
  const ex=[...st.exams].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,k);
  ex.forEach(e=>{for(const s in e.n){const v=net(e.n[s].d||0,e.n[s].y||0);out[s]=(out[s]||0)+v;cnt[s]=(cnt[s]||0)+1;}});
  for(const s in out) out[s]=out[s]/cnt[s];
  return {nets:out,count:ex.length};
}
function totalNet(e){let t=0;for(const s in e.n)t+=net(e.n[s].d||0,e.n[s].y||0);return t;}
function weekStats(st,wk){
  const t=st.tasks.filter(x=>weekKey(x.date)===wk);
  const done=t.filter(x=>x.s===1).length, part=t.filter(x=>x.s===2).length;
  const rate=t.length?Math.round((done+part*0.5)/t.length*100):null;
  return {total:t.length,done,part,rate};
}
function lastWeeks(st,n=6){
  const ks=[...new Set(st.tasks.map(t=>weekKey(t.date)))].sort().reverse().slice(0,n);
  return ks.map(k=>({wk:k,...weekStats(st,k)}));
}
function weakTopics(st){
  const out=[];
  for(const sk in st.topics) for(const tn in st.topics[sk]) if(st.topics[sk][tn]===3) out.push({s:sk,t:tn});
  return out;
}
function topicStats(st,sk){
  const list=T[sk]||[], m=st.topics[sk]||{};
  let done=0,prog=0,weak=0;
  list.forEach(t=>{const v=m[t]||0; if(v===2)done++; if(v===1)prog++; if(v===3)weak++;});
  return {total:list.length,done,prog,weak};
}

/* ---------- DURUM ---------- */
function vDurum(st){
  const a=avgNets(st,3);
  const list=subs(st);
  let curTot=0,tgtTot=0,hasT=false;
  list.forEach(([k])=>{curTot+=(a.nets[k]||0); const t=+st.refNets[k]; if(t){tgtTot+=t;hasT=true;}});

  // hedef farkı çubukları
  const bars=list.map(([k,nm,q])=>{
    const c=a.nets[k], t=+st.refNets[k]||0;
    if(c===undefined&&!t) return '';
    const scale=Math.max(t,c||0,1);
    const cw=Math.max(0,Math.min(100,(c||0)/scale*100));
    const tw=Math.max(0,Math.min(100,t/scale*100));
    const diff=(c===undefined||!t)?null:c-t;
    const defw=diff!==null&&diff<0?Math.max(0,tw-cw):0;
    return `<div class="gap-row">
      <div class="gap-name">${nm}</div>
      <div class="gap-bar">
        <div class="gap-fill" style="width:${cw}%"></div>
        ${defw?`<div class="gap-def" style="left:${cw}%;width:${defw}%"></div>`:''}
        ${t?`<div class="gap-tick" style="left:calc(${tw}% - 1px)"></div>`:''}
      </div>
      <div class="gap-nums">
        <span class="cur">${c===undefined?'—':n1(c)}</span>
        <span class="t">/ ${t?n1(t):'—'}</span>
        <span class="d ${diff===null?'':diff<0?'neg':'pos'}">${diff===null?'':(diff>0?'+':'')+n1(diff)}</span>
      </div></div>`;
  }).join('');

  // trend
  const ex=[...st.exams].sort((a,b)=>a.date.localeCompare(b.date));
  const spark=ex.length>1?sparkline(ex.map(totalNet)):'<div class="empty" style="padding:12px">Grafik için en az 2 deneme gerekli.</div>';

  // haftalar
  const ws=lastWeeks(st,6);
  const lastW=ws[0];

  // uyarılar
  const F=[];
  if(ws.length>=2&&ws[0].rate!==null&&ws[1].rate!==null&&ws[0].rate<50&&ws[1].rate<50)
    F.push(['bad','!','Ödev uyumu iki hafta üst üste %50 altında. Planı kısalt, görüşme ayarla.']);
  if(ex.length>=3){
    const l3=ex.slice(-3).map(totalNet);
    if(Math.abs(l3[2]-l3[0])<1.5) F.push(['warn','~','Toplam net son 3 denemede sabit. Süreyi değil, yöntemi/kaynağı değiştir.']);
    if(l3[2]<l3[0]-2) F.push(['bad','↓','Toplam net düşüyor. Önce hata günlüğüne bak, plana dokunma.']);
  }
  list.forEach(([k,nm])=>{
    const c=a.nets[k],t=+st.refNets[k];
    if(c!==undefined&&t&&(t-c)/t>0.35) F.push(['warn','·',`${nm}: hedefin %35'inden fazla gerisinde. Bu dersi haftalık plana öncelikli al.`]);
  });
  const wt=weakTopics(st);
  if(wt.length>=5) F.push(['warn','·',`${wt.length} konu "eksik" olarak işaretli. Konular sekmesinden tekrar sırası çıkar.`]);
  if(!st.exams.length) F.push(['warn','·','Henüz deneme girilmemiş. Baseline için son 3 denemeyi gir.']);
  if(!Object.keys(st.refNets).length) F.push(['warn','·','Hedef netleri boş. Hedef sekmesinden gireceksin — karşılaştırma bunsuz çalışmaz.']);
  if(!F.length) F.push(['ok','✓','Aktif uyarı yok. Sistem takipte.']);

  return `
  <div class="card"><div class="stats">
    <div class="stat"><div class="k">Toplam net (son 3 ort.)</div><div class="v">${a.count?n1(curTot):'—'}</div><div class="n">${a.count} deneme ortalaması</div></div>
    <div class="stat"><div class="k">Hedef toplam net</div><div class="v">${hasT?n1(tgtTot):'—'}</div><div class="n">referans bölüm netleri</div></div>
    <div class="stat"><div class="k">Hedefe fark</div><div class="v" style="color:${hasT&&a.count?(curTot-tgtTot<0?'var(--bad)':'var(--ok)'):'inherit'}">${hasT&&a.count?(curTot-tgtTot>0?'+':'')+n1(curTot-tgtTot):'—'}</div><div class="n">net cinsinden</div></div>
    <div class="stat"><div class="k">Bu hafta ödev uyumu</div><div class="v">${lastW&&lastW.rate!==null?lastW.rate+'%':'—'}</div><div class="n">${lastW?lastW.done+'/'+lastW.total+' tamamlandı':'ödev yok'}</div></div>
  </div></div>

  <div class="card"><h2>Hedef farkı — ders bazında</h2><div class="body">
    ${bars||'<div class="empty">Deneme ve hedef netleri girildiğinde bu tablo dolar.</div>'}
    <div class="hint">Dolu çubuk mevcut ortalama, dikey çizgi hedef, taralı alan açık. Sağdaki üçüncü sayı farktır.</div>
  </div></div>

  <div class="grid2">
    <div class="card"><h2>Toplam net seyri</h2><div class="body">${spark}</div></div>
    <div class="card"><h2>Uyarılar</h2><div class="body">
      ${F.map(f=>`<div class="flag ${f[0]}"><span class="ic">${f[1]}</span><span>${f[2]}</span></div>`).join('')}
    </div></div>
  </div>

  <div class="card"><h2>Son haftalar — ödev uyumu</h2><div class="body">
    ${ws.length?`<table><thead><tr><th>Hafta başı</th><th class="num">Verilen</th><th class="num">Yapıldı</th><th class="num">Kısmen</th><th class="num">Uyum</th></tr></thead><tbody>
      ${ws.map(w=>`<tr><td class="num">${w.wk}</td><td class="num">${w.total}</td><td class="num">${w.done}</td><td class="num">${w.part}</td>
        <td class="num" style="font-weight:600;color:${w.rate>=70?'var(--ok)':w.rate>=50?'var(--warn)':'var(--bad)'}">${w.rate}%</td></tr>`).join('')}
    </tbody></table>`:'<div class="empty">Ödev girildiğinde haftalık uyum burada birikir.</div>'}
  </div></div>

  ${wt.length?`<div class="card"><h2>Eksik işaretli konular (${wt.length})</h2><div class="body">
    <div class="topic-grid">${wt.map(w=>`<div class="topic"><span class="dot t3"></span><span class="tn">${esc(w.t)}</span><span style="font-size:11px;color:var(--ink-3)">${subName(w.s).replace('AYT ','').replace('TYT ','')}</span></div>`).join('')}</div>
  </div></div>`:''}`;
}

function sparkline(vals){
  const w=520,h=140,p=22;
  const mn=Math.min(...vals),mx=Math.max(...vals),rg=(mx-mn)||1;
  const pts=vals.map((v,i)=>[p+i*(w-2*p)/Math.max(1,vals.length-1), h-p-(v-mn)/rg*(h-2*p)]);
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" width="100%" height="150" role="img" aria-label="Toplam net seyri">
    <line x1="${p}" y1="${h-p}" x2="${w-p}" y2="${h-p}" stroke="var(--line)"/>
    <polyline fill="none" stroke="var(--accent)" stroke-width="2.5" points="${pts.map(p=>p.join(',')).join(' ')}"/>
    ${pts.map((pt,i)=>`<circle cx="${pt[0]}" cy="${pt[1]}" r="3.5" fill="#fff" stroke="var(--accent)" stroke-width="2"/>
      <text x="${pt[0]}" y="${pt[1]-10}" text-anchor="middle" font-family="var(--mono)" font-size="11" fill="var(--ink-2)">${n1(vals[i])}</text>`).join('')}
  </svg>`;
}

/* ---------- DENEME ANALİZİ: yanlış / boş konular ---------- */
let ANEX=null, ANS=null, ANU='';
function anDers(st){const l=subs(st); if(!ANS||!l.find(x=>x[0]===ANS)) ANS=l[0][0]; return ANS;}
function setAnDers(k){ANS=k;ANU='';render();}
function setAnUnite(u){ANU=u;render();}

function anEkle(){
  const st=cur(), e=st.exams.find(x=>x.id===ANEX); if(!e) return;
  const sk=anDers(st);
  let konu=document.getElementById('anK').value;
  const serbest=document.getElementById('anFree').value.trim();
  if(serbest) konu=serbest;
  if(!konu){alert('Konu seç ya da karnedeki adını yaz.');return;}
  e.an=e.an||[];
  e.an.push({sub:sk,konu,unite:(uniteOf[sk]||{})[konu]||'Listede yok (karne adı)',
    tip:document.getElementById('anT').value,adet:+document.getElementById('anA').value||1});

  save(); render();

function anSil(i){const st=cur(),e=st.exams.find(x=>x.id===ANEX); e.an.splice(i,1); save(); render();}
function anYapistir(){
  const st=cur(), e=st.exams.find(x=>x.id===ANEX); if(!e) return;
  const sk=anDers(st), tip=document.getElementById('anT').value;
  const txt=document.getElementById('anPaste').value;
  if(!txt.trim()){alert('Karnedeki konu listesini yapıştır.');return;}
  const havuz=(KONU[sk]||[]).flatMap(u=>u[1]);
  e.an=e.an||[]; let n=0,esles=0;
  txt.split(/[\r\n;,]+/).forEach(raw=>{
    const s=raw.replace(/^[\s\-•*\d.)]+/,'').trim();
    if(s.length<3) return;
    const L=norm(s);
    let hit=null,hl=0;
    havuz.forEach(t=>{const N=norm(t);
      if((N.includes(L)||L.includes(N))&&N.length>hl){hit=t;hl=N.length;}});
    const konu=hit||s;
    if(hit) esles++;
    e.an.push({sub:sk,konu,unite:hit?(uniteOf[sk]||{})[hit]:'Listede yok (karne adı)',tip,adet:1});
    n++;
  });
  document.getElementById('anPaste').value='';
  save(); render();
  alert(n+' konu eklendi. '+esles+' tanesi konu listesiyle eşleşti.');
}

function anGoster(st,e){
  const arr=e.an||[];
  if(!arr.length) return '<div class="empty">Bu deneme için henüz yanlış/boş konu girilmemiş.</div>';
  // ders -> ünite -> konu
  const g={};
  arr.forEach((a,i)=>{
    const d=g[a.sub]=g[a.sub]||{};
    const u=d[a.unite]=d[a.unite]||{};
    const k=u[a.konu]=u[a.konu]||{y:0,b:0,idx:[]};
    k[a.tip]+=a.adet; k.idx.push(i);
  });
  return Object.keys(g).map(sk=>{
    let ty=0,tb=0;

      ${Object.keys(g[sk]).map(u=>Object.keys(g[sk][u]).map((kk,j)=>{

/* tüm denemelerde tekrar eden yanlış konular */
function anTekrar(st){
  const agg={};
  st.exams.forEach(e=>(e.an||[]).forEach(a=>{
    const k=a.sub+'||'+a.konu;
    const x=agg[k]=agg[k]||{sub:a.sub,unite:a.unite,konu:a.konu,y:0,b:0,den:new Set()};
    x[a.tip]+=a.adet; x.den.add(e.id);
  }));
  const rows=Object.values(agg).map(r=>({...r,kac:r.den.size,tot:r.y+r.b}))
    .filter(r=>r.kac>=2).sort((a,b)=>b.kac-a.kac||b.tot-a.tot);
  if(!rows.length) return '';
  return `<div class="card"><h2>Tekrar eden konular — en az 2 denemede çıktı (${rows.length})</h2>
  <div class="body" style="padding:0;max-height:420px;overflow:auto">
  <table><thead><tr><th>Ders</th><th>Ünite</th><th>Konu</th><th class="num">Kaç denemede</th><th class="num">Yanlış</th><th class="num">Boş</th><th>Konu durumu</th></tr></thead><tbody>
  ${rows.map(r=>{
    const d=(st.topics[r.sub]||{})[r.konu];
    const et=['Görülmedi','İşleniyor','Bitti','Eksik'][d||0];
    return `<tr><td>${subName(r.sub)}</td><td style="color:var(--ink-3);font-size:12px">${esc(r.unite)}</td>
      <td><b>${esc(r.konu)}</b></td><td class="num" style="font-weight:650">${r.kac}</td>
      <td class="num" style="color:var(--bad)">${r.y||'·'}</td><td class="num" style="color:var(--warn)">${r.b||'·'}</td>
      <td><span class="pill s${d===2?1:d===3?3:d===1?2:0}">${et}</span></td></tr>`;
  }).join('')}
  </tbody></table></div>
  <div class="body" style="border-top:1px solid var(--line-soft)">
    <div class="hint"><b>"Bitti" işaretli ama üç denemede yanlış çıkan konu, bitmemiştir.</b> Konular sekmesinden <b>Eksik</b>'e çek — ödev listesine geri döner. Sistemin kendi kendini düzelttiği yer burasıdır.</div>
  </div></div>`;
}

/* ---------- HAFTALIK RAPOR ---------- */
function blokAyir(st){
  const l=subs(st);
  return {TYT:l.filter(x=>x[0].startsWith('tyt_')), AYT:l.filter(x=>!x[0].startsWith('tyt_'))};
}
function vHafta(st){
  const a=avgNets(st,3), bl=blokAyir(st);
  const ex=[...st.exams].sort((x,y)=>y.date.localeCompare(x.date)).slice(0,3);
  const wk=weekKey(today()), ws=weekStats(st,wk), hs=haftaSure(st,wk);
  const tasks=st.tasks.filter(t=>weekKey(t.date)===wk).sort((x,y)=>x.date.localeCompare(y.date));

  const blokKart=(ad,liste)=>{
    let c=0,t=0,varT=false;
    liste.forEach(([k])=>{c+=a.nets[k]||0; const r=+st.refNets[k]; if(r){t+=r;varT=true;}});
    const f=varT&&a.count?c-t:null;
    return `<div class="stat"><div class="k">${ad} toplam net</div>
      <div class="v">${a.count?n1(c):'—'}</div>
      <div class="n">hedef ${varT?n1(t):'—'} · fark <b style="color:${f===null?'inherit':f<0?'var(--bad)':'var(--ok)'}">${f===null?'—':(f>0?'+':'')+n1(f)}</b></div></div>`;
  };
  const dersSatir=([k,nm])=>{
    const c=a.nets[k], t=+st.refNets[k]||0;
    if(c===undefined&&!t) return '';
    const d=(c===undefined||!t)?null:c-t;
    const seri=ex.slice().reverse().map(e=>e.n[k]?n1(net(e.n[k].d||0,e.n[k].y||0)):'·').join(' → ');
    return `<tr><td>${nm}</td><td class="num" style="color:var(--ink-3);font-size:12px">${seri}</td>
      <td class="num" style="font-weight:600">${c===undefined?'—':n1(c)}</td>
      <td class="num" style="color:var(--ink-3)">${t?n1(t):'—'}</td>
      <td class="num" style="font-weight:650;color:${d===null?'var(--ink-3)':d<0?'var(--bad)':'var(--ok)'}">${d===null?'—':(d>0?'+':'')+n1(d)}</td></tr>`;
  };

  return `
  <div class="card"><div class="stats">
    ${blokKart('TYT',bl.TYT)}
    ${blokKart(trLabel(st.track)+' AYT',bl.AYT)}
    <div class="stat"><div class="k">Bu hafta ödev</div><div class="v">${ws.total||'—'}</div><div class="n">uyum ${ws.rate!==null?ws.rate+'%':'—'}</div></div>
    <div class="stat"><div class="k">Haftalık hedef süre</div><div class="v" style="font-size:21px">${hs.top?sa(hs.top):'—'}</div><div class="n">${hs.top?`rutin ${sa(hs.rut)} + konu ${sa(hs.konu)}`:'ödev verilince hesaplanır'}</div></div>
  </div></div>

  <div class="card"><h2>Son ${ex.length} deneme — ders bazında hedefe uzaklık</h2><div class="body" style="padding:0">
    ${ex.length?`<table><thead><tr><th>Ders</th><th class="num">Son ${ex.length} deneme</th><th class="num">Ortalama</th><th class="num">Hedef</th><th class="num">Fark</th></tr></thead>
      <tbody><tr><td colspan="5" style="background:#F3F7F8;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:650">TYT</td></tr>
      ${bl.TYT.map(dersSatir).join('')}
      <tr><td colspan="5" style="background:#F3F7F8;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:650">AYT — ${trLabel(st.track)}</td></tr>
      ${bl.AYT.map(dersSatir).join('')}
      </tbody></table>`:'<div class="empty">Deneme girildiğinde bu tablo dolar.</div>'}
  </div></div>

  ${raporKart(st)}

  ${rutinKart(st)}

  <div class="card"><h2>Bu haftanın ödevleri — hafta ${wk}</h2><div class="body" style="padding:0">
    ${tasks.filter(t=>!t.rutin).length?`<table><thead><tr><th>Gün</th><th>Ders</th><th>Ünite</th><th>Konu</th><th class="num">Soru</th><th class="num">Süre</th><th>Durum</th></tr></thead><tbody>
      ${tasks.filter(t=>!t.rutin).map(t=>`<tr><td class="num">${t.date.slice(5)}</td><td>${subName(t.sub)}</td>
        <td style="color:var(--ink-3);font-size:12px">${esc((uniteOf[t.sub]||{})[t.konu]||'—')}</td>
        <td><b>${esc(t.konu||'—')}</b></td><td class="num">${t.q||'—'}</td>
        <td class="num" style="color:var(--ink-3)">${t.konu?Math.round(sureOf(t.sub,t.konu))+' dk':'—'}</td>
        <td><button class="pill s${t.s}" onclick="cycleTask('${t.id}')">${SL[t.s]}</button></td></tr>`).join('')}
    </tbody></table>`:'<div class="empty">Bu hafta henüz ödev verilmemiş.</div>'}
  </div></div>

  <div class="card"><h2>Öğrenciye gönderilecek hafta notu</h2><div class="body">
    <textarea id="hfMetin" rows="16" style="font-family:var(--mono);font-size:12.5px;line-height:1.6;resize:vertical">${esc(haftaMetni(st))}</textarea>
    <div style="margin-top:10px">
      <button class="btn" onclick="waGonder()">WhatsApp'ta aç</button>
      <button class="btn ghost" style="margin-left:8px" onclick="kopyala('hfMetin')">Metni kopyala</button>
      <button class="btn ghost" style="margin-left:8px" onclick="render()">Yeniden üret</button>
    </div>
    <div class="hint" style="margin-top:8px">WhatsApp butonu, mesajı hazır şekilde sohbette açar — <b>göndermeyi sen onaylarsın</b>, sistem kendiliğinden mesaj atmaz. Telefon numarasını Hedef sekmesine gir.</div>
  </div></div>`;
}
function waGonder(){
  const st=cur();
  const metin=document.getElementById('hfMetin').value;
  if(!metin.trim()){alert('Gönderilecek metin boş.');return;}
  if(metin.length>3500&&!confirm('Metin uzun ('+metin.length+' karakter). WhatsApp kırpabilir. Yine de açılsın mı?')) return;
  let tel=String(st.tel||'').replace(/\D/g,'');
  if(tel.startsWith('0')) tel='90'+tel.slice(1);
  else if(tel.length===10&&tel.startsWith('5')) tel='90'+tel;
  const url = tel ? `https://wa.me/${tel}?text=${encodeURIComponent(metin)}`
                  : `https://wa.me/?text=${encodeURIComponent(metin)}`;
  if(!tel&&!confirm('Öğrencinin telefonu kayıtlı değil. WhatsApp açılacak, kişiyi sen seçeceksin. Devam?')) return;
  window.open(url,'_blank','noopener');
}
function kopyala(id){
  const el=document.getElementById(id); el.select(); el.setSelectionRange(0,999999);
  try{document.execCommand('copy');alert('Metin kopyalandı.');}catch(e){alert('Kopyalanamadı, elle seçip kopyala.');}
}

/* kural tabanlı hafta notu */
function haftaMetni(st){
  const a=avgNets(st,3), wk=weekKey(today());
  const tasks=st.tasks.filter(t=>weekKey(t.date)===wk).sort((x,y)=>x.date.localeCompare(y.date));
  const L=[];
  L.push(`${st.name} — ${wk} haftası`);
  L.push(`Hazırlanma tarihi: ${today()}`);
  const hk=haftaKalan(st); if(hk!==null) L.push(`Sınava ${hk} hafta.`);
  const hs=haftaSure(st,wk);
  if(hs.top) L.push(`Bu haftanın hedef çalışma süresi: ${sa(hs.top)}  (rutin ${sa(hs.rut)} + konu ${sa(hs.konu)}) — günde ~${sa(hs.top/7)}`);
  L.push('');

  // 1) nerede duruyor
  if(a.count){
    let c=0,t=0,v=false;
    subs(st).forEach(([k])=>{c+=a.nets[k]||0;const r=+st.refNets[k];if(r){t+=r;v=true;}});
    L.push(`DURUM: Son ${a.count} deneme ortalaman ${n1(c)} net.` + (v?` Hedefin ${n1(t)}. Aradaki fark ${n1(t-c)} net.`:''));
  }
  // 2) öncelikli dersler
  const oncelik=subs(st).map(([k,nm])=>{
    const c=a.nets[k],r=+st.refNets[k];
    return (c!==undefined&&r)?{nm,ac:r-c,or:(r-c)/r}:null;
  }).filter(x=>x&&x.ac>0).sort((x,y)=>y.ac-x.ac).slice(0,3);
  if(oncelik.length){
    L.push('');
    L.push('BU HAFTA ÖNCELİK:');
    oncelik.forEach((o,i)=>L.push(`${i+1}. ${o.nm} — hedefin ${n1(o.ac)} net gerisinde.`));
  }
  // 3) tekrar eden yanlışlar
  const agg={};
  st.exams.forEach(e=>(e.an||[]).forEach(x=>{
    const k=x.sub+'||'+x.konu; const o=agg[k]=agg[k]||{sub:x.sub,konu:x.konu,den:new Set(),y:0,b:0};
    o[x.tip]+=x.adet; o.den.add(e.id);
  }));
  const tekrar=Object.values(agg).filter(x=>x.den.size>=2).sort((x,y)=>y.den.size-x.den.size).slice(0,4);
  if(tekrar.length){
    L.push('');
    L.push('BİRDEN FAZLA DENEMEDE ÇIKAN KONULAR:');
    tekrar.forEach(x=>L.push(`- ${subName(x.sub)} / ${x.konu} — ${x.den.size} denemede (${x.y} yanlış, ${x.b} boş)`));
    L.push('Bu konuları yeniden okumadan önce, eski yanlışlarını aç ve nerede takıldığını yaz.');
  }
  // 4) sabit rutin
  const rv=rutinVar(st,wk);
  L.push('');
  L.push('SABİT HAFTALIK RUTİN (pazartesiden pazara yayarak yap):');
  if(rv.length) rv.forEach(t=>L.push(`- ${t.konu}: ${t.q} soru${t.yap?` (şu an ${t.yap})`:''} — günde ~${Math.ceil(t.q/7)} soru`));
  else rutinler().forEach(r=>L.push(`- ${r.ad}: ${r.adet} soru — günde ~${Math.ceil(r.adet/7)} soru`));
  L.push('Rutin pazarlık konusu değil. Diğer ödevler bitmese de bu ikisi biter.');

  // 5) haftanın ödevleri + nasıl yapılacağı
  const konuT=tasks.filter(t=>!t.rutin);
  if(konuT.length){
    L.push('');
    L.push('BU HAFTANIN KONU ÖDEVLERİ:');
    const gun={};
    konuT.forEach(t=>{(gun[t.date]=gun[t.date]||[]).push(t);});
    Object.keys(gun).sort().forEach(g=>{
      L.push(`  ${g}`);
      gun[g].forEach(t=>{
        const d=(st.topics[t.sub]||{})[t.konu]||0;
        const dk=t.konu?Math.round(sureOf(t.sub,t.konu)):null;
        L.push(`   - ${subName(t.sub)} / ${t.konu||'—'}${t.q?` (${t.q} soru)`:''}${dk?` ~${dk} dk`:''}`);
        L.push(`     ${yonerge(d,t)}`);
      });
    });
  }
  // 5) uyarı
  const w=weekStats(st,wk);
  L.push('');
  if(w.rate!==null&&w.rate<50) L.push('NOT: Geçen hafta plana uyum %50 altındaydı. Bu hafta liste kısa tutuldu; bitirmek şart.');
  L.push('Pazar akşamı raporunu göndermeyi unutma: hangi ödevi yaptın, hangi konudan kaç yanlış, yanlışın sebebi ne.');
  return L.join('\n');
}
function yonerge(durum,t){
  const q=t.q||0;
  if(durum===0) return `Önce konuyu bitir, sonra ${q?q+' soru':'soru'} çöz. Konuyu bitirmeden soruya geçme.`;
  if(durum===1) return `Kaldığın yerden devam et. Bitirdiğin bölümden hemen ${q?Math.round(q/2)+'-'+q:'10-20'} soru çöz.`;
  if(durum===3) return `Bu konu eksik işaretli. Kolay 5 soruyla başla, tıkandığın ilk soruyu not al ve bana yaz. Zoru sonra.`;
  return `Konu tekrarı: 15 dakika hızlı gözden geçir, sonra ${q?q+' soru':'soru'} çöz. Yanlışlarını hata günlüğüne yaz.`;
}

function saveExam(){

  });
  st.exams.push({id:uid(),date:document.getElementById('exD').value||today(),name:document.getElementById('exN').value.trim(),n,an});
  PENDING_AN=[];
  save(); render();

function odevDers(st){const l=subs(st); if(!OS||!l.find(x=>x[0]===OS)) OS=l[0][0]; return OS;}
function setOdevDers(k){OS=k;OU='';render();}

/* konu bazında ödev dökümü */
function odevDokum(st){
  const agg={};
  st.tasks.forEach(t=>{
    const key=t.sub+'||'+(t.konu||'—');
    const a=agg[key]=agg[key]||{sub:t.sub,konu:t.konu||'—',kez:0,soru:0,yap:0,kis:0,yok:0,bek:0,son:''};
    a.kez++; a.soru+=+t.q||0;
    if(t.s===1)a.yap++; else if(t.s===2)a.kis++; else if(t.s===3)a.yok++; else a.bek++;
    if(t.date>a.son)a.son=t.date;
  });
  const rows=Object.values(agg).sort((a,b)=>b.kez-a.kez||b.soru-a.soru);
  if(!rows.length) return '';
  const tKez=rows.reduce((s,r)=>s+r.kez,0), tSoru=rows.reduce((s,r)=>s+r.soru,0);
  return `<div class="card"><h2>Konu bazında ödev dökümü — ${rows.length} konu · ${tKez} ödev · ${tSoru} soru</h2>
    <div class="body" style="padding:0;max-height:520px;overflow:auto">
    <table><thead><tr><th>Ders</th><th>Ünite</th><th>Konu</th><th class="num">Kaç kez</th><th class="num">Toplam soru</th>
      <th class="num">Yapıldı</th><th class="num">Kısmen</th><th class="num">Yapılmadı</th><th class="num">Uyum</th><th class="num">Son</th></tr></thead><tbody>
    ${rows.map(r=>{
      const bitmis=r.kez-r.bek;
      const u=(uniteOf[r.sub]||{})[r.konu]||'—';
      const or=bitmis?Math.round((r.yap+r.kis*0.5)/bitmis*100):null;
      return `<tr><td>${subName(r.sub)}</td><td style="color:var(--ink-3);font-size:12px">${esc(u)}</td><td><b>${esc(r.konu)}</b></td>
        <td class="num" style="font-weight:650">${r.kez}</td><td class="num">${r.soru||'—'}</td>
        <td class="num">${r.yap}</td><td class="num">${r.kis}</td><td class="num" style="color:${r.yok?'var(--bad)':'inherit'}">${r.yok}</td>
        <td class="num" style="font-weight:600;color:${or===null?'var(--ink-3)':or>=70?'var(--ok)':or>=50?'var(--warn)':'var(--bad)'}">${or===null?'—':or+'%'}</td>
        <td class="num" style="color:var(--ink-3)">${r.son.slice(5)}</td></tr>`;
    }).join('')}
    </tbody></table></div>
    <div class="body" style="border-top:1px solid var(--line-soft)">
      <div class="hint">Çok tekrar edilen ama uyumu düşük konular, öğrencinin kaçındığı konulardır. Üç kez verilip üç kez yapılmayan bir konu, ödev sorunu değil <b>korku</b> sorunudur — planı değil konuşmayı değiştir.</div>
    </div></div>`;
}
function addTask(){
  const st=cur();
  const konu=document.getElementById('tkK').value;
  if(!konu){alert('Konu seç.');return;}
  st.tasks.push({id:uid(),date:document.getElementById('tkD').value||today(),type:document.getElementById('tkT').value,
    sub:odevDers(st),konu,q:+document.getElementById('tkQ').value||0,txt:document.getElementById('tkX').value.trim(),s:0});
  save(); render();
}
function cycleTask(id){const t=cur().tasks.find(x=>x.id===id); t.s=(t.s+1)%4; save(); render();}
function delTask(id){const st=cur(); st.tasks=st.tasks.filter(t=>t.id!==id); save(); render();}
function bulkWeek(w,s){const st=cur(); st.tasks.forEach(t=>{if(weekKey(t.date)===w)t.s=s;}); save(); render();}

    ${stats.map(s=>`<tr style="cursor:pointer" onclick="KSUB='${s.k}';render()"><td>${s.nm}</td>

function uniteAll(sk,u,v){
  const st=cur(); st.topics[sk]=st.topics[sk]||{};
  ((KONU[sk]||[]).find(x=>x[0]===u)||['',[]])[1].forEach(t=>st.topics[sk][t]=v);
  save(); render();
}
function cycleTopic(sk,tn){
  const st=cur(); st.topics[sk]=st.topics[sk]||{};
  st.topics[sk][tn]=((st.topics[sk][tn]||0)+1)%4; save(); render();
}

  const r=hesapla(st.track,PN,obp,yer);

  const rows=list.map(([k,nm,q])=>{

  </div></div>

  <div class="card"><h2>Bu hesap ne kadar doğru</h2><div class="body">
    <div class="flag warn"><span class="ic">i</span><span>ÖSYM gerçek puanı <b>standart puan</b> üzerinden hesaplar: her testin o yılki ülke ortalaması ve standart sapması işin içine girer. Bu değerler sınavdan sonra açıklandığı için önceden tam hesap kimse yapamaz. Buradaki model, deneme kitapçıklarının kullandığı ham puan yöntemidir; sapma tipik olarak ±10-15 puandır. Sıralama tahmini için değil, <b>dağılım karşılaştırması</b> için kullan.</span></div>
  </div></div>`;
}
function liveCalc(){
  const st=cur(); const r=hesapla(st.track,PN,+st.obp||0,!!st.yerlesti);
  document.getElementById('pvTyt').textContent=n1(r.tytPuan);
  document.getElementById('pvYer').textContent=n1(r.yerPuan);
  document.getElementById('pvObp').textContent=n1(r.obpPay);
  const h=parseFloat(String(st.score).replace(',','.'));
  const f=document.getElementById('pvFark');
  if(isFinite(h)){const d=r.yerPuan-h;f.textContent=(d>0?'+':'')+n1(d);f.style.color=d<0?'var(--bad)':'var(--ok)';}
  document.querySelectorAll('[data-kk]').forEach(td=>{
    const k=td.dataset.kk, kat=KTYT[k]?KTYT[k]*0.4:(KAYT[st.track]||{})[k];
    td.textContent=n1((+PN[k]||0)*kat);
  });
}
function setDip(v){const st=cur();st.dip=v===''?'':+v;st.obp=v===''?'':Math.round(+v*5*100)/100;document.getElementById('pObp').value=st.obp;save();liveCalc();
  const b=document.querySelector('.stat .n');if(b)b.textContent='OBP dahil · en fazla 560';}
function setYerlesti(b){const st=cur();st.yerlesti=b;save();render();}
function saveAsRef(){
  const st=cur(); let c=0;
  subs(st).forEach(([k])=>{ if(PN[k]!==undefined&&PN[k]!==''){st.refNets[k]=+PN[k];c++;} });
  save(); alert(c+' ders için hedef net kaydedildi. Durum sekmesindeki karşılaştırma güncellendi.'); TAB='durum'; render();
}

/* ---------- HEDEF ---------- */
function vHedef(st){
  const list=subs(st);
  return `
  <div class="card"><h2>Hedef bölüm</h2><div class="body">
    <div class="fr">
      <div style="flex:2"><label class="f">Bölüm ve üniversite</label><input type="text" id="hD" value="${esc(st.dept)}" placeholder="ör. Hacettepe Üniversitesi Tıp"></div>
      <div><label class="f">Hedef sıralama</label><input type="text" id="hR" value="${esc(st.rank)}" placeholder="ör. 12.000"></div>
      <div><label class="f">Hedef puan</label><input type="text" id="hS" value="${esc(st.score)}" placeholder="ör. 480"></div>
    </div>
    <div class="fr">
      <div><label class="f">Geçen yıl taban puan</label><input type="text" id="hTP" value="${esc(st.tabanPuan)}" placeholder="ör. 478,52"></div>
      <div><label class="f">Geçen yıl başarı sırası</label><input type="text" id="hTS" value="${esc(st.tabanSira)}" placeholder="ör. 13.240"></div>
      <div><label class="f">Veri yılı</label><input type="text" id="hTY" value="${esc(st.tabanYil)}" placeholder="ör. 2025"></div>
    </div>
    <div class="fr">
      <div><label class="f">Sınav tarihi</label><input type="date" id="hSD" value="${esc(st.sinavTarihi)}"></div>
      <div><label class="f">Haftalık çalışma saati (beyan)</label><input type="number" id="hHS" min="0" max="80" value="${st.haftalikSaat??''}" placeholder="ör. 25"></div>
      <div><label class="f">WhatsApp numarası</label><input type="text" id="hTel" value="${esc(st.tel)}" placeholder="05XX XXX XX XX"></div>
    </div>
    <button class="btn" onclick="saveGoal()">Hedefi kaydet</button>
    <button class="btn ghost" style="margin-left:8px" onclick="openAtlas()">YÖK Atlas'ta aç</button>
    <div class="hint">Taban puan ve başarı sırasını YÖK Atlas'tan kopyalayıp buraya yapıştır. Otomatik çekim yapılmıyor: panel internetsiz çalışsın diye dış bağlantı yok, ayrıca YÖK Atlas'ın gayriresmî erişim yolları her site güncellemesinde kırılıyor.</div>
  </div></div>

  <div class="card"><h2>Referans netler — geçen yıl bu bölüme giren öğrencinin netleri</h2><div class="body">
    <table><thead><tr><th>Ders</th><th class="num">Soru sayısı</th><th class="num">Hedef net</th></tr></thead><tbody>
      ${list.map(([k,nm,q])=>`<tr><td>${nm}</td><td class="num" style="color:var(--ink-3)">${q}</td>
        <td class="num" style="width:130px"><input type="number" step="0.25" min="0" max="${q}" id="r_${k}" value="${st.refNets[k]??''}" placeholder="—"></td></tr>`).join('')}
    </tbody></table>
    <div style="margin-top:14px"><button class="btn" onclick="saveRef()">Referans netleri kaydet</button></div>
    <div class="hint">Bu değerleri ÖSYM/YÖK Atlas verisinden ya da hedef sıralamaya karşılık gelen net dağılımından elle gireceksin. Durum sekmesindeki tüm karşılaştırma bu satırlara dayanır.</div>
  </div></div>

  <div class="card"><h2>Öğrenci kaydı</h2><div class="body">
    <div class="fr">
      <div><label class="f">Sınıf</label><input type="text" id="hG" value="${esc(st.grade)}"></div>
      <div><label class="f">Alan</label><select id="hT">${['SAY','EA','SOZ','DIL'].map(t=>`<option value="${t}" ${st.track===t?'selected':''}>${trLabel(t)}</option>`).join('')}</select></div>
    </div>
    <button class="btn ghost" onclick="saveMeta()">Güncelle</button>
    <button class="btn danger" style="margin-left:8px" onclick="delStudent()">Öğrenciyi sil</button>
  </div></div>`;
}
function saveGoal(){const st=cur();st.dept=document.getElementById('hD').value.trim();st.rank=document.getElementById('hR').value.trim();st.score=document.getElementById('hS').value.trim();
  st.tabanPuan=document.getElementById('hTP').value.trim();st.tabanSira=document.getElementById('hTS').value.trim();st.tabanYil=document.getElementById('hTY').value.trim();
  st.sinavTarihi=document.getElementById('hSD').value;st.haftalikSaat=document.getElementById('hHS').value===''?'':+document.getElementById('hHS').value;
  st.tel=document.getElementById('hTel').value.trim();save();render();}
function openAtlas(){
  const st=cur(), q=(document.getElementById('hD')?.value||st.dept||'').trim();
  if(!q){alert('Önce bölüm adını yaz.');return;}
  window.open('https://yokatlas.yok.gov.tr/lisans-anasayfa.php?arama='+encodeURIComponent(q),'_blank','noopener');
}
function saveRef(){const st=cur();subs(st).forEach(([k])=>{const v=document.getElementById('r_'+k).value;if(v==='')delete st.refNets[k];else st.refNets[k]=+v;});save();render();}
function saveMeta(){const st=cur();st.grade=document.getElementById('hG').value.trim();st.track=document.getElementById('hT').value;save();render();}

/* ---------- YEDEK ---------- */
function exportData(){
  const b=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);
  a.download='kocluk-yedek-'+today()+'.json';a.click();URL.revokeObjectURL(a.href);
}
function importData(ev){
  const f=ev.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);
    if(!d.students){alert('Bu dosya bir koçluk yedeği değil.');return;}
    if(!confirm('Mevcut veriler bu yedekle değiştirilecek. Devam?'))return;
    DB=d; DB.sel=DB.students[0]?.id||null; save(); render();
  }catch(e){alert('Dosya okunamadı: '+e.message);}};
  r.readAsText(f); ev.target.value='';
}

/* ---------- AÇILIŞ ---------- */
(async()=>{
  const d=await load();
  if(d&&d.students) DB=d;
  if(!DB.sel&&DB.students[0]) DB.sel=DB.students[0].id;
  const hs=decodeURIComponent(location.hash.slice(1)||'');
  if(hs.includes('KOCRAPOR1:')){
    history.replaceState(null,'',location.pathname+location.search);
    const m=hs.match(/KOCRAPOR1:([A-Za-z0-9+/=]+)/);
    let sahip=null;
    try{ const p=JSON.parse(b64d(m[1])); sahip=DB.students.find(s=>s.id===p.id); }catch(e){}
    if(sahip) DB.sel=sahip.id;
    TAB='hafta'; render();
    const st=cur();
    if(st){ const P=raporKodOku(st,hs); if(P){ RAPOR_ON=P; render(); } }
    return;
  }
  render();
})();
</script>
