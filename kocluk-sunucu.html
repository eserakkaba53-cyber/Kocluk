<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{
  --ink:#122430;
  --ink-2:#3D5566;
  --ink-3:#7E939F;
  --paper:#E9EDEF;
  --panel:#FFFFFF;
  --line:#CBD6DB;
  --line-soft:#E2E9EC;
  --accent:#186C68;
  --accent-soft:#D8E8E6;
  --ok:#1F7A55;
  --warn:#B0710A;
  --bad:#A73A2C;
  --ok-bg:#E2F0EA;
  --warn-bg:#F8EEDA;
  --bad-bg:#F6E3E0;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:"SF Mono",'JetBrains Mono',Consolas,"Liberation Mono",Menlo,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5}
button{font-family:inherit;font-size:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:flex;min-height:100vh}

/* ---- sol ray ---- */
.rail{width:246px;flex:none;background:var(--ink);color:#DCE6EA;display:flex;flex-direction:column;position:relative;overflow:hidden}


.rail-top{padding:18px 14px 16px;border-bottom:1px solid rgba(255,255,255,.12);text-align:center}
.rail-top .logo{width:150px;height:auto;display:block;margin:2px auto 8px}
.rail-top .brand{text-align:center}

.brand{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#7FA8A5;font-weight:600}
.brand b{display:block;font-size:17px;letter-spacing:0;text-transform:none;color:#fff;margin-top:3px;font-weight:600}
.rail-list{flex:1;overflow:auto;padding:8px 0}
.st-item{display:block;width:100%;text-align:left;background:none;border:0;color:#C6D5DB;padding:9px 16px;border-left:3px solid transparent}
.st-item:hover{background:rgba(255,255,255,.06);color:#fff}
.st-item.on{background:rgba(255,255,255,.11);border-left-color:#4FB3A9;color:#fff}
.st-item .nm{font-weight:600}
.st-item .sub{font-size:11.5px;color:#88A3AE;font-family:var(--mono)}
.rail-bot{padding:12px 14px;border-top:1px solid rgba(255,255,255,.12);display:flex;flex-direction:column;gap:7px}
.rail-bot button{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);color:#DCE6EA;padding:7px 10px;border-radius:5px;font-size:12.5px}
.rail-bot button:hover{background:rgba(255,255,255,.17)}

/* ---- ana ---- */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.hdr{background:var(--panel);border-bottom:1px solid var(--line);padding:16px 26px 0;position:sticky;top:0;z-index:40;box-shadow:0 1px 0 rgba(0,0,0,.04),0 6px 14px -10px rgba(11,32,51,.35)}
.hdr-row{display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap}
.hdr h1{margin:0;font-size:23px;font-weight:650;letter-spacing:-.01em}
.hdr .meta{font-family:var(--mono);font-size:12px;color:var(--ink-3);letter-spacing:.02em}
.hdr .goal{margin-left:auto;text-align:right}
.hdr .goal .d{font-size:13.5px;font-weight:600}
.hdr .goal .r{font-family:var(--mono);font-size:12px;color:var(--ink-2)}
.tabs{display:flex;gap:2px;margin-top:14px}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:9px 14px;color:var(--ink-2);font-size:13.5px;font-weight:550}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.view{padding:22px 26px 60px;flex:1}

/* ---- kart ---- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:7px;margin-bottom:18px}
.card>h2 small{display:block;text-transform:none;letter-spacing:0;font-weight:400;font-size:11.5px;color:var(--ink-3);margin-top:3px}
.card>h2{margin:0;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);padding:13px 18px;border-bottom:1px solid var(--line-soft);font-weight:650}
.card .body{padding:18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:980px){.grid2{grid-template-columns:1fr}}

/* ---- imza: hedef farkı çubuğu ---- */
.gap-row{display:grid;grid-template-columns:150px 1fr 200px;gap:14px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line-soft)}
.gap-row:last-child{border-bottom:0}
.gap-name{font-size:13px;font-weight:550}
.gap-bar{position:relative;height:19px;background:#EDF1F3;border-radius:3px;overflow:hidden}
.gap-fill{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:3px 0 0 3px}
.gap-def{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(45deg,#E8BCB5,#E8BCB5 4px,#F3D8D3 4px,#F3D8D3 8px)}
.gap-tick{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink)}
.gap-nums{font-family:var(--mono);font-size:12.5px;display:flex;gap:10px;justify-content:flex-end;letter-spacing:-.01em}
.gap-nums .cur{font-weight:600}
.gap-nums .t{color:var(--ink-3)}
.gap-nums .d{font-weight:600;min-width:52px;text-align:right}
.d.neg{color:var(--bad)} .d.pos{color:var(--ok)}

/* ---- istatistik ---- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line-soft)}
@media(max-width:820px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--panel);padding:15px 18px}
.stat .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.stat .v{font-family:var(--mono);font-size:25px;font-weight:600;letter-spacing:-.02em;margin-top:3px}
.stat .n{font-size:11.5px;color:var(--ink-3)}

/* ---- uyarı ---- */
.flag{display:flex;gap:10px;padding:11px 14px;border-radius:5px;margin-bottom:8px;font-size:13px;align-items:flex-start}
.flag:last-child{margin-bottom:0}
.flag.bad{background:var(--bad-bg);color:#7C2B20}
.flag.warn{background:var(--warn-bg);color:#7A4E06}
.flag.ok{background:var(--ok-bg);color:#155C40}
.flag .ic{font-family:var(--mono);font-weight:700;flex:none}

/* ---- tablo ---- */
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:650;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:8px 10px;border-bottom:1px solid var(--line-soft)}
td.num,th.num{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
tr:hover td{background:#F7FAFB}

/* ---- form ---- */
label.f{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:650;margin-bottom:4px}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:5px;background:#FCFDFD;color:var(--ink)}
input[type=number]{font-family:var(--mono);text-align:right}
.fr{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.fr>div{flex:1;min-width:130px}
.btn{background:var(--accent);color:#fff;border:0;padding:8px 16px;border-radius:5px;font-weight:600;font-size:13px}
.btn:hover{background:#125552}
.btn.ghost{background:none;color:var(--accent);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.mini{padding:4px 10px;font-size:12px}
.btn.danger{background:none;color:var(--bad);border:1px solid var(--line)}
.btn.danger:hover{background:var(--bad-bg)}

/* ---- ödev durumu ---- */
.pill{border:1px solid var(--line);background:#fff;border-radius:20px;padding:3px 11px;font-size:12px;font-weight:600}
.pill.s0{color:var(--ink-3)}
.pill.s1{background:var(--ok-bg);border-color:#B6D8C8;color:var(--ok)}
.pill.s2{background:var(--warn-bg);border-color:#E6CF9C;color:var(--warn)}
.pill.s3{background:var(--bad-bg);border-color:#E4B8B1;color:var(--bad)}

/* ---- konu ---- */
.topic-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:7px}
.topic{display:flex;align-items:center;gap:9px;padding:6px 9px;border:1px solid var(--line-soft);border-radius:5px;background:#FCFDFD;font-size:12.5px}
.topic .dot{width:9px;height:9px;border-radius:50%;flex:none;border:1px solid rgba(0,0,0,.15)}
.topic .tn{flex:1;min-width:0}
.dot.t0{background:#DDE4E7}.dot.t1{background:#E8B44A}.dot.t2{background:var(--ok)}.dot.t3{background:var(--bad)}
.legend{display:flex;gap:16px;font-size:12px;color:var(--ink-2);margin-bottom:12px;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:6px}

.empty{padding:34px 18px;text-align:center;color:var(--ink-3);font-size:13.5px}
.hint{font-size:12px;color:var(--ink-3);margin-top:6px}
.sec-h{display:flex;align-items:center;gap:12px;margin:0 0 12px}
.sec-h h3{margin:0;font-size:14px;font-weight:650}
.spark{display:block}

/* Kullanım videoları — tek sıra. Sütun sayısı video sayısına eşittir.
   Dar ekranlarda okunmaz hale gelmemesi için kademeli olarak kırılır. */
.vsira{display:grid;grid-template-columns:repeat(var(--n,6),minmax(0,1fr));gap:9px}
.vsira > button{min-width:0}
@media(max-width:1100px){ .vsira{grid-template-columns:repeat(3,minmax(0,1fr))} }
@media(max-width:620px){  .vsira{grid-template-columns:repeat(2,minmax(0,1fr))} }

/* ================= TABLET VE TELEFON =================
   Panel masaustu icin tasarlandi; dar ekranda yapiyi
   kirmadan sigdirir. Genis ekranlarda hicbir sey degismez. */

/* --- tablet: dar ray, daha az bosluk --- */
@media(max-width:1024px){
  .rail{width:200px}
  .hdr{padding:12px 16px 0}
  .view{padding:16px 16px 60px}
  .hdr h1{font-size:20px}
  .grid2{grid-template-columns:1fr}
}

/* --- telefon: ray uste tasinir, ogrenci secici serit olur --- */
@media(max-width:760px){
  .app{flex-direction:column}
  .rail{width:100%;flex-direction:column;max-height:none}
  .rail-top{padding:10px 12px 8px}
  .rail-top .logo{width:96px}
  .rail-list{max-height:150px;overflow-y:auto;padding:4px 0}
  .st-item{padding:8px 14px}

  .hdr{padding:10px 14px 0}
  .hdr-row{gap:6px}
  .hdr h1{font-size:18px}
  .goal{margin-left:0;text-align:left;width:100%}

  /* sekmeler tasmasin, yatay kaysin */
  .tabs{flex-wrap:wrap;margin-top:10px}
  .tab{white-space:nowrap;padding:9px 11px;font-size:13px}

  .view{padding:12px 12px 60px}
  .card{margin-bottom:12px}
  .card .body{padding:12px}
  .card>h2{padding:11px 12px}

  /* genis tablolar kart icinde yatay kaysin */

  .stats{grid-template-columns:repeat(2,1fr)}
  .gap-row{grid-template-columns:1fr;gap:4px}
  .vsira{grid-template-columns:repeat(2,minmax(0,1fr))}

  /* dokunma hedefleri buyusun */
  .btn{min-height:40px}
}

/* --- cok dar telefon --- */
@media(max-width:420px){
  .stats{grid-template-columns:1fr}
  .vsira{grid-template-columns:1fr}
  .hdr h1{font-size:17px}
}



/* ---- ikili seçim düğmesi (segmented) ---- */
.seg{display:flex;gap:2px;background:var(--soft);border:1px solid var(--line);
     border-radius:7px;padding:3px}
.seg > button{flex:1;border:0;background:transparent;padding:9px 12px;border-radius:5px;
     font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.seg > button.on{background:var(--accent);color:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg > button:disabled{opacity:.45;cursor:not-allowed}
@media(max-width:760px){
  .seg{flex-direction:column}
  .seg > button{font-size:12.5px;padding:10px}
}

/* ===== ÖNCELİK ROZETLERİ · mobil uyumlu ===== */
.onc-sat{display:flex;flex-wrap:wrap;gap:3px;margin-top:3px;line-height:1.4}
.onc-sat > span{max-width:100%}
.topic .tn{display:block;min-width:0;overflow-wrap:break-word}
@media(max-width:760px){
  .topic-grid{grid-template-columns:1fr}
  .topic{align-items:flex-start;padding:8px 9px}
  .onc-sat{margin-top:4px}
  .onc-sat > span{font-size:8.5px !important;padding:1px 4px !important}
}
@media(max-width:400px){
  .onc-sat > span{font-size:8px !important;letter-spacing:0 !important}
}

@media print{ .hdr{position:static;box-shadow:none} }

/* ===== SAYFA YANA KAYMAZ · TABLOLAR KENDİ İÇİNDE KAYAR ===== */
*,*::before,*::after{box-sizing:border-box}
html,body{max-width:100%;overflow-x:hidden}
img,svg,video,canvas,iframe{max-width:100%}

/* Yazı ekran genişliğine göre kendini ayarlar:
   clamp(en küçük, ekrana göre, en büyük) */
body{font-size:clamp(13px,3.4vw,14px)}
.card>h2{font-size:clamp(10.5px,2.7vw,12px)}
.tab{font-size:clamp(11.5px,3vw,13.5px)}

@media(max-width:760px){
  /* sekmeler kaymasın, alt satıra insin */
  .tabs{overflow-x:visible;flex-wrap:wrap;gap:1px}
  .tab{white-space:normal;padding:8px 10px}

  /* Geniş tablo SAYFAYI değil, sadece kendi kartını kaydırır.
     Doğal sütun genişlikleri korunur; harf harf bölünme olmaz. */
  .card .body{padding:10px;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .card .body table{table-layout:auto;width:auto;min-width:100%;font-size:11px}
  .card .body th{white-space:nowrap;padding:6px 8px;font-size:9.5px}
  .card .body td{padding:6px 8px;word-break:normal;overflow-wrap:normal;line-height:1.35}
  .card .body td b{font-weight:650}
  /* süre, soru, net gibi sayı hücreleri alt alta bölünmesin */
  .card .body td.num,.card .body th.num{white-space:nowrap}
  .pill,.btn{white-space:nowrap}
  .pill{font-size:10px;padding:2px 7px}
  .btn{font-size:12.5px;padding:9px 12px}
  .hint,.empty{font-size:11.5px}
  .stat .n{font-size:19px}
  .stat .k{font-size:9.5px}

  .hdr h1{font-size:clamp(16px,4.4vw,20px)}
  .goal{font-size:clamp(11px,2.9vw,13px)}
  .wrap,.view{max-width:100%}
}


/* --- çok dar telefon: bir kademe daha küçük --- */
@media(max-width:400px){
  .card .body table{font-size:10.5px}
  .card .body th{font-size:9px;padding:5px 6px}
  .card .body td{padding:5px 6px}
  .card>h2{padding:9px 10px}
  .btn{font-size:12px;padding:8px 10px}
}


/* ===== MOBİLDE FORM ÖĞELERİ ===== */
@media(max-width:760px){
  /* açılır listeler, sayı kutuları, metin alanları */
  .card .body input,
  .card .body select,
  .card .body textarea{
    font-size:13px;
    padding:6px 8px;
    min-height:34px;
    max-width:100%;
  }
  /* tablo içindeki daracık kutular daha da küçük */
  .card .body table input,
  .card .body table select{
    font-size:12px;
    padding:5px 6px;
    min-height:32px;
  }
  .card .body table input[type=number]{min-width:52px;width:100%}
  .card .body table select{min-width:96px}
  .btn.mini{font-size:11.5px;padding:6px 10px;min-height:32px}

  /* butonun yanındaki açıklama yazısı butonun üstüne binmesin */
  .btn + .hint,
  .btn + span.hint{display:block;margin:8px 0 0 0;font-size:11px}

  /* etiketler */
  label,.f{font-size:11px}
}
@media(max-width:400px){
  .card .body input,.card .body select,.card .body textarea{font-size:12.5px}
  .card .body table input,.card .body table select{font-size:11.5px;min-height:30px}
}


/* ===== TAŞMA DÜZELTMESİ =====
   .flag hem rozet hem uyarı kutusu için kullanılıyor.
   Uyarı kutusu uzun metin taşır — asla tek satıra zorlanmamalı. */
.flag{white-space:normal;max-width:100%}
.flag > span{min-width:0;overflow-wrap:break-word}
.card,.stat,.view,.wrap{max-width:100%}

<!-- Sunucu ayarları: ayrı dosyada, güncellemelerden etkilenmez -->
<script src="sunucu.js"></script>
<script>
/* ================= DEPOLAMA =================
   Sıra: Claude ortamı deposu → tarayıcı deposu (kendi PC'nde) → bellek.
   Gerçek yedek her zaman .json dosyasıdır. Haftada bir indir. */
const KEY='kocluk_v1_sunucu';
/* Panelin tüm verisi. Sunucudan yüklenir; buradaki değerler yalnızca ilk çizim içindir. */
let DB={students:[],sel:null,siteUrl:'',kocTel:'',kocAd:'',sureler:{},rutin:[]};
let TAB='hafta';
/* Panellerin bulunduğu klasör. Ayar gerektirmez; panelin kendi adresinden türetilir.
   Örn. .../Kocluk/kocluk-sunucu.html  →  .../Kocluk/ */
function tabanAdres(){
  if(location.protocol==='http:'||location.protocol==='https:'){
    return location.origin + location.pathname.replace(/[^/]*$/,'');
  }
  return (DB.siteUrl||'').replace(/\/?$/,'/');   // dosyadan açıldıysa yedek
}
function ogrenciPaneliAdresi(){ return tabanAdres()+'ogrenci-sunucu.html'; }   // eski panel 'kocluk_v1' kullanır; ikisi birbirine karışmaz
const ESKIKEY='kocluk_v1';
let MEM=null;
async function load(){
  try{ if(window.storage){const r=await window.storage.get(KEY); if(r&&r.value) return JSON.parse(r.value);} }catch(e){}
  try{ const s=localStorage.getItem(KEY); if(s) return JSON.parse(s); }catch(e){}
  return MEM;
}
let YAZKUYRUK=null, YAZDURUM='';
function sunucuyaKaydet(){
  if(DEMO) return;              // tanıtım modu: hiçbir şey kaydedilmez
  if(!sbOturum()) return;
  if(ornekMi(DB.sel)) return;     // örnek öğrenciler sunucuya yazılmaz
  clearTimeout(YAZKUYRUK);
  YAZKUYRUK=setTimeout(async()=>{
    const st=cur();
    try{
      YAZDURUM='yaziliyor'; rayDurum();
      if(st) await ogrenciYaz(st);
      await kocYaz();
      YAZDURUM='ok'; rayDurum();
      setTimeout(()=>{ if(YAZDURUM==='ok'){YAZDURUM=''; rayDurum();} },1800);
    }catch(e){ YAZDURUM='hata|'+(e.message||e); rayDurum(); }
  },900);
}
function rayDurum(){
  const lr=document.getElementById('lisansRozet');
  if(lr && !sbOturum()) lr.innerHTML='';
  const el=document.getElementById('sbDurum'); if(!el) return;
  if(!sbOturum()){ el.innerHTML=''; return; }
  const d=YAZDURUM;
  el.innerHTML = d==='yaziliyor' ? '<span style="color:#8FB3C7">kaydediliyor…</span>'
    : d==='ok' ? '<span style="color:#7FD1A8">✓ kaydedildi</span>'
    : d.startsWith('hata|') ? '<span style="color:#F0A79C" title="'+esc(d.slice(5))+'">⚠ kaydedilemedi</span>'
    : '<span style="color:#6E8E9B">'+esc(SB.mail||'')+'</span>';
}
async function save(){
  if(DEMO) return;              // tanıtım modunda yerel kayıt da yok
  sunucuyaKaydet();
  const s=JSON.stringify(DB); MEM=DB;
  try{ if(window.storage){await window.storage.set(KEY,s); return;} }catch(e){}
  try{ localStorage.setItem(KEY,s); }catch(e){}
}

/* ================= DERSLER ================= */
const S={
  TYT:[['tyt_tur','TYT Türkçe',40],['tyt_mat','TYT Matematik',30],['tyt_geo','TYT Geometri',10],['tyt_fiz','TYT Fizik',7],
       ['tyt_kim','TYT Kimya',7],['tyt_biy','TYT Biyoloji',6],['tyt_tar','TYT Tarih',5],
       ['tyt_cog','TYT Coğrafya',5],['tyt_fel','TYT Felsefe',5],['tyt_din','TYT Din',5]],
  SAY:[['ayt_mat','AYT Matematik',30],['ayt_geo','AYT Geometri',10],['ayt_fiz','AYT Fizik',14],['ayt_kim','AYT Kimya',13],['ayt_biy','AYT Biyoloji',13]],
  EA :[['ayt_mat','AYT Matematik',30],['ayt_geo','AYT Geometri',10],['ayt_edb','AYT Edebiyat',24],['ayt_tar1','AYT Tarih-1',10],['ayt_cog1','AYT Coğrafya-1',6]],
  SOZ:[['ayt_edb','AYT Edebiyat',24],['ayt_tar1','AYT Tarih-1',10],['ayt_cog1','AYT Coğrafya-1',6],
       ['ayt_tar2','AYT Tarih-2',11],['ayt_cog2','AYT Coğrafya-2',11],['ayt_fel','AYT Felsefe Grubu',12],['ayt_din','AYT Din',6]],
  DIL:[['ydt','YDT Yabancı Dil',80]]
};
const subs=st=>S.TYT.concat(S[st.track]||[]);
const subName=k=>{for(const g in S)for(const s of S[g])if(s[0]===k)return s[1];return k;};
const subQ=k=>{for(const g in S)for(const s of S[g])if(s[0]===k)return s[2];return 0;};

/* ================= KONULAR =================
   Kaynak: kullanicinin yukledigi YKS konu listesi (unite -> konu).
   Yapi: KONU[dersKodu] = [[uniteAdi,[konu,...]],...]  */
/* Geometri, matematikten AYRI bir ders olarak izlenir.
   Puan hesabında matematiğe dahil edilir (TYT 40 soru = 30 mat + 10 geo). */

/* n: {dersKodu: net} , obp: 250-500 , yerlesti: bool */
function hesapla(track,n,obp,yerlesti){
  let tytX=0; for(const k in KTYT) tytX += (+n[k]||0)*KTYT[k];
  let aytX=0; const ka=KAYT[track]||{}; for(const k in ka) aytX += (+n[k]||0)*ka[k];
  const tytHam = 100 + tytX;
  const yerHam = 100 + 0.4*tytX + aytX;
  const obpPay = (+obp||0) * (yerlesti?0.06:0.12);
  return {tytHam, yerHam, obpPay, tytPuan: tytHam+obpPay, yerPuan: yerHam+obpPay};
}

function norm(s){
  return s.toLocaleLowerCase('tr-TR')
    .replace(/[ıİ]/g,'i').replace(/[şŞ]/g,'s').replace(/[ğĞ]/g,'g')
    .replace(/[üÜ]/g,'u').replace(/[öÖ]/g,'o').replace(/[çÇ]/g,'c')
    .replace(/\s+/g,' ').trim();
}
function solveLine(nums,q){
  let best=null;
  for(let i=0;i<nums.length;i++)for(let j=0;j<nums.length;j++){
    if(i===j) continue;
    const D=nums[i],Y=nums[j];
    if(!Number.isInteger(D)||!Number.isInteger(Y)||D<0||Y<0||D>q||Y>q||D+Y>q) continue;
    const nt=D-Y/4;
    let sc=0;
    if(nums.some((v,x)=>x!==i&&x!==j&&Math.abs(v-nt)<0.06)) sc+=3;      // net satırda var
    if(nums.some((v,x)=>x!==i&&x!==j&&Number.isInteger(v)&&D+Y+v===q)) sc+=2; // boş tutuyor
    if(i<j) sc+=1;                                                       // D genelde Y'den önce
    if(sc<3) continue;                                                   // en az bir güçlü kanıt şart
    if(!best||sc>best.sc||(sc===best.sc&&i<best.i)) best={D,Y,sc,i};
  }
  return best;
}

  ['biyoloji-1','tyt_biy'],['biyoloji-2','ayt_biy'],['biy-1','tyt_biy'],['biy-2','ayt_biy'],['biyoloji','tyt_biy'],
  ['tarih-1','tyt_tar'],['tarih-2','ayt_tar1'],['tarih-3','ayt_tar2'],
  ['tar-1','tyt_tar'],['tar-2','ayt_tar1'],['tar-3','ayt_tar2'],['tarih','tyt_tar'],
  ['cografya-1','tyt_cog'],['cografya-2','ayt_cog1'],['cografya-3','ayt_cog2'],
  ['cog-1','tyt_cog'],['cog-2','ayt_cog1'],['cog-3','ayt_cog2'],['cografya','tyt_cog'],
  ['din kul. ve ahl. bil','tyt_din'],['din kul','tyt_din'],['din-1','tyt_din'],['din-2','ayt_din'],['din kul.','tyt_din'],
  ['felsefe (secmeli)','__atla'],['felsefe grubu','tyt_fel'],['fel-1','tyt_fel'],['fel-2','ayt_fel'],['felsefe','tyt_fel'],
  ['t.d. edebiyati','ayt_edb'],['turk dili ve edebiyati','ayt_edb'],['edebiyat','ayt_edb'],['edeb','ayt_edb'],
  ['yabanci dil','ydt'],['ingilizce','ydt'],['y. dil','ydt'],
  ['toplam','__atla'],['genel','__atla'],['puan','__atla']
].sort((a,b)=>b[0].length-a[0].length);

function kDersBul(satir){
  const b=kDersleriBul(satir);
  return b.length?b[0].kod:null;
}
/* Bir satırda BİRDEN FAZLA ders olabilir:
   "TYT Türkçe 40 31 5 4 29,75 % 74   Matematik-1 30 8 2 20 7,50 % 25"
   Hepsini yerleriyle döndürür; her ders kendi parçasındaki sayılarla çözülür. */
function kDersleriBul(satir){
  const L=norm(satir);
  const bulunan=[];
  for(const [ad,kod] of KARNE_DERS){
    let i=0;
    while((i=L.indexOf(ad,i))>=0){
      const onceki = i===0 ? ' ' : L[i-1];
      const sonraki = L[i+ad.length]||' ';
      const bas=i, son=i+ad.length;
      i=son;
      if(/[a-z0-9çğıöşü]/.test(onceki)) continue;          // kelime ortası
      if(/[a-zçğıöşü]/.test(sonraki)) continue;            // daha uzun bir adın parçası
      if(bulunan.some(x=>bas<x.son && son>x.bas)) continue; // daha uzun eşleşmeyle çakışıyor
      bulunan.push({kod, bas, son});
    }
  }
  return bulunan.sort((a,b)=>a.bas-b.bas);
}

/* Sayı dizisinden (D,Y) çöz — beyan edilen net ile doğrula.
   Kanıt gücü: SDYB-net(4) > SDY-net(3) > SDYB(2) > DY-net(1) */
function kNetCoz(nums, soru){
  const yak=(a,b)=>Math.abs(a-b)<0.02;
  let en=null;
  const koy=(d,y,g,p)=>{ if(!en||p>en.p) en={d,y,g,p}; };
  // 1) [S,D,Y,B,Net] / [S,D,Y,Net]
  for(let i=0;i+2<nums.length;i++){
    const S=nums[i], D=nums[i+1], Y=nums[i+2];
    if(!Number.isInteger(S)||!Number.isInteger(D)||!Number.isInteger(Y)) continue;
    if(S<=0||S>200||D<0||Y<0||D+Y>S) continue;
    if(soru && S!==soru) continue;          // soru sayısı biliniyorsa birebir tutmalı
    const B=nums[i+3], N=nums[i+4];
    if(Number.isInteger(B)&&B>=0&&D+Y+B===S&&yak(N,D-Y/4)) koy(D,Y,'SDYB-net',4);
    else if(yak(B,D-Y/4)) koy(D,Y,'SDY-net',3);
    else if(Number.isInteger(B)&&B>=0&&D+Y+B===S) koy(D,Y,'SDYB',2);
  }
  // 2) [D,Y,Net] — soru sayısı satırda yok. Sıfır satırları kabul edilmez.
  if(!en) for(let i=0;i+2<nums.length;i++){
    const D=nums[i], Y=nums[i+1], N=nums[i+2];
    if(!Number.isInteger(D)||!Number.isInteger(Y)||D<0||Y<0) continue;
    if(D+Y===0) continue;                   // "Türkçe 0 0 0 0" gibi başlık satırlarını ele
    if(soru && D+Y>soru) continue;
    if(yak(N,D-Y/4)) koy(D,Y,'DY-net',1);
  }
  return en;
}

/* ---------- A) SATIR TABANLI ---------- */
function karneSatirlardan(text, list){
  const out={}, kanit={}, puan={};
  const soruSay={}; list.forEach(([k,,q])=>soruSay[k]=q);
  soruSay.tyt_mat_top=40; soruSay.ayt_mat_top=40; soruSay.tyt_fen_top=20; soruSay.tyt_sos_top=20;
  text.split(/[\r\n]+/).forEach(raw=>{
    const bul=kDersleriBul(raw);
    if(!bul.length) return;
    bul.forEach((b,j)=>{
      if(b.kod==='__atla') return;
      // bu dersin parçası: kendi adından sonraki ders adına kadar
      const son = j+1<bul.length ? bul[j+1].bas : raw.length;
      const parca = raw.slice(b.son, son);
      const nums=(parca.match(/-?\d+(?:[.,]\d+)?/g)||[]).map(s=>parseFloat(s.replace(',','.')));
      if(nums.length<3) return;
      const r=kNetCoz(nums, soruSay[b.kod]);
      if(!r) return;
      const eski=puan[b.kod];
      if(eski!==undefined && eski>=r.p) return;
      out[b.kod]={d:r.d,y:r.y}; kanit[b.kod]=r.g; puan[b.kod]=r.p;
    });
  });
  return {out,kanit};
}

/* ---------- B) SÜTUN TABANLI (AKBİM, İlk Adım) ---------- */
function karneSutunlardan(text){
  const sat=text.split(/[\r\n]+/);
  const out={};
  // başlık: ders adlarını sırayla içeren satır
  let bas=-1, kodlar=null;
  for(let i=0;i<sat.length;i++){
    const L=norm(sat[i]);
    if(!/turkce/.test(L)) continue;
    const parca=sat[i].split(/\s{1,}/).filter(Boolean);
    const k=parca.map(p=>kDersBul(p));
    const dolu=k.filter(x=>x&&x!=='__atla');
    if(dolu.length>=3){ bas=i; kodlar=k; break; }
  }
  if(bas<0) return {out,kanit:{}};
  // sonraki 12 satırda DOĞRU / YANLIŞ / NET satırlarını ara
  let D=null,Y=null,N=null;
  for(let i=bas;i<Math.min(sat.length,bas+14);i++){
    const L=norm(sat[i]);
    const nums=(sat[i].match(/-?\d+(?:[.,]\d+)?/g)||[]).map(s=>parseFloat(s.replace(',','.')));
    if(/dogru/.test(L)&&!D) D=nums;
    else if(/yanlis/.test(L)&&!Y) Y=nums;
    else if(/^net\b/.test(L)&&!N) N=nums;
  }
  if(!D||!Y||!N) return {out,kanit:{}};
  const kanit={};
  const gecerli=kodlar.filter(x=>x&&x!=='__atla');
  // hizalama: ders sayısı ile sayı sayısı uyuşmalı
  const n=Math.min(gecerli.length, D.length, Y.length, N.length);
  for(let j=0;j<n;j++){
    const kod=gecerli[j];
    if(out[kod]) continue;
    if(Math.abs(N[j]-(D[j]-Y[j]/4))<0.02){ out[kod]={d:D[j],y:Y[j]}; kanit[kod]='sutun'; }
  }
  return {out,kanit};
}

/* ---------- C) SABİT SÜTUN DÜZENLERİ (İlk Adım gibi) ----------
   "S.Sayısı 40 5 5 5 5 40 7 7 6 20 20 120" satırı düzeni ele verir. */
const SUTUN_DUZEN=[
  { soru:[40,5,5,5,5,40,7,7,6,20,20,120],
    ders:['tyt_tur','tyt_tar','tyt_cog','tyt_fel','tyt_din','tyt_mat_top','tyt_fiz','tyt_kim','tyt_biy',null,null,null] },
  { soru:[40,20,40,20],
    ders:['tyt_tur',null,'tyt_mat_top',null] }
];
function karneSabitDuzen(text){
  const sat=text.split(/[\r\n]+/);
  const out={}, kanit={};
  const sayilar=s=>(s.match(/-?\d+(?:[.,]\d+)?/g)||[]).map(x=>parseFloat(x.replace(',','.')));
  let S=null,D=null,Y=null,N=null;
  for(let i=0;i<sat.length;i++){
    const L=norm(sat[i]);
    const T=L.trim(), sy=sayilar(sat[i]);
    if(sy.length<2) continue;                      // sayı içermeyen satır etiket değildir
    if(!S && /^(s\.?\s?sayisi|soru sayisi)/.test(T)) S=sy.filter(x=>Number.isInteger(x));
    else if(!D && /^dogru( cevap)?\b/.test(T)) D=sy;
    else if(!Y && /^yanlis( cevap)?\b/.test(T)) Y=sy;
    else if(!N && /^net\b/.test(T)) N=sy;
  }
  if(!S||!D||!Y||!N) return {out,kanit};
  const duzen=SUTUN_DUZEN.find(z=>z.soru.length===S.length && z.soru.every((v,j)=>v===S[j]));
  if(!duzen) return {out,kanit};
  const n=Math.min(duzen.ders.length,D.length,Y.length,N.length);
  for(let j=0;j<n;j++){
    const kod=duzen.ders[j]; if(!kod) continue;
    if(Math.abs(N[j]-(D[j]-Y[j]/4))<0.02) { out[kod]={d:D[j],y:Y[j]}; kanit[kod]='sabit sütun'; }
  }
  return {out,kanit};
}

/* ---------- D) KONU TABLOSUNDAN TOPLAM ----------
   Bazı karnelerde (AKBİM) özet tablo ders ders vermez; konu analizi tablosunun
   satırları toplanarak doğru/yanlış çıkarılır. */
function karneKonudanToplam(text, st){
  const out={}, kanit={};
  let kt=null;
  try{ kt=parseKonuTablo(text, st); }catch(e){ return {out,kanit}; }
  if(!kt) return {out,kanit};
  for(const kod in kt){
    const v=kt[kod];
    if(!v || !v.konu || !v.konu.length) continue;
    let d=0,y=0,ss=0;
    v.konu.forEach(k=>{ ss+=(k.ss||0); d+=(k.d||0); y+=(k.y||0); });
    if(!ss) continue;
    out[kod]={d,y}; kanit[kod]='konu tablosundan toplandı';
  }
  return {out,kanit};
}

/* ---------- BİRLEŞTİR ---------- */
function parseKarne(text, st){
  const list=subs(st);
  const A=karneSatirlardan(text, list);
  let out=A.out, kanit=A.kanit;
  const zayif=k=>kanit[k]==='DY-net';
  const ekle=(kaynak)=>{ for(const k in kaynak.out){
    if(out[k]===undefined || zayif(k)){ out[k]=kaynak.out[k]; kanit[k]=kaynak.kanit[k]; } } };
  if(Object.keys(out).length<10) ekle(karneSabitDuzen(text));
  if(Object.keys(out).length<10) ekle(karneSutunlardan(text));
  if(Object.keys(out).length<10) ekle(karneKonudanToplam(text, st));
  // toplam satırlarını çöz: TYT Matematik = Matematik-1 + Geometri
  if(out.tyt_mat_top){
    if(!out.tyt_mat && !out.tyt_geo){ out.tyt_mat=out.tyt_mat_top; kanit.tyt_mat=(kanit.tyt_mat_top||'')+' (geometri dahil)'; }
    else if(out.tyt_mat && !out.tyt_geo){
      const g={d:out.tyt_mat_top.d-out.tyt_mat.d, y:out.tyt_mat_top.y-out.tyt_mat.y};
      if(g.d>=0&&g.y>=0&&(g.d||g.y)){ out.tyt_geo=g; kanit.tyt_geo='toplamdan çıkarıldı'; }
    }
    delete out.tyt_mat_top;
  }
  if(out.ayt_mat_top){
    if(!out.ayt_mat && !out.ayt_geo){ out.ayt_mat=out.ayt_mat_top; kanit.ayt_mat=(kanit.ayt_mat_top||'')+' (geometri dahil)'; }
    else if(out.ayt_mat && !out.ayt_geo){
      const g={d:out.ayt_mat_top.d-out.ayt_mat.d, y:out.ayt_mat_top.y-out.ayt_mat.y};
      if(g.d>=0&&g.y>=0&&(g.d||g.y)){ out.ayt_geo=g; kanit.ayt_geo='toplamdan çıkarıldı'; }
    }
    delete out.ayt_mat_top;
  }
  delete out.tyt_fen_top; delete out.tyt_sos_top;
  delete kanit.tyt_mat_top; delete kanit.ayt_mat_top;

  const log=[];
  const isim={}; list.forEach(([k,nm])=>isim[k]=nm);
  Object.keys(out).forEach(k=>{
    const {d,y}=out[k];
    log.push(`${isim[k]||k}: ${d} doğru / ${y} yanlış → ${n1(d-y/4)} net`);
  });
  return {out, log, kanit};
}

let PENDING_AN=[];
/* karne konu adını panelin konu ağacıyla eşleştir */
function konuEsle(sk,ad){
  const L=norm(ad); let best=null,bl=0;
  (KONU[sk]||[]).forEach(([u,ks])=>{
    const nu=norm(u);
    if(nu.length>=5&&(L.includes(nu)||nu.includes(L))&&nu.length>bl){best=[u,u];bl=nu.length;}
    ks.forEach(t=>{const nt=norm(t);
      if(nt.length>=5&&(L.includes(nt)||nt.includes(L))&&nt.length>bl){best=[t,u];bl=nt.length;}});
  });
  return best||[ad,'Karne konusu (listede yok)'];
}
function applyKarne(){
  const st=cur(), txt=document.getElementById('kzText').value;
  if(!txt.trim()){alert('Karne metnini yapıştır.');return;}
  const box=document.getElementById('kzOut');

  // 1) BİRİNCİL: konu analizi tablosu — hem net hem yanlış konuları verir
  const tablo=parseKonuTablo(txt);
  const gecerli=new Set(subs(st).map(x=>x[0]));
  const out={}, log=[], uyari=[];
  PENDING_AN=[];
  for(const sk in tablo){
    if(!gecerli.has(sk)){ uyari.push(`${subName(sk)} karnede var ama öğrencinin alanında yok, atlandı.`); continue; }
    const B=tablo[sk], q=subQ(sk);
    if(B.ss!==q) uyari.push(`${subName(sk)}: karnede ${B.ss} soru görünüyor, bu derste ${q} olmalı. Kontrol et.`);
    out[sk]={d:B.d,y:B.y};
    log.push(`${subName(sk)}: ${B.d} doğru / ${B.y} yanlış → ${n1(B.d-B.y/4)} net`);
    B.konu.forEach(k=>{
      const [konu,unite]=konuEsle(sk,k.ad);
      PENDING_AN.push({sub:sk,konu,unite,y:k.y,b:k.b});
    });
  }

  // 2) YEDEK: konu tablosu yoksa eski net-tablosu ayrıştırıcısı
  let yedek=false;
  if(!Object.keys(out).length){
    const r=parseKarne(txt,st);
    Object.assign(out,r.out); log.push(...r.log);
    PENDING_AN=parseKonular(txt,st);
    yedek=true;
  }

  if(!Object.keys(out).length&&!PENDING_AN.length){
    box.innerHTML='<div class="flag bad"><span class="ic">!</span><span>Karne okunamadı. Taranmış görüntü olabilir (metin kopyalanamıyorsa öyledir) ya da düzeni tanınmadı. Netleri elle gir.</span></div>';
    return;
  }
  subs(st).forEach(([k])=>{
    const di=document.getElementById('d_'+k), yi=document.getElementById('y_'+k);
    if(!di) return;
    if(out[k]){di.value=out[k].d;yi.value=out[k].y;di.style.background='#E2F0EA';yi.style.background='#E2F0EA';}
    else {di.value='';yi.value='';di.style.background='';yi.style.background='';}
  });
  const ty=PENDING_AN.reduce((a,r)=>a+r.y,0), tb=PENDING_AN.reduce((a,r)=>a+r.b,0);
  const eslesen=PENDING_AN.filter(r=>!r.unite.startsWith('Karne konusu')).length;
  box.innerHTML=`
    <div class="flag ok"><span class="ic">✓</span><span><b>${log.length} dersin neti okundu</b>${yedek?' (net tablosundan)':' (konu analizi tablosundan)'}. Forma yazıldı.<br>${log.join('<br>')}</span></div>
    ${PENDING_AN.length?`<div class="flag ok"><span class="ic">✓</span><span><b>${PENDING_AN.length} konu okundu</b> — ${ty} yanlış, ${tb} boş. ${eslesen}'i konu listesiyle eşleşti.</span></div>`
      :`<div class="flag warn"><span class="ic">·</span><span>Konu dökümü çıkmadı. Karnede konu analizi yoksa normaldir.</span></div>`}
    ${uyari.map(u=>`<div class="flag warn"><span class="ic">!</span><span>${esc(u)}</span></div>`).join('')}
    <div class="flag warn"><span class="ic">!</span><span>Kaydetmeden önce sayıları karneyle karşılaştır. Kontrol adımı senin.</span></div>
    ${anOnizle(PENDING_AN)}`;
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ================= KONU TABLOSU AYRIŞTIRICI =================
   Yayınevi bağımsız. Karnenin konu analizi tablosundan ders netlerini ve
   yanlış/boş konularını çıkarır. Doğrulama: 5 sütunlu satırda SS=D+Y+B,
   4 sütunlu satırda D/SS≈%. AKBİM, Bilgi Sarmal, Krallar Karması ve
   İlk Adım karneleriyle test edildi: 33/33 ders. */
const DERSALIAS=[
 // [regex parçası, panel ders kodu]  — uzun olan önce denenir
 ['t.d. edebiyati','ayt_edb'],['turk dili ve edebiyati','ayt_edb'],['edebiyat','ayt_edb'],['edeb','ayt_edb'],
 ['temel matematik','tyt_mat'],['t. mat','tyt_mat'],['t.mat','tyt_mat'],
 ['matematik-1','tyt_mat'],['matematik-2','ayt_mat'],['mat-1','tyt_mat'],['mat-2','ayt_mat'],
 ['tyt matematik','tyt_mat'],['ayt matematik','ayt_mat'],
 ['tyt geometri','tyt_geo'],['ayt geometri','ayt_geo'],['geometri-1','tyt_geo'],['geometri-2','ayt_geo'],
 ['geometri','tyt_geo'],['geo-1','tyt_geo'],['geo-2','ayt_geo'],['geo','tyt_geo'],
 ['tyt turkce','tyt_tur'],['turkce','tyt_tur'],
 ['felsefe grubu','tyt_fel'],['felsefe (secmeli)','tyt_fel'],['felsefe','tyt_fel'],['fel-1','tyt_fel'],['fel-2','ayt_fel'],
 ['din kul','tyt_din'],['din-1','tyt_din'],['din-2','ayt_din'],['din','tyt_din'],
 ['tarih-1','tyt_tar'],['tarih-2','ayt_tar1'],['tarih-3','ayt_tar2'],
 ['tar-1','tyt_tar'],['tar-2','ayt_tar1'],['tar-3','ayt_tar2'],['tarih','tyt_tar'],
 ['cografya-1','tyt_cog'],['cografya-2','ayt_cog1'],['cografya-3','ayt_cog2'],
 ['cog-1','tyt_cog'],['cog-2','ayt_cog1'],['cog-3','ayt_cog2'],['cografya','tyt_cog'],
 ['fizik-1','tyt_fiz'],['fizik-2','ayt_fiz'],['fiz-1','tyt_fiz'],['fiz-2','ayt_fiz'],['fizik','tyt_fiz'],
 ['kimya-1','tyt_kim'],['kimya-2','ayt_kim'],['kim-1','tyt_kim'],['kim-2','ayt_kim'],['kimya','tyt_kim'],
 ['biyoloji-1','tyt_biy'],['biyoloji-2','ayt_biy'],['biy-1','tyt_biy'],['biy-2','ayt_biy'],['biyoloji','tyt_biy'],
 ['yabanci dil','ydt'],['ingilizce','ydt'],['din kul ve ahl bil','tyt_din'],['din kulturu ve ahlak bilgisi','tyt_din'],['din kul ve ahlbil','tyt_din'],['tyt sosyal',null],['tyt fen',null],['sosyal bil',null],['fen bil',null],['t mat','tyt_mat'],['tmat','tyt_mat'],['sosyal','tyt_tar'],['fen','tyt_fiz']
].sort((a,b)=>b[0].length-a[0].length);


const KAZANIM=/^([A-ZÇĞİÖŞÜ]\.)?\d+(\.\d+)*\.\s*/;   // 13.1.1.  T.8.3.25.5.  9.3.2.1.

function dersKodu(L){
  const t=L.replace(/\./g,'').replace(/\s+/g,' ').trim();
  for(const [a,k] of DERSALIAS){ const b=a.replace(/\./g,'').trim(); if(t===b) return k; }
  return null;
}
function dersBasligiMi(satir){
  let t=satir.trim();
  t=t.replace(/(\s+-?\d+(?:[.,]\d+)?\s*%?)+\s*$/,'').replace(/\s*%\s*\d*$/,'').trim();
  t=t.replace(/\s+(SS|S|D|Y|B%?|%)(\s+(SS|S|D|Y|B%?|%))*$/i,'').trim();
  if(!t||t.length<3) return null;
  if(/se[cç]meli/i.test(t)) return 'ATLA';
  const L=norm(t);
  if(L.split(' ').length>6) return null;
  const k=dersKodu(L);
  return k===null?null:k;
}
function konuSatiri(satir){
  let s=satir.trim().replace(KAZANIM,'');
  // yalnızca SATIR SONUNDAKİ sayı sütunlarını al; metindeki yıl/yüzyıl sayılarını yoksay
  const m=s.match(/((?:\s+-?\d+(?:[.,]\d+)?\s*%?)+)\s*$/);
  if(!m) return null;
  const nums=(m[1].match(/-?\d+(?:[.,]\d+)?/g)||[]).map(x=>parseFloat(x.replace(',','.')));
  let ad=s.slice(0,s.length-m[0].length).trim();
  if(nums.length===3){
    // bazı PDF'lerde soru sayısı metne yapışır: "...denklem1" ya da "...özkütlelerinden1faydalanılan"
    let son=null, re=/\d{1,2}/g, mm;
    while((mm=re.exec(ad))!==null){
      const on=ad[mm.index-1]||'', ar=ad[mm.index+mm[0].length]||'';
      const harf=c=>/[^\s\d]/.test(c)&&c!=='';
      if(harf(on)||harf(ar)) son=mm;
    }
    if(son){ nums.unshift(parseInt(son[0],10));
      ad=(ad.slice(0,son.index)+' '+ad.slice(son.index+son[0].length)).replace(/\s+/g,' ').trim(); }
  }
  if(nums.length<4||nums.length>5) return null;
  if(ad.length<4) return null;
  const na=norm(ad);
  if(/^(puan|soru|dogru|yanlis|bos|net|toplam|genel|kurum|ilce|sube|ogrenci|sinav|katilim|derece|cevap|konular?|ders|sonuc|s\.sayisi|basari)\b/.test(na)) return null;
  if(/(cevap anahtari|cevaplariniz|ogrenci cevabi|sira no)/.test(na)) return null;
  if(!/[a-zA-ZçğıöşüÇĞİÖŞÜ]/.test(ad)) return null;
  if(nums.length===5){
    const [SS,D,Y,B,P]=nums;
    if(![SS,D,Y,B].every(Number.isInteger)) return null;
    if(SS!==D+Y+B||SS<1||SS>60) return null;
    return {ad,ss:SS,d:D,y:Y,b:B};
  }
  const [SS,D,Y,P]=nums;
  if(![SS,D,Y].every(Number.isInteger)) return null;
  if(D+Y>SS||SS<1||SS>60) return null;
  const bek=SS?Math.round(D/SS*100):0;
  if(Math.abs(bek-P)>1.5) return null;
  return {ad,ss:SS,d:D,y:Y,b:SS-D-Y};
}

/* Satır normalleştirme: bazı PDF kopyalamalarında her sayı ayrı satıra düşer.
   Metin satırının ardından gelen salt-sayı satırlarını o satıra ekler. */
const SAYISATIR=/^[\s]*-?\d+(?:[.,]\d+)?(?:[\s%]+-?\d+(?:[.,]\d+)?)*[\s%]*$/;
function satirBirlestir(text){
  const ham=text.split(/[\r\n]+/);
  const cikti=[]; let son=-1, adet=0;
  for(let s of ham){
    if(!s.trim()) continue;
    if(SAYISATIR.test(s)){
      if(son>=0 && adet<6){ cikti[son]+=' '+s.trim(); adet++; }
      else cikti.push(s.trim());
      continue;
    }
    // metin satırı: kendi içinde sayı varsa zaten tam satırdır
    cikti.push(s.trim()); son=cikti.length-1; adet=(s.match(/-?\d+(?:[.,]\d+)?/g)||[]).length;
  }
  return cikti;
}
function parseKonuTablo(text){
  let akt=null; const bloklar=[];
  satirBirlestir(text).forEach(raw=>{
    if(!raw.trim()) return;
    const b=dersBasligiMi(raw);
    if(b==='ATLA'){ akt=null; return; }
    if(b){
      akt={key:b,ss:0,d:0,y:0,konu:[]}; bloklar.push(akt);
      const tm=raw.match(/((?:\s+-?\d+(?:[.,]\d+)?\s*%?)+)\s*$/);
      const art=tm?konuSatiri('Adı okunamayan konu'+tm[1]):null;
      if(art&&art.ss>0&&art.ss<=5){ akt.ss+=art.ss; akt.d+=art.d; akt.y+=art.y;
        if(art.y||art.b) akt.konu.push({ad:'(adı okunamayan konu)',y:art.y,b:art.b}); }
      return;
    }
    const k=konuSatiri(raw);
    if(!k||!akt) return;
    akt.ss+=k.ss; akt.d+=k.d; akt.y+=k.y;
    if(k.y||k.b) akt.konu.push({ad:k.ad,y:k.y,b:k.b});
  });
  const dolu={}; bloklar.forEach(b=>{ if(b.d||b.y) dolu[b.key]=true; });
  const blok={};
  bloklar.forEach(b=>{
    if(!b.ss) return;
    if(!b.d && !b.y && dolu[b.key]) return;
    const B=blok[b.key]=blok[b.key]||{ss:0,d:0,y:0,konu:[]};
    B.ss+=b.ss; B.d+=b.d; B.y+=b.y; B.konu.push(...b.konu);
  });
  for(const k in blok) if(!blok[k].ss) delete blok[k];
  return blok;
}




/* --- eski katman: serbest konu listesi --- */
function dersBul(L,sec,list){
  let hit=null,hl=0;
  list.forEach(([k,nm,q])=>{
    const isT=k.startsWith('tyt_');
    if(sec==='TYT'&&!isT) return;
    if(sec==='AYT'&&isT) return;
    (ALIAS[k]||[]).forEach(a=>{ if(L.includes(a)&&a.length>hl){hit=k;hl=a.length;} });
  });
  return hit;
}
function konuCoz(nums,mod){
  // döner: {y,b}  (yanlış, boş adetleri)
  if(nums.length>=4){
    for(let i=0;i<nums.length-3;i++){
      const [a,b,c,d]=nums.slice(i,i+4);
      if([a,b,c,d].every(Number.isInteger)&&a===b+c+d&&a>0&&a<=60) return {y:c,b:d};
    }
  }
  if(nums.length===3&&nums.every(Number.isInteger)) return {y:nums[1],b:nums[2]};
  if(nums.length===2&&nums.every(Number.isInteger)) return mod==='b'?{y:0,b:nums[1]}:{y:nums[1],b:0};
  if(nums.length===1&&Number.isInteger(nums[0])&&nums[0]>0&&nums[0]<=40)
    return mod==='b'?{y:0,b:nums[0]}:{y:nums[0],b:0};
  return mod==='b'?{y:0,b:1}:{y:1,b:0};
}
function parseKonular(text,st){
  const list=subs(st), bulunan=[]; 
  let sec=null, ders=null, mod='y';
  // ders başına havuz: hem konu adları hem ünite adları
  const havuz={};
  list.forEach(([k])=>{
    const p=[];
    (KONU[k]||[]).forEach(([u,ks])=>{
      p.push([norm(u),u,u]);              // karneler çoğunlukla ünite adı yazar
      ks.forEach(t=>p.push([norm(t),t,u]));
    });
    havuz[k]=p;
  });

  text.split(/[\r\n]+/).forEach(raw=>{
    const L=norm(raw); if(L.length<3) return;
    if(/\bayt\b/.test(L)) sec='AYT'; else if(/\btyt\b/.test(L)) sec='TYT';
    if(/\bbos\b|bos birak|bos kal/.test(L)) mod='b';
    else if(/yanlis/.test(L)) mod='y';
    const d=dersBul(L,sec,list); if(d) ders=d;
    if(!ders) return;

    const nums=(raw.match(/-?\d+(?:[.,]\d+)?/g)||[]).map(s=>parseFloat(s.replace(',','.')));
    if(nums.length>5) return;                                     // net tablosu satırı
    if(nums.length>=4&&nums.some(v=>!Number.isInteger(v))) return; // ondalık net içeren özet satırı

    let best=null,bl=0;
    (havuz[ders]||[]).forEach(([nk,orj,un])=>{
      if(nk.length<5) return;
      if((L.includes(nk)||(nk.length>12&&nk.includes(L)&&L.length>10))&&nk.length>bl){best=[orj,un];bl=nk.length;}
    });
    if(!best) return;
    const c=konuCoz(nums,mod);
    if(!c.y&&!c.b) return;
    bulunan.push({sub:ders,konu:best[0],unite:best[1],y:c.y,b:c.b});
  });
  // aynı konu birden çok satırda geçtiyse topla
  const agg={};
  bulunan.forEach(x=>{
    const k=x.sub+'||'+x.konu;
    const a=agg[k]=agg[k]||{sub:x.sub,konu:x.konu,unite:x.unite,y:0,b:0};
    a.y+=x.y; a.b+=x.b;
  });
  return Object.values(agg);
}
function anOnizle(rows){
  if(!rows.length) return '';
  const g={};
  rows.forEach(r=>{ (g[r.sub]=g[r.sub]||{})[r.unite]=((g[r.sub]||{})[r.unite]||[]); g[r.sub][r.unite].push(r); });
  return `<div class="card" style="margin-top:14px"><h2>Karneden çıkarılan yanlış/boş konular — ${rows.length} konu</h2><div class="body" style="padding:0">

      <table><thead><tr><th style="width:34%">Ünite</th><th>Konu</th><th class="num">Yanlış</th><th class="num">Boş</th></tr></thead><tbody>
      ${Object.keys(g[sk]).map(u=>g[sk][u].map((r,j)=>`<tr>
        <td style="color:var(--ink-3);font-size:12px">${j===0?esc(u):''}</td><td><b>${esc(r.konu)}</b></td>
        <td class="num" style="color:${r.y?'var(--bad)':'var(--ink-3)'};font-weight:${r.y?'650':'400'}">${r.y||'·'}</td>
        <td class="num" style="color:${r.b?'var(--warn)':'var(--ink-3)'};font-weight:${r.b?'650':'400'}">${r.b||'·'}</td></tr>`).join('')).join('')}
      </tbody></table></div>`;
  }).join('')}
  </div><div class="body" style="border-top:1px solid var(--line-soft)">
    <div class="hint">Bu liste, aşağıdaki <b>Denemeyi kaydet</b> butonuna bastığında denemeye iliştirilir. Yanlışsa <b>Konuları at</b> ile temizle, elle girersin.</div>
    <button class="btn ghost mini" style="margin-top:8px" onclick="PENDING_AN=[];render()">Konuları at</button>
  </div></div>`;
}

/* ================= KONU SÜRELERİ =================
   Konu başına süre veren yayınlanmış bir kaynak yok; literatür ders/hafta düzeyinde
   toplam bütçe veriyor (yoğun hazırlıkta ~800 saat, haftada 30-44 saat).
   Buradaki değerler o bütçeden geriye türetildi ve konu sayısına bölündü:
   SAY ~787 sa, EA ~669 sa, SÖZ ~613 sa (deneme/tekrar hariç).
   İçine konu anlatımı VE soru çözümü birlikte dahildir. Hepsi elle düzenlenebilir. */
const SURE_VAR={ tyt_geo:120, ayt_geo:150,tyt_mat:150,ayt_mat:180,tyt_fiz:120,ayt_fiz:150,tyt_kim:100,ayt_kim:130,
  tyt_biy:100,ayt_biy:120,tyt_tur:75,ayt_edb:90,tyt_tar:50,ayt_tar1:60,ayt_tar2:60,
  tyt_cog:55,ayt_cog1:65,ayt_cog2:65,tyt_fel:45,ayt_fel:55,tyt_din:35,ayt_din:40,ydt:80};
/* bilinen ağır konular ×1,5 — kümülatif ya da işlem yoğun oldukları için */
const AGIR=['problemler','turev','integral','limit','trigonometri','logaritma','polinom',
 'carpanlara','permutasyon','kombinasyon','olasilik','2.dereceden','ikinci dereceden','ucgenler',
 'analitik','kati cisimler','donusum','elektrik','manyetizma','optik','dalga','modern fizik',
 'kuvvet ve hareket','cembersel','harmonik','momentum','organik','karbon','mol kavrami',
 'kimyasal hesap','denge','gazlar','cozunurluk','genden proteine','kalitim','fotosentez',
 'solunum','sinir sistemi','insan fizyolojisi','hucre bolunmeleri','paragraf','divan'];
function sureOf(sk,konu){
  const o=(DB.sureler||{})[sk]||{};
  if(o[konu]!==undefined) return o[konu];
  const n=norm(konu), taban=SURE_VAR[sk]||90;
  return AGIR.some(a=>n.includes(a))?Math.round(taban*1.5/15)*15:taban;
}
function setSure(sk,konu,dk){
  DB.sureler=DB.sureler||{}; DB.sureler[sk]=DB.sureler[sk]||{};
  if(dk===''||dk===null) delete DB.sureler[sk][konu]; else DB.sureler[sk][konu]=+dk;
  save();
}
/* açık (bitmemiş) konuların toplam süresi, dakika */
function kalanSure(st,sk){
  const m=st.topics[sk]||{}; let dk=0,ad=0;
  (KONU[sk]||[]).forEach(([,ks])=>ks.forEach(t=>{
    const d=m[t]||0;
    if(d===2) return;                       // bitti
    const carp=d===1?0.5:d===3?0.7:1;       // işleniyor yarım, eksik kısmi tekrar
    dk+=sureOf(sk,t)*carp; ad++;
  }));
  return {dk,ad};
}
function haftaKalan(st){
  if(!st.sinavTarihi) return null;
  const d=(new Date(st.sinavTarihi)-new Date())/86400000;
  return d>0?Math.floor(d/7):0;
}

/* ================= DEVREDEN ÖDEVLER =================
   Geçmiş haftalardan kalan, henüz "Yapıldı" olmayan konu ödevleri.
   Rutinler devretmez (haftalık tekrar eden iş). */
function haftaFarki(ds){
  const a=new Date(weekKey(ds)+'T00:00'), b=new Date(weekKey(today())+'T00:00');

}

}
function devredenKart(st){

const RUTIN_VAR=[{ad:'Paragraf',sub:'tyt_tur',konu:'',adet:100,dks:1.5},{ad:'Problem',sub:'tyt_mat',konu:'',adet:100,dks:2}];
function rutinler(){ const r=DB.rutin||(DB.rutin=RUTIN_VAR.map(x=>({...x}))); r.forEach(x=>{if(x.dks===undefined)x.dks=1.5;}); return r; }
function rutinVar(st,wk){ return st.tasks.filter(t=>t.rutin&&weekKey(t.date)===wk); }

  });

  if(!n) alert('Bu haftanın rutini zaten eklenmiş.');

/* haftalık hedef çalışma süresi (dakika): rutin + konu ödevleri */
function haftaSure(st,wk){
  let rut=0,konu=0;
  st.tasks.filter(t=>weekKey(t.date)===wk).forEach(t=>{
    if(t.rutin) rut+=(t.q||0)*(t.dks||1.5);
    else if(t.konu) konu+=sureOf(t.sub,t.konu);
  });
  return {rut,konu,top:rut+konu};
}
function sa(dk){const h=Math.floor(dk/60),m=Math.round(dk%60);return h?`${h} sa${m?' '+m+' dk':''}`:`${m} dk`;}
function rutinYap(id,v){

function rutinDuzenle(i,alan,v){

/* ================= YÖK ATLAS VERİSİ =================

const LESS={1:'ayt_biy',2:'ayt_cog1',3:'ayt_cog2',4:'ayt_din',5:'ayt_fel',6:'ayt_fiz',7:'ayt_kim',

function atlasAdaylari(){

           'atlas-1.json','atlas_1.json','data/atlas.json'];

async function atlasYukle(){
  if(ATLAS) return true;
  ATLASDURUM='Veri aranıyor...'; render();
  const d=await atlasDepodan();
  if(d&&d.length){ ATLAS=d; ATLASDURUM=''; render(); return true; }
  const denenen=[];
  for(const url of atlasAdaylari()){
    const kisa=url.replace(location.origin,'');
    ATLASDURUM='Aranıyor: '+kisa; render();
    try{
      // no-store: tarayıcının önbelleğe aldığı eski 404 cevabını kullanmasın
      const r=await fetch(url+'?v='+Date.now(),{cache:'no-store'});
      if(!r.ok){ denenen.push(kisa+' → '+r.status); continue; }
      const js=await r.text();
      const pp=JSON.parse(js);
      if(!Array.isArray(pp)||!pp.length){ denenen.push(kisa+' → içerik uygun değil'); continue; }
      ATLAS=pp; await atlasSakla(js); ATLASDURUM=''; render();
      alert(pp.length.toLocaleString('tr-TR')+' program yüklendi.\n\nBir daha yüklemene gerek yok, tarayıcı sakladı.');
      return true;
    }catch(e){ denenen.push(kisa+' → '+e.message); }
  }
  ATLAS=null;
  ATLASDURUM='OTOMATIK|'+denenen.slice(0,5).join('  ·  ');
  render(); return false;
}

    try{

      if(!Array.isArray(d)||!d.length||!Array.isArray(d[0])) throw new Error('Bu dosya atlas.json değil');
      ATLAS=d; await atlasSakla(r.result); ATLASDURUM=''; render();

function atlasAra(q){
  ATLASARA=q;
  if(!ATLAS||q.trim().length<3){ATLASSON=[];render();return;}
  const st=cur(), pt=({SAY:'SAY',EA:'EA',SOZ:'SÖZ',DIL:'DİL'})[st.track];
  const kel=norm(q).split(' ').filter(Boolean);
  const bul=[];
  for(const r of ATLAS){

    const metin=norm(r[1]+' '+r[2]+' '+r[4]);
    if(!kel.every(k=>metin.includes(k))) continue;

function atlasSec(kod){
  const st=cur(), r=ATLAS.find(x=>x[0]===kod); if(!r) return;
  st.dept=r[1]+' — '+r[2]+(r[4]&&r[4]!=='Ücretsiz'?' ('+r[4]+')':'');
  st.tabanPuan=r[8]!=null?String(r[8]).replace('.',','):'';
  st.tabanSira=r[9]!=null?r[9].toLocaleString('tr-TR'):'';
  st.tabanYil=String(r[5]);
  st.kontenjan=r[6]!=null?r[6]:''; st.yerlesen=r[7]!=null?r[7]:''; st.ortObp=r[10]!=null?r[10]:'';
  if(!st.score&&r[8]!=null) st.score=String(Math.ceil(r[8]));
  if(!st.rank&&r[9]!=null) st.rank=r[9].toLocaleString('tr-TR');
  // ders bazlı net ortalamaları -> hedef netler
  const n=r[11]||{}; let yaz=0;
  const gecerli=new Set(subs(st).map(x=>x[0]));
  for(const id in n){
    const v=n[id];
    if(id==='12'){ for(const k in FEN) if(gecerli.has(k)){st.refNets[k]=Math.round(v*FEN[k]/20*100)/100;yaz++;} }
    else if(id==='14'){ for(const k in SOS) if(gecerli.has(k)){st.refNets[k]=Math.round(v*SOS[k]/20*100)/100;yaz++;} }
    else { const k=LESS[id]; if(k&&gecerli.has(k)){st.refNets[k]=v;yaz++;} }
  }
  ATLASSON=[]; ATLASARA=''; save(); render();
  alert(`${r[2]} seçildi.\n\nTaban puan: ${r[8]??'—'}\nBaşarı sırası: ${r[9]!=null?r[9].toLocaleString('tr-TR'):'—'}\nKontenjan: ${r[6]??'—'} · Yerleşen: ${r[7]??'—'}\nOrtalama OBP: ${r[10]??'—'}\nVeri yılı: ${r[5]}\n\n${yaz} ders için hedef net dolduruldu.`);
}

const SUNUCU = (window.SUNUCU_AYAR && window.SUNUCU_AYAR.key)

function sbYukle(){

  // gömülü sunucu bilgisi varsa her zaman o geçerlidir

/* ---------- düşük seviye çağrı ---------- */
async function sbCagri(yol, secenek){
  secenek = secenek || {};
  var bas = {
    'apikey': SB.key,
    'Authorization': 'Bearer ' + (SB.tok || SB.key),
    'Content-Type': 'application/json'
  };
  if(secenek.basliklar) for(var k in secenek.basliklar) bas[k]=secenek.basliklar[k];
  var cevap = await fetch(SB.url.replace(/\/+$/,'') + yol, {
    method: secenek.method || 'GET',
    headers: bas,
    body: secenek.body ? JSON.stringify(secenek.body) : undefined
  });
  var metin = await cevap.text();
  var veri = null;
  try{ veri = metin ? JSON.parse(metin) : null; }catch(e){ veri = metin; }
  if(!cevap.ok){
    var m = (veri && (veri.message || veri.error_description || veri.error || veri.msg)) || ('HTTP '+cevap.status);
    var h = new Error(m); h.kod = cevap.status; h.govde = veri; throw h;
  }
  return veri;
}

async function sbKayit(mail, sifre, ad){

    body:{ email:mail, password:sifre, data:{ ad:ad||'', rol:'koc',
      /* Onay kanıtı: hangi metin sürümü, ne zaman kabul edildi.

      kvkk_surum: KVKK_SURUM, kvkk_onay_tarihi: new Date().toISOString(),
      kvkk_beyan: 'Kullanici, ogrenci ve 18 yas alti icin veli acik rizasini aldigini beyan etti.' } } });
  if(r && r.access_token){ sbOturumKur(r); return { giris:true }; }
  return { giris:false, dogrulama:true };   // e-posta onayı bekleniyor
}
async function sbGiris(mail, sifre){
  var r = await sbCagri('/auth/v1/token?grant_type=password', { method:'POST',
    body:{ email:mail, password:sifre } });
  sbOturumKur(r);
}
function sbOturumKur(r){
  SB.tok = r.access_token || '';
  SB.ref = r.refresh_token || '';
  SB.uid = (r.user && r.user.id) || '';
  SB.mail= (r.user && r.user.email) || '';
  sbSakla();
}
async function sbTazele(){
  if(!SB.ref) throw new Error('Oturum yok');
  var r = await sbCagri('/auth/v1/token?grant_type=refresh_token', { method:'POST',
    body:{ refresh_token: SB.ref } });
  sbOturumKur(r);
}
function sbCikis(){
  SB.tok=''; SB.ref=''; SB.uid=''; SB.mail=''; sbSakla();
}
/* jeton süresi dolmuşsa bir kez tazeleyip yeniden dener */
async function sbGuvenli(fn){
  try{ return await fn(); }
  catch(e){
    if(e.kod===401 && SB.ref){ await sbTazele(); return await fn(); }
    throw e;
  }
}

      basliklar:{ 'Prefer':'resolution=merge-duplicates,return=representation' } });
  });
}

/* ================= SIKIŞTIRMA =================
   LZW (12 bit). WhatsApp uzun linkleri sonuna kadar tıklanabilir yapmıyor;
   paket ve rapor kodları bu yüzden sıkıştırılıp kısaltılır. */
/* LZW — sabit 12 bit kod, sözlük dolunca sıfırlanır. Senkron, kütüphanesiz. */
var LZW_MAX=4096;
function _enc(s){
  var d={}, next=256, w='', codes=[], i;
  for(i=0;i<256;i++) d[String.fromCharCode(i)]=i;
  for(i=0;i<s.length;i++){
    var c=s[i], wc=w+c;
    if(d[wc]!==undefined){ w=wc; }
    else{
      codes.push(d[w]);
      if(next<LZW_MAX){ d[wc]=next++; }
      else{ d={}; for(var j=0;j<256;j++) d[String.fromCharCode(j)]=j; next=256; }
      w=c;
    }
  }
  if(w!=='') codes.push(d[w]);
  return codes;
}
function _dec(codes){
  var d=[], next=256, i;
  for(i=0;i<256;i++) d[i]=String.fromCharCode(i);
  var w=d[codes[0]], out=w;
  for(i=1;i<codes.length;i++){
    var k=codes[i], entry = d[k]!==undefined ? d[k] : w+w.charAt(0);
    out+=entry;
    if(next<LZW_MAX){ d[next++]=w+entry.charAt(0); }
    else{ d=[]; for(var j=0;j<256;j++) d[j]=String.fromCharCode(j); next=256; }
    w=entry;
  }
  return out;
}
/* 12 bitlik kodları bayta paketle: 2 kod = 3 bayt */
function _pack(codes){
  var n=codes.length, b=new Uint8Array(3+Math.ceil(n*3/2));
  b[0]=(n>>16)&255; b[1]=(n>>8)&255; b[2]=n&255;
  var p=3;
  for(var i=0;i<n;i+=2){
    var a=codes[i], c=(i+1<n)?codes[i+1]:0;
    b[p++]=a>>4; b[p++]=((a&15)<<4)|(c>>8); b[p++]=c&255;
  }
  return b;
}
function _unpack(b){
  var n=(b[0]<<16)|(b[1]<<8)|b[2], codes=[], p=3;
  while(codes.length<n){
    var x=b[p++], y=b[p++], z=b[p++];
    codes.push((x<<4)|(y>>4));
    if(codes.length<n) codes.push(((y&15)<<8)|z);
  }
  return codes;
}
function sikistir(str){
  var utf=unescape(encodeURIComponent(str));
  var b=_pack(_enc(utf)), bin='';
  for(var i=0;i<b.length;i+=8192) bin+=String.fromCharCode.apply(null,b.subarray(i,i+8192));
  return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function ac(b64){
  var s=b64.replace(/-/g,'+').replace(/_/g,'/');
  var bin=atob(s+'==='.slice((s.length+3)%4));
  var b=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) b[i]=bin.charCodeAt(i);
  return decodeURIComponent(escape(_dec(_unpack(b))));
}


function b64e(s){const b=new TextEncoder().encode(s);let o='';for(let i=0;i<b.length;i+=8192)o+=String.fromCharCode(...b.subarray(i,i+8192));return btoa(o);}
function b64d(s){return new TextDecoder().decode(Uint8Array.from(atob(s),c=>c.charCodeAt(0)));}
function hashKod(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return (h>>>0).toString(36);}
function paketIcerik(st){
  const wk=weekKey(today());
  const t=st.tasks.filter(x=>weekKey(x.date)>=wk || (!x.rutin&&x.konu&&x.s!==1&&weekKey(x.date)<wk));
  return {odev:t.length, rutin:t.filter(x=>x.rutin).length, konu:t.filter(x=>!x.rutin).length,
    deneme:Math.min(12,(st.exams||[]).length),

function konuIndeksle(topics){
  // Ardışık konu numaralarını aralık olarak yazar: "0-40,45,47" gibi.
  const out={};
  for(const sk in topics){
    const duz=(KONU[sk]||[]).flatMap(u=>u[1]);
    const grup={}, adli=[];
    for(const t in topics[sk]){
      const d=topics[sk][t], i=duz.indexOf(t);
      if(i>=0){ (grup[d]=grup[d]||[]).push(i); } else adli.push([t,d]);
    }
    const par={};
    for(const d in grup){
      const a=grup[d].sort((x,y)=>x-y), pr=[];
      let bas=a[0], on=a[0];
      for(let j=1;j<=a.length;j++){
        if(a[j]===on+1){ on=a[j]; continue; }
        pr.push(bas===on?String(bas):bas+'-'+on);
        bas=a[j]; on=a[j];
      }
      par[d]=pr.join(',');
    }
    if(Object.keys(par).length||adli.length) out[sk]={r:par,a:adli};
  }
  return out;
}
function konuAcik(k){
  const topics={};
  for(const sk in (k||{})){
    const duz=(KONU[sk]||[]).flatMap(u=>u[1]); topics[sk]={};
    const blok=k[sk];
    if(Array.isArray(blok)){ // eski biçim
      blok.forEach(([i,d])=>{ const ad=typeof i==='number'?duz[i]:i; if(ad!==undefined) topics[sk][ad]=d; });
      continue;
    }
    for(const d in (blok.r||{})){
      String(blok.r[d]).split(',').filter(Boolean).forEach(par=>{
        const [a,b]=par.split('-').map(Number);
        for(let i=a;i<=(isNaN(b)?a:b);i++){ if(duz[i]!==undefined) topics[sk][duz[i]]=+d; }
      });
    }
    (blok.a||[]).forEach(([ad,d])=>topics[sk][ad]=d);
  }
  return topics;
}
/* Paket: öğrencinin tüm kaydı. Konu adları indeks, denemeler net olarak sıkıştırılır.
   Link 7000 karakteri aşarsa geçmiş kademeli kısaltılır — link her zaman açılır. */
function paketUret(st,zorla,limitEx,limitGor){
  const wk=weekKey(today());
  const eX = limitEx===undefined?12:limitEx;
  const eG = limitGor===undefined?30:limitGor;
  const denemeler=(eX>0?[...st.exams].sort((a,b)=>a.date.localeCompare(b.date)).slice(-eX):[])
    .map(e=>{const n={}; for(const k in e.n) n[k]=Math.round(net(e.n[k].d||0,e.n[k].y||0)*100)/100;
      return [e.date, (e.name||'').slice(0,26), e.tur||'tyt', n];});
  const gorevlerHam=st.tasks.filter(t=>!t.rutin&&t.konu&&t.s===1&&weekKey(t.date)<wk)
    .sort((a,b)=>a.date.localeCompare(b.date));
  const gorevler2 = eG>0 ? gorevlerHam.slice(-eG) : [];
  const gorevler = gorevler2
    .map(t=>{const duz=(KONU[t.sub]||[]).flatMap(u=>u[1]); const i=duz.indexOf(t.konu);
      return [t.date, t.sub, i>=0?i:t.konu, t.yap||0, t.q||0];});
  const p={v:2,id:st.id,ad:st.name,track:st.track,grade:st.grade,dept:st.dept,rank:st.rank,
    sinav:st.sinavTarihi||'',tel:st.tel||'',kocTel:DB.kocTel||'',url:tabanAdres(),kopru:kopruKimlik(),
    k:konuIndeksle(st.topics||{}), sureler:DB.sureler||{}, zorla:!!zorla,
    score:st.score||'',refNets:st.refNets||{},tabanPuan:st.tabanPuan||'',tabanSira:st.tabanSira||'',
    tabanYil:st.tabanYil||'',hsaat:st.haftalikSaat||'',dip:st.dip||'',obp:st.obp||'',yerlesti:!!st.yerlesti,
    e:denemeler, g:gorevler,
    tasks:st.tasks.filter(t=>weekKey(t.date)>=wk || (!t.rutin&&t.konu&&t.s!==1&&weekKey(t.date)<wk))
      .map(t=>({id:t.id,date:t.date,sub:t.sub,konu:t.konu,q:t.q||0,txt:t.txt||'',rutin:!!t.rutin,dks:t.dks,yap:t.yap||0,s:t.s}))};
  const js=JSON.stringify(p);
  const sik='KOCPAKET2:'+sikistir(js), duz='KOCPAKET1:'+b64e(js);
  const kod = sik.length<duz.length ? sik : duz;
  const link = tabanAdres() ? tabanAdres()+'ogrenci-sunucu.html#'+encodeURIComponent(kod) : kod;
  // WhatsApp uzun linkleri sonuna kadar tıklanabilir yapmıyor: 2000 karakteri aşarsa geçmişi kısalt
  if(link.length>2000){
    if(eG>0) return paketUret(st,zorla,eX,Math.max(0,eG-10));
    if(eX>0) return paketUret(st,zorla,Math.max(0,eX-4),0);
  }
  return link;
}

/* Kısa (v2) rapor biçimini eski biçime çevirir.
   v2'de konu adları sıra numarası, alan adları tek harf. */
function raporNormalle(p){
  if(!p||p.v!==2) return p;
  const topics=konuAcik(p.k||{});

    tasks:(p.t||[]).map(a=>({i:a[0],s:a[1],y:a[2]})),

    hedef:p.h||null, not:p.n||''};
}

/* raporun hangi öğrenciye ait olduğunu bul: önce kimlik, sonra isim */
function raporCoz(txt){
  let m=txt.match(/KOCRAPOR2:([A-Za-z0-9_\-]+)/);
  if(m) return JSON.parse(ac(m[1]));
  m=txt.match(/KOCRAPOR1:([A-Za-z0-9+/=]+)/);
  if(m) return JSON.parse(b64d(m[1]));
  return null;
}
function raporVarMi(txt){ return /KOCRAPOR[12]:/.test(txt)||/KOCM:[A-Za-z0-9_\-]+\.[A-Za-z0-9]+/.test(txt); }
function raporSahibi(txt){
  let p; try{ p=raporCoz(txt); if(!p) return {}; p=raporNormalle(p); }catch(e){ return {}; }
  let hedef=DB.students.find(s=>s.id===p.id);
  if(!hedef && p.ad) hedef=DB.students.find(s=>norm(s.name)===norm(p.ad));
  return {id:p.id, ad:p.ad, hedef};
}

/* yapılandırılmış rapor kodunu oku */
function raporKodOku(st,txt){
  const m=txt.match(/KOCRAPOR[12]:([A-Za-z0-9+/=_\-]+)/);
  if(!m) return null;
  const hk=hashKod(m[1]);
  const onceki=(st.uygulanan||[]).find(x=>x.h===hk);
  if(onceki&&!confirm(`Bu rapor daha önce işlendi (${onceki.t}). Aynı kodu yeniden uygulamak bir şey değiştirmez ama yine de bakılsın mı?`)) return null;
  let p; try{ p=raporNormalle(raporCoz(txt)); }catch(e){ alert('Rapor kodu bozuk ya da eksik kopyalanmış. Mesajın tamamını seçip yapıştır.'); return null; }
  if(!p){ alert('Rapor kodu okunamadı.'); return null; }
  if(p.id&&p.id!==st.id&&norm(p.ad||'')!==norm(st.name)&&
     !confirm(`Bu rapor "${p.ad||'?'}" adına gönderilmiş, seçili öğrenci ise ${st.name}.\n\nYine de ${st.name}'e uygulansın mı?`)) return null;
  const P={rutin:[],odev:[],konu:[],deneme:[],ekstra:[],hedef:null,not:p.not||'',log:[],kod:true,h:hk};
  (p.tasks||[]).forEach(r=>{
    const t=st.tasks.find(x=>x.id===r.i); if(!t) return;
    const geri = (t.s===1&&r.s!==1) || ((r.y||0) < (t.yap||0));
    if(t.rutin){ if((t.yap||0)!==r.y||t.s!==r.s){
      P.rutin.push({id:t.id,yap:r.y,ad:t.konu,hedef:t.q,geri});
      P.log.push(`${geri?'⚠ ':''}Rutin — ${t.konu}: ${r.y}/${t.q} soru${geri?`  (panelde ${t.yap||0} yazıyordu)`:''}`);} }
    else if(t.s!==r.s||(t.yap||0)!==(r.y||0)){
      P.odev.push({id:t.id,s:r.s,yap:r.y||0,ad:t.konu,geri});
      P.log.push(`${geri?'⚠ ':''}Ödev — ${subName(t.sub)} / ${t.konu}: ${SL[r.s]}${r.y?` · ${r.y} soru`:''}${geri?`  (panelde ${SL[t.s]}${t.yap?` · ${t.yap} soru`:''} yazıyordu)`:''}`); }
  });
  for(const sk in (p.topics||{})) for(const kk in p.topics[sk]){
    const yeni=p.topics[sk][kk], eski=(st.topics[sk]||{})[kk]||0;
    if(yeni!==eski){
      const geri = (yeni===0 && eski>0);
      P.konu.push({sub:sk,konu:kk,durum:yeni,geri});
      P.log.push(`${geri?'⚠ ':''}Konu — ${subName(sk)} / ${kk}: ${['Görülmedi','İşleniyor','Bitti','Eksik'][yeni]}${geri?`  (panelde ${['Görülmedi','İşleniyor','Bitti','Eksik'][eski]} yazıyordu)`:''}`); }
  }
  // öğrencinin kendi eklediği çalışmalar
  (p.ekstra||[]).forEach(x=>{
    if(st.tasks.some(t=>t.ekstraId&&t.ekstraId===x.id)) return;
    P.ekstra=P.ekstra||[]; P.ekstra.push(x);
    P.log.push(`Kendi çalışması — ${subName(x.sub)} / ${x.konu}${x.q?` · ${x.q} soru`:''} · ${SL[x.s]||'Yapıldı'}`);
  });
  // öğrencinin hedef değişikliği
  if(p.hedef){
    const H=p.hedef, fark=[];
    if(H.dept&&H.dept!==st.dept) fark.push(`bölüm: ${H.dept}`);
    if(H.score&&String(H.score)!==String(st.score)) fark.push(`hedef puan: ${H.score}`);
    if(H.rank&&String(H.rank)!==String(st.rank)) fark.push(`hedef sıralama: ${H.rank}`);
    let netAdet=0;
    for(const k in (H.refNets||{})) if(+H.refNets[k]!==+(st.refNets[k]||0)) netAdet++;
    if(netAdet) fark.push(`${netAdet} derste hedef net`);
    if(fark.length){ P.hedef=H; P.log.push(`Hedef değişikliği — ${fark.join(' · ')}`); }
  }
  (p.exams||[]).forEach(e=>{
    if(st.exams.some(x=>x.date===e.date&&(x.name||'')===(e.name||''))) return;
    P.deneme.push(e); let t=0; for(const s in e.n)t+=net(e.n[s].d,e.n[s].y);
    P.log.push(`Deneme — ${e.date} ${e.name||''}: ${n1(t)} net`);
  });
  if(p.not) P.log.push(`Öğrenci notu: "${p.not.slice(0,120)}"`);
  return P;
}

let EPOSTAZAMAN=null;
function epostaKontrol(mail){
  clearTimeout(EPOSTAZAMAN);
  const m=(mail||'').trim();
  if(!m || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(m)){ return; }
  EPOSTAZAMAN=setTimeout(async()=>{
    if(!YENIOGR) return;
    try{
      const r=await sbGuvenli(()=>sbCagri('/rest/v1/rpc/eposta_musait',{method:'POST',body:{mail:m}}));
      if(!YENIOGR) return;
      YENIOGR.epostaDurum = r && r.musait ? 'musait'
        : (r && r.ogrencide ? 'kendi' : 'dolu');
      render();
    }catch(e){}
  },700);
}

/* ================= HESAP ================= */
function avgNets(st,k=3){
  const out={},cnt={};
  const ex=[...st.exams].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,k);
  ex.forEach(e=>{for(const s in e.n){const v=net(e.n[s].d||0,e.n[s].y||0);out[s]=(out[s]||0)+v;cnt[s]=(cnt[s]||0)+1;}});
  for(const s in out) out[s]=out[s]/cnt[s];
  return {nets:out,count:ex.length};
}
function totalNet(e){let t=0;for(const s in e.n)t+=net(e.n[s].d||0,e.n[s].y||0);return t;}
function weekStats(st,wk){
  const t=st.tasks.filter(x=>weekKey(x.date)===wk);
  const done=t.filter(x=>x.s===1).length, part=t.filter(x=>x.s===2).length;
  const rate=t.length?Math.round((done+part*0.5)/t.length*100):null;
  return {total:t.length,done,part,rate};
}
function lastWeeks(st,n=6){
  const ks=[...new Set(st.tasks.map(t=>weekKey(t.date)))].sort().reverse().slice(0,n);
  return ks.map(k=>({wk:k,...weekStats(st,k)}));
}
function weakTopics(st){
  const out=[];
  for(const sk in st.topics) for(const tn in st.topics[sk]) if(st.topics[sk][tn]===3) out.push({s:sk,t:tn});
  return out;
}
function topicStats(st,sk){
  const list=T[sk]||[], m=st.topics[sk]||{};
  let done=0,prog=0,weak=0;
  list.forEach(t=>{const v=m[t]||0; if(v===2)done++; if(v===1)prog++; if(v===3)weak++;});
  return {total:list.length,done,prog,weak};
}

/* ---------- DURUM ---------- */
function vDurum(st){
  const a=avgNets(st,3);
  const list=subs(st);
  let curTot=0,tgtTot=0,hasT=false;
  list.forEach(([k])=>{curTot+=(a.nets[k]||0); const t=+st.refNets[k]; if(t){tgtTot+=t;hasT=true;}});

  // hedef farkı çubukları

  const ex=[...st.exams].filter(e=>e.tur!=='brans').sort((a,b)=>a.date.localeCompare(b.date));

  // haftalar
  const ws=lastWeeks(st,6);
  const lastW=ws[0];

  // uyarılar
  const F=[];
  if(ws.length>=2&&ws[0].rate!==null&&ws[1].rate!==null&&ws[0].rate<50&&ws[1].rate<50)
    F.push(['bad','!','Ödev uyumu iki hafta üst üste %50 altında. Planı kısalt, görüşme ayarla.']);
  if(ex.length>=3){
    const l3=ex.slice(-3).map(totalNet);
    if(Math.abs(l3[2]-l3[0])<1.5) F.push(['warn','~','Toplam net son 3 denemede sabit. Süreyi değil, yöntemi/kaynağı değiştir.']);
    if(l3[2]<l3[0]-2) F.push(['bad','↓','Toplam net düşüyor. Önce hata günlüğüne bak, plana dokunma.']);
  }
  list.forEach(([k,nm])=>{
    const c=a.nets[k],t=+st.refNets[k];
    if(c!==undefined&&t&&(t-c)/t>0.35) F.push(['warn','·',`${nm}: hedefin %35'inden fazla gerisinde. Bu dersi haftalık plana öncelikli al.`]);
  });

    <div class="stat"><div class="k">Bu hafta ödev uyumu</div><div class="v">${lastW&&lastW.rate!==null?lastW.rate+'%':'—'}</div><div class="n">${lastW?lastW.done+'/'+lastW.total+' tamamlandı':'ödev yok'}</div></div>
  </div></div>

  <div class="grid2">

  </div>

  <div class="grid2">
    <div class="card"><h2>Uyarılar<small>Panelin otomatik teşhisleri. Haftalık görüşmeye buradan başla.</small></h2><div class="body">
      ${F.map(f=>`<div class="flag ${f[0]}"><span class="ic">${f[1]}</span><span>${f[2]}</span></div>`).join('')}
    </div></div>
    <div class="card"><h2>Deneme özeti<small>Son 8 denemenin TYT ve AYT netleri.</small></h2><div class="body" style="padding:0">
      ${ex.length?`<table><thead><tr><th>Tarih</th><th>Deneme</th><th class="num">TYT</th><th class="num">AYT</th></tr></thead><tbody>
        ${[...ex].reverse().slice(0,8).map(e=>{const t=bolumNet(e,true),a=bolumNet(e,false);
          return `<tr><td class="num">${e.date.slice(5)}</td><td>${esc((e.name||'—').slice(0,28))}</td>

  </div></div>`:''}`;
}

/* deneme başına TYT / AYT toplam neti (ders koduna göre, deneme türünden bağımsız) */
function bolumNet(e,tytMi){
  let t=0,var_=false;
  for(const s in e.n){
    const isT=s.startsWith('tyt_');
    if(isT!==tytMi) continue;
    t+=net(e.n[s].d||0,e.n[s].y||0); var_=true;
  }
  return var_?t:null;
}
function netSerisi(st,tytMi){
  return [...st.exams].filter(e=>e.tur!=='brans').sort((a,b)=>a.date.localeCompare(b.date))
    .map(e=>({x:e.date.slice(5).replace('-','/'),y:bolumNet(e,tytMi),ad:e.name||''}))
    .filter(v=>v.y!==null);
}
function netGrafik(veri,renk){
  if(!veri.length) return '<div class="empty">Deneme girildiğinde grafik oluşur.</div>';
  const w=560,hh=200,sol=14,sag=14,ust=24,alt=28;
  const mx=Math.max(...veri.map(v=>v.y))*1.12||1;
  const mn=Math.min(0,...veri.map(v=>v.y));
  const rg=(mx-mn)||1;
  const X=i=>veri.length===1?(sol+(w-sol-sag)/2):sol+i*(w-sol-sag)/(veri.length-1);
  const Y=v=>hh-alt-((v-mn)/rg)*(hh-ust-alt);
  const pts=veri.map((v,i)=>[X(i),Y(v.y)]);
  const izgara='';
  const alan=veri.length>1?`<polygon points="${pts.map(p=>p.join(',')).join(' ')} ${pts[pts.length-1][0]},${hh-alt} ${pts[0][0]},${hh-alt}" fill="${renk}" opacity=".10"/>`:'';
  return `<svg viewBox="0 0 ${w} ${hh}" width="100%" height="205" role="img" aria-label="Net seyri">
    ${izgara}${alan}
    ${veri.length>1?`<polyline fill="none" stroke="${renk}" stroke-width="2.5" stroke-linejoin="round" points="${pts.map(p=>p.join(',')).join(' ')}"/>`:''}
    ${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.8" fill="#fff" stroke="${renk}" stroke-width="2.5"/>
      <text x="${p[0]}" y="${p[1]-10}" text-anchor="middle" font-family="var(--mono)" font-size="10.5" font-weight="600" fill="${renk}">${n1(veri[i].y)}</text>
      <text x="${p[0]}" y="${hh-10}" text-anchor="middle" font-family="var(--mono)" font-size="9.5" fill="var(--ink-3)">${veri[i].x}</text>`).join('')}
  </svg>`;
}
function grafikKarti(st,bas,tytMi,renk){
  const s=netSerisi(st,tytMi);
  const hedef=subs(st).filter(x=>x[0].startsWith('tyt_')===tytMi)
    .reduce((a,[k])=>a+(+st.refNets[k]||0),0);
  const son=s.length?s[s.length-1].y:null;
  const fark=(hedef&&son!==null)?son-hedef:null;
  return `<div class="card"><h2>${bas}</h2><div class="body">
    ${s.length?`<div style="font-family:var(--mono);font-size:12.5px;color:var(--ink-2);margin-bottom:4px">
      ${s.length} deneme · son <b style="color:${renk}">${n1(son)}</b>
      ${s.length>1?` · ilk denemeye göre <b style="color:${son-s[0].y>=0?'var(--ok)':'var(--bad)'}">${(son-s[0].y>=0?'+':'')+n1(son-s[0].y)}</b>`:''}
      ${hedef?` · hedef ${n1(hedef)} <b style="color:${fark<0?'var(--bad)':'var(--ok)'}">(${fark>0?'+':''}${n1(fark)})</b>`:''}
    </div>`:''}
    ${netGrafik(s,renk)}
  </div></div>`;
}

/* ---------- DENEME ANALİZİ: yanlış / boş konular ---------- */
let ANEX=null, ANS=null, ANU='';
function anDers(st){const l=subs(st); if(!ANS||!l.find(x=>x[0]===ANS)) ANS=l[0][0]; return ANS;}
function setAnDers(k){ANS=k;ANU='';render();}
function setAnUnite(u){ANU=u;render();}
function openAn(id){ANEX=(ANEX===id?null:id);render();window.scrollTo({top:0,behavior:'smooth'});}

function anEkle(){
  const st=cur(), e=st.exams.find(x=>x.id===ANEX); if(!e) return;
  const sk=anDers(st);
  let konu=document.getElementById('anK').value;
  const serbest=document.getElementById('anFree').value.trim();
  if(serbest) konu=serbest;
  if(!konu){alert('Konu seç ya da karnedeki adını yaz.');return;}
  e.an=e.an||[];
  e.an.push({sub:sk,konu,unite:(uniteOf[sk]||{})[konu]||'Listede yok (karne adı)',
    tip:document.getElementById('anT').value,adet:+document.getElementById('anA').value||1});
  document.getElementById('anFree').value='';
  save(); render();
}
function anSil(i){const st=cur(),e=st.exams.find(x=>x.id===ANEX); e.an.splice(i,1); save(); render();}
function anYapistir(){
  const st=cur(), e=st.exams.find(x=>x.id===ANEX); if(!e) return;
  const sk=anDers(st), tip=document.getElementById('anT').value;
  const txt=document.getElementById('anPaste').value;
  if(!txt.trim()){alert('Karnedeki konu listesini yapıştır.');return;}
  const havuz=(KONU[sk]||[]).flatMap(u=>u[1]);
  e.an=e.an||[]; let n=0,esles=0;
  txt.split(/[\r\n;,]+/).forEach(raw=>{
    const s=raw.replace(/^[\s\-•*\d.)]+/,'').trim();
    if(s.length<3) return;
    const L=norm(s);
    let hit=null,hl=0;
    havuz.forEach(t=>{const N=norm(t);
      if((N.includes(L)||L.includes(N))&&N.length>hl){hit=t;hl=N.length;}});
    const konu=hit||s;
    if(hit) esles++;
    e.an.push({sub:sk,konu,unite:hit?(uniteOf[sk]||{})[hit]:'Listede yok (karne adı)',tip,adet:1});
    n++;
  });
  document.getElementById('anPaste').value='';
  save(); render();
  alert(n+' konu eklendi. '+esles+' tanesi konu listesiyle eşleşti.');
}

function anGoster(st,e){
  const arr=e.an||[];
  if(!arr.length) return '<div class="empty">Bu deneme için henüz yanlış/boş konu girilmemiş.</div>';
  // ders -> ünite -> konu
  const g={};
  arr.forEach((a,i)=>{

    const u=d[a.unite]=d[a.unite]||{};

  return Object.keys(g).map(sk=>{

    Object.values(g[sk]).forEach(u=>Object.values(u).forEach(k=>{ty+=k.y;tb+=k.b;}));

      ${Object.keys(g[sk]).map(u=>Object.keys(g[sk][u]).map((kk,j)=>{

        return `<tr><td style="color:var(--ink-3);font-size:12px">${j===0?esc(u):''}</td>

          <td class="num" style="color:${c.y?'var(--bad)':'var(--ink-3)'};font-weight:${c.y?'650':'400'}">${c.y||'·'}</td>

  }).join('');
}

/* tüm denemelerde tekrar eden yanlış konular */
function anTekrar(st){

  const rows=Object.values(agg).map(r=>({...r,kac:r.den.size,tot:r.y+r.b}))

function waGonder(){
  const st=cur();
  const metin=document.getElementById('hfMetin').value;
  if(!metin.trim()){alert('Gönderilecek metin boş.');return;}
  if(metin.length>3500&&!confirm('Metin uzun ('+metin.length+' karakter). WhatsApp kırpabilir. Yine de açılsın mı?')) return;
  let tel=String(st.tel||'').replace(/\D/g,'');
  if(tel.startsWith('0')) tel='90'+tel.slice(1);
  else if(tel.length===10&&tel.startsWith('5')) tel='90'+tel;
  const url = tel ? `https://wa.me/${tel}?text=${encodeURIComponent(metin)}`
                  : `https://wa.me/?text=${encodeURIComponent(metin)}`;
  if(!tel&&!confirm('Öğrencinin telefonu kayıtlı değil. WhatsApp açılacak, kişiyi sen seçeceksin. Devam?')) return;
  window.open(url,'_blank','noopener');
}
function kopyala(id){
  const el=document.getElementById(id); el.select(); el.setSelectionRange(0,999999);
  try{document.execCommand('copy');alert('Metin kopyalandı.');}catch(e){alert('Kopyalanamadı, elle seçip kopyala.');}
}

  else if(ws.length&&ws[0].rate<50)
    S.push('Bu hafta ödev uyumu %'+ws[0].rate+'. Tek haftalık bir dalgalanma mı, yoksa erken uyarı mı?');
  // 2) tekrar eden konular
  const agg={};
  st.exams.forEach(e=>(e.an||[]).forEach(x=>{const k=x.sub+'||'+x.konu;
    const o=agg[k]=agg[k]||{sub:x.sub,konu:x.konu,den:new Set(),y:0,b:0}; o[x.tip]+=x.adet; o.den.add(e.id);}));
  const tek=Object.values(agg).filter(x=>x.den.size>=3).sort((x,y)=>y.den.size-x.den.size)[0];
  if(tek){
    const d=(st.topics[tek.sub]||{})[tek.konu];
    S.push(`${subName(tek.sub)} / ${tek.konu} ${tek.den.size} denemede yanlış çıktı${d===2?' ama "bitti" işaretli':''}. Bu bir bilgi eksiği mi, yoksa alt yapıdaki başka bir konudan mı kaynaklanıyor?`);
  }
  // 3) net sabit / düşüyor
  const ex=[...st.exams].filter(e=>e.tur!=='brans').sort((x,y)=>x.date.localeCompare(y.date));
  if(ex.length>=3){
    const t=e=>{let s=0;for(const k in e.n)s+=net(e.n[k].d||0,e.n[k].y||0);return s;};
    const l3=ex.slice(-3).map(t);
    const {top}=soruIstat(st);
    if(Math.abs(l3[2]-l3[0])<1.5&&top>300) S.push('Toplam '+top+' soru çözülmüş ama net son 3 denemede sabit. Yöntem mi değişmeli, kaynak mı, yoksa soru seviyesi mi?');
    else if(l3[2]<l3[0]-2) S.push('Net son 3 denemede '+n1(l3[0]-l3[2])+' düştü. Önce neye bakmalıyım?');
  }
  // 4) en geride ders
  const geri=subs(st).map(([k,nm])=>{const c=a.nets[k],r=+st.refNets[k];
    return (c!==undefined&&r)?{nm,or:c/r}:null;}).filter(Boolean).sort((x,y)=>x.or-y.or)[0];
  const yakin=subs(st).map(([k,nm])=>{const c=a.nets[k],r=+st.refNets[k];
    return (c!==undefined&&r&&c<r)?{nm,or:c/r}:null;}).filter(Boolean).sort((x,y)=>y.or-x.or)[0];
  if(geri&&yakin&&geri.nm!==yakin.nm)
    S.push(`${geri.nm} hedefin %${Math.round(geri.or*100)}'inde (en geride), ${yakin.nm} %${Math.round(yakin.or*100)}'inde (hedefe en yakın açık ders). Bu haftayı en geridekine mi ayırayım, yoksa yakın olandan hızlı kazanım mı almalıyım?`);
  // 5) devreden
  const dev=devredenler(st);
  const eski=dev.filter(t=>haftaFarki(t.date)>=3);
  if(eski.length) S.push(eski.length+' ödev 3 haftadan uzun süredir devrediyor. Bunları silip yeniden mi kurmalıyım, yoksa küçültüp mü devam etmeliyim?');
  if(!S.length) S.push('Bu öğrencide belirgin bir uyarı sinyali yok. Verilerde gözden kaçırdığım bir örüntü görüyor musun? Önümüzdeki hafta neye öncelik vermeliyim?');
  return S.slice(0,3);
}
function aiMetin(st){

  const L=[], a=avgNets(st,3), list=subs(st);
