  L.push('Tarih: '+today());
  L.push('Öğrenci: '+ad+(st.sinavTarihi?` · sınava ${haftaKalan(st)} hafta`:''));
  L.push('');
  // hedef
  const hp=parseFloat(String(st.score||'').replace(',','.'));
  const su=a.count?hesapla(st.track,a.nets,+st.obp||0,!!st.yerlesti):null;
  L.push('— HEDEF —');
  L.push('Bölüm: '+(st.dept||'belirlenmemiş')+(st.tabanSira?` (taban sıra ${st.tabanSira}, ${st.tabanYil||''})`:''));
  if(su&&isFinite(hp)) L.push(`Puan: şu an ${n1(su.yerPuan)} · hedef ${n1(hp)} · fark ${n1(su.yerPuan-hp)}`);
  let cN=0,hN=0; list.forEach(([k])=>{cN+=a.nets[k]||0; hN+=+st.refNets[k]||0;});
  if(hN) L.push(`Net: şu an ${n1(cN)} · hedef ${n1(hN)} · fark ${n1(cN-hN)}`);
  L.push('');
  // deneme seyri
  const ex=[...st.exams].filter(e=>e.tur!=='brans').sort((x,y)=>x.date.localeCompare(y.date)).slice(-5);
  L.push('— DENEME SEYRİ (son '+ex.length+') —');
  if(ex.length){
    const t=e=>{let s=0;for(const k in e.n)s+=net(e.n[k].d||0,e.n[k].y||0);return s;};
    L.push('Toplam net: '+ex.map(e=>e.date.slice(5)+' '+n1(t(e))).join('  →  '));
    L.push('');
    L.push('Ders bazında (son 3 ortalaması / hedef / fark):');
    list.forEach(([k,nm])=>{const c=a.nets[k],r=+st.refNets[k]||0;
      if(c===undefined&&!r) return;
      const seri=ex.slice(-3).map(e=>e.n[k]?n1(net(e.n[k].d||0,e.n[k].y||0)):'·').join(' → ');
      L.push(`  ${nm}: ${c===undefined?'—':n1(c)} / ${r?n1(r):'—'} / ${(c!==undefined&&r)?n1(c-r):'—'}   [seyir: ${seri}]`);});
  } else L.push('Henüz deneme yok.');
  L.push('');
  // yanlis konular
  const agg={};
  st.exams.forEach(e=>(e.an||[]).forEach(x=>{const k=x.sub+'||'+x.konu;
    const o=agg[k]=agg[k]||{sub:x.sub,konu:x.konu,unite:x.unite,den:new Set(),y:0,b:0};
    o[x.tip]+=x.adet; o.den.add(e.id);}));
  const hepsi=Object.values(agg).sort((x,y)=>y.den.size-x.den.size||y.y-x.y);
  L.push('— DENEMELERDE YANLIŞ/BOŞ KONULAR —');
  if(hepsi.length){
    const tek=hepsi.filter(x=>x.den.size>=2);
    if(tek.length){ L.push('Birden fazla denemede tekrar edenler:');
      tek.slice(0,12).forEach(x=>L.push(`  ${subName(x.sub)} / ${x.konu} — ${x.den.size} denemede (${x.y} yanlış, ${x.b} boş)${(st.topics[x.sub]||{})[x.konu]===2?' [öğrenci "bitti" işaretlemiş]':''}`)); L.push(''); }
    L.push('Tek denemede çıkanlar:');
    hepsi.filter(x=>x.den.size===1).slice(0,15).forEach(x=>L.push(`  ${subName(x.sub)} / ${x.konu} (${x.y}Y ${x.b}B)`));
  } else L.push('Konu dökümü girilmemiş.');
  L.push('');
  // konu durumu
  L.push('— KONU İLERLEMESİ —');
  list.forEach(([k,nm])=>{const s=topicStats(st,k);
    const eks=[]; for(const t in (st.topics[k]||{})) if(st.topics[k][t]===3) eks.push(t);
    L.push(`  ${nm}: %${s.total?Math.round(s.done/s.total*100):0} bitti (${s.done}/${s.total})${eks.length?' · eksik işaretli: '+eks.slice(0,4).join(', '):''}`);});
  L.push('');
  // odev
  const wk=weekKey(today()), ws=weekStats(st,wk), dev=devredenler(st);
  L.push('— ÖDEV DURUMU —');
  L.push('Son haftalar uyum: '+(lastWeeks(st,4).map(w=>w.wk.slice(5)+' %'+(w.rate??'—')).join('  ·  ')||'veri yok'));
  const bu=st.tasks.filter(t=>weekKey(t.date)===wk);
  L.push('Bu hafta verilen: '+(bu.length?bu.map(t=>`${subName(t.sub)}/${t.konu}${t.q?` (${t.q} soru)`:''} — ${SL[t.s]}`).join(' | '):'yok'));
  if(dev.length) L.push('Devreden: '+dev.map(t=>`${subName(t.sub)}/${t.konu} (${haftaFarki(t.date)} hafta, ${SL[t.s]})`).join(' | '));
  const {m,top}=soruIstat(st);
  L.push('Çözülen soru (toplam '+top+'): '+(Object.keys(m).length?subs(st).filter(([k])=>m[k]).map(([k,nm])=>nm+' '+m[k]).join(' · '):'veri yok'));
  L.push('');
  L.push('— SORULARIM —');
  aiSorular(st).forEach((s,i)=>L.push((i+1)+'. '+s));
  L.push('');
  L.push('Not: Net değerleri doğru − yanlış/4 ile hesaplandı. Puan yaklaşık ham puan modelidir (±10-15 puan sapabilir). Süre ve hedef netleri panel tahminidir.');
  return L.join('\n');
}

let AIGOSTER=false;

/* kural tabanlı hafta notu */
function haftaMetni(st){
  const a=avgNets(st,3), wk=weekKey(today());
  const tasks=st.tasks.filter(t=>weekKey(t.date)===wk).sort((x,y)=>x.date.localeCompare(y.date));
  const L=[];
  L.push(`${st.name} — ${wk} haftası`);
  L.push(`Hazırlanma tarihi: ${today()}`);
  const hk=haftaKalan(st); if(hk!==null) L.push(`Sınava ${hk} hafta.`);
  const hs=haftaSure(st,wk);
  if(hs.top) L.push(`Bu haftanın hedef çalışma süresi: ${sa(hs.top)}  (rutin ${sa(hs.rut)} + konu ${sa(hs.konu)}) — günde ~${sa(hs.top/7)}`);
  L.push('');

  // 1) nerede duruyor
  if(a.count){
    let c=0,t=0,v=false;
    subs(st).forEach(([k])=>{c+=a.nets[k]||0;const r=+st.refNets[k];if(r){t+=r;v=true;}});
    L.push(`DURUM: Son ${a.count} deneme ortalaman ${n1(c)} net.` + (v?` Hedefin ${n1(t)}. Aradaki fark ${n1(t-c)} net.`:''));
  }
  // 2) öncelikli dersler
  const oncelik=subs(st).map(([k,nm])=>{
    const c=a.nets[k],r=+st.refNets[k];
    return (c!==undefined&&r)?{nm,ac:r-c,or:(r-c)/r}:null;
  }).filter(x=>x&&x.ac>0).sort((x,y)=>y.ac-x.ac).slice(0,3);
  if(oncelik.length){
    L.push('');
    L.push('BU HAFTA ÖNCELİK:');
    oncelik.forEach((o,i)=>L.push(`${i+1}. ${o.nm} — hedefin ${n1(o.ac)} net gerisinde.`));
  }
  // 3) tekrar eden yanlışlar
  const agg={};
  st.exams.forEach(e=>(e.an||[]).forEach(x=>{
    const k=x.sub+'||'+x.konu; const o=agg[k]=agg[k]||{sub:x.sub,konu:x.konu,den:new Set(),y:0,b:0};
    o[x.tip]+=x.adet; o.den.add(e.id);
  }));
  const tekrar=Object.values(agg).filter(x=>x.den.size>=2).sort((x,y)=>y.den.size-x.den.size).slice(0,4);
  if(tekrar.length){
    L.push('');
    L.push('BİRDEN FAZLA DENEMEDE ÇIKAN KONULAR:');
    tekrar.forEach(x=>L.push(`- ${subName(x.sub)} / ${x.konu} — ${x.den.size} denemede (${x.y} yanlış, ${x.b} boş)`));
    L.push('Bu konuları yeniden okumadan önce, eski yanlışlarını aç ve nerede takıldığını yaz.');
  }
  // 4) sabit rutin
  const rv=rutinVar(st,wk);
  L.push('');
  L.push('SABİT HAFTALIK RUTİN (pazartesiden pazara yayarak yap):');
  if(rv.length) rv.forEach(t=>L.push(`- ${t.konu}: ${t.q} soru${t.yap?` (şu an ${t.yap})`:''} — günde ~${Math.ceil(t.q/7)} soru`));
  else rutinler().forEach(r=>L.push(`- ${r.ad}: ${r.adet} soru — günde ~${Math.ceil(r.adet/7)} soru`));
  L.push('Rutin pazarlık konusu değil. Diğer ödevler bitmese de bu ikisi biter.');

  // 4b) devreden ödevler
  const dev=devredenler(st);
  if(dev.length){
    L.push('');
    L.push(`GEÇEN HAFTALARDAN KALANLAR (${dev.length} ödev · ~${sa(dev.reduce((a,t)=>a+sureOf(t.sub,t.konu),0))}):`);
    dev.forEach(t=>L.push(`- ${subName(t.sub)} / ${t.konu} — ${haftaFarki(t.date)} hafta önce verildi, ${SL[t.s].toLowerCase()}`));
    L.push('Bunlar yeni ödevlerden ÖNCE gelir. Bitmeden yeni konuya geçme.');
  }

  // 5) haftanın ödevleri + nasıl yapılacağı
  const konuT=tasks.filter(t=>!t.rutin);
  if(konuT.length){
    L.push('');
    L.push('BU HAFTANIN KONU ÖDEVLERİ:');
    const gun={};
    konuT.forEach(t=>{(gun[t.date]=gun[t.date]||[]).push(t);});
    Object.keys(gun).sort().forEach(g=>{
      const gunDk=gun[g].reduce((a,t)=>a+(t.konu?sureOf(t.sub,t.konu):0),0);
      L.push(`  ${g}  —  toplam ~${sa(gunDk)}`);
      gun[g].forEach(t=>{
        const d=(st.topics[t.sub]||{})[t.konu]||0;
        const dk=t.konu?sureOf(t.sub,t.konu):null;
        L.push(`   - ${subName(t.sub)} / ${t.konu||'—'}${t.q?` · ${t.q} soru`:''}${dk?` · tahmini ${sa(dk)}`:''}`);
        L.push(`     ${yonerge(d,t)}`);
      });
    });
    L.push(`  Konu ödevleri toplamı: ~${sa(konuT.reduce((a,t)=>a+(t.konu?sureOf(t.sub,t.konu):0),0))}`);
  }
  // 5) uyarı
  const w=weekStats(st,wk);
  L.push('');
  if(w.rate!==null&&w.rate<50) L.push('NOT: Geçen hafta plana uyum %50 altındaydı. Bu hafta liste kısa tutuldu; bitirmek şart.');
  L.push('Pazar akşamı raporunu göndermeyi unutma: hangi ödevi yaptın, hangi konudan kaç yanlış, yanlışın sebebi ne.');
  return L.join('\n');
}
function yonerge(durum,t){
  const q=t.q||0;
  if(durum===0) return `Önce konuyu bitir, sonra ${q?q+' soru':'soru'} çöz. Konuyu bitirmeden soruya geçme.`;
  if(durum===1) return `Kaldığın yerden devam et. Bitirdiğin bölümden hemen ${q?Math.round(q/2)+'-'+q:'10-20'} soru çöz.`;
  if(durum===3) return `Bu konu eksik işaretli. Kolay 5 soruyla başla, tıkandığın ilk soruyu not al ve bana yaz. Zoru sonra.`;
  return `Konu tekrarı: 15 dakika hızlı gözden geçir, sonra ${q?q+' soru':'soru'} çöz. Yanlışlarını hata günlüğüne yaz.`;
}

function saveExam(){
  const st=cur(),n={};
  subs(st).forEach(([k])=>{
    const d=document.getElementById('d_'+k).value, y=document.getElementById('y_'+k).value;
    if(d!==''||y!=='') n[k]={d:+d||0,y:+y||0};
  });
  if(!Object.keys(n).length){alert('En az bir derse doğru/yanlış gir.');return;}
  const an=[];
  PENDING_AN.forEach(r=>{
    if(r.y) an.push({sub:r.sub,konu:r.konu,unite:r.unite,tip:'y',adet:r.y});
    if(r.b) an.push({sub:r.sub,konu:r.konu,unite:r.unite,tip:'b',adet:r.b});
  });
  st.exams.push({id:uid(),date:document.getElementById('exD').value||today(),name:document.getElementById('exN').value.trim(),n,an});
  PENDING_AN=[];
  save(); render();
}
function delExam(id){const st=cur(); if(!confirm('Bu deneme silinsin mi?'))return; st.exams=st.exams.filter(e=>e.id!==id); save(); render();}

/* ================= HEDEFE GÖRE KONU ÖNCELİĞİ =================
   agirlik-2027.json: her konunun ÖSYM'de yılda ortalama kaç soru getirdiği
   ve başka konuların ön koşulu olup olmadığı (kilit).
   Öğrencinin hedef netine göre konular üç kademeye ayrılır:
     ÇEKİRDEK      — hedefi karşılayan en verimli konular (+ ön koşulları)
     GÜVENLİK PAYI — baraj kayarsa koruyan ek konular
     GENİŞLEME     — kalanlar
   Sistem hiçbir konuyu listeden çıkarmaz; yalnızca SIRA verir.
============================================================ */
let AGIRLIK=null, AGIRLIK_DURUM='bekliyor';
const AGIRLIK_KEY='kocluk_agirlik_v1';

async function agirlikYukle(){
  try{
    const c=localStorage.getItem(AGIRLIK_KEY);
    if(c){ const j=JSON.parse(c); if(j&&j.agirlik){ AGIRLIK=j; AGIRLIK_DURUM='hazir'; } }
  }catch(e){}
  try{
    const r=await fetch('agirlik-2027.json',{cache:'no-cache'});
    if(r.ok){
      const j=await r.json();
      if(j&&j.agirlik){
        AGIRLIK=j; AGIRLIK_DURUM='hazir';
        try{ localStorage.setItem(AGIRLIK_KEY, JSON.stringify(j)); }catch(e){}
      }
    }
  }catch(e){ if(!AGIRLIK) AGIRLIK_DURUM='yok'; }
}

/* Bir ders için konuları hedefe göre sıralar ve kademelere ayırır. */
/* Geometri panelde ayrı bir HEDEF NET olarak tutulur ama ayrı konu ağacı yoktur:
   geometri konuları matematiğin içinde durur (üçgenler, dörtgenler, çember, analitik...).
   Bu yüzden matematiğin hedefi hesaplanırken geometri hedefi de EKLENİR.
   Aksi hâlde konu havuzu geometriyi kapsarken hedef kapsamaz, sıralama kayar. */
const BIRLESIK_HEDEF={ tyt_mat:['tyt_mat','tyt_geo'], ayt_mat:['ayt_mat','ayt_geo'] };
function hedefNet(st, sk){
  const r=st&&st.refNets; if(!r) return null;
  const liste=BIRLESIK_HEDEF[sk]||[sk];
  let t=0, varMi=false;
  liste.forEach(k=>{ if(r[k]!=null && r[k]!=='' ){ t+=(+r[k]||0); varMi=true; } });
  return varMi ? t : null;
}
function konuOncelik(st, sk){
  if(!AGIRLIK || !AGIRLIK.agirlik[sk]) return null;
  const tab=AGIRLIK.agirlik[sk];
  const hedef=hedefNet(st, sk);
  const kalem=[];
  for(const [u,ks] of (KONU[sk]||[])){
    for(const t of ks){
      const a=tab[t]||{soru_yil:0,kilit:false,kademe:'C'};
      kalem.push({konu:t, unite:u, agirlik:+a.soru_yil||0, kilit:!!a.kilit});
    }
  }
  kalem.sort((x,y)=> y.agirlik-x.agirlik || x.konu.localeCompare(y.konu,'tr'));
  const toplam=kalem.reduce((a,x)=>a+x.agirlik,0) || 1;

  // hedef yoksa kapsam yüzdesine göre böl
  const cekirdekEsik = hedef!=null ? hedef*1.25 : toplam*0.50;
  const guvenlikEsik = hedef!=null ? hedef*1.55 : toplam*0.80;

  let kum=0;
  kalem.forEach(x=>{
    kum+=x.agirlik; x.kumulatif=kum;
    x.oncelik = kum<=cekirdekEsik ? 'cekirdek' : (kum<=guvenlikEsik ? 'guvenlik' : 'genisleme');
    x.kapsam = hedef ? Math.min(100, Math.round(kum/hedef*100)) : Math.round(kum/toplam*100);
  });
  // ön koşullar kademesi ne olursa olsun çekirdeğe alınır
  kalem.forEach(x=>{ if(x.kilit && x.oncelik!=='cekirdek') x.oncelik='cekirdek'; });
  const sira={}; kalem.forEach((x,i)=>sira[x.konu]=i);
  return {kalem, sira, hedef, toplam};
}

const ONCELIK_AD={cekirdek:'ÇEKİRDEK', guvenlik:'GÜVENLİK PAYI', genisleme:'GENİŞLEME'};
function oncelikRozet(o, kilit){
  const renk={cekirdek:'#B3261E', guvenlik:'#D68A2E', genisleme:'#5A7794'}[o]||'#5A7794';
  return `<span style="display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.05em;
    padding:1px 6px;border-radius:4px;background:${renk}1F;color:${renk};border:1px solid ${renk}55;
    white-space:nowrap">${ONCELIK_AD[o]||''}</span>` +
    (kilit?`<span title="Ön koşul konusu — atlanamaz" style="display:inline-block;font-size:9.5px;
     font-weight:700;padding:1px 6px;border-radius:4px;margin-left:4px;background:#0E4A461F;
     color:#0E4A46;border:1px solid #0E4A4655;white-space:nowrap">🔒 ÖN KOŞUL</span>`:'');
}

/* ---------- HIZLI ÖDEV ATA: her dersin ilk bitmemiş konusu ---------- */
function odevliKonular(st,sk){
  return new Set(st.tasks.filter(t=>t.sub===sk&&t.konu).map(t=>t.konu));
}
function siradakiKonular(st,sk,adet){
  const m=st.topics[sk]||{}, verilmis=odevliKonular(st,sk), out=[];
  const oc = (ODEV_SIRA==='hedef') ? konuOncelik(st,sk) : null;
  if(oc){
    /* Ağırlık tablosu varsa: müfredat sırası değil, HEDEFE KATKI sırası.
       Önce çekirdek (ön koşullar dahil), sonra güvenlik payı, sonra kalanı. */
    for(const x of oc.kalem){
      if((m[x.konu]||0)===2) continue;
      if(verilmis.has(x.konu)) continue;
      out.push({konu:x.konu,unite:x.unite,durum:m[x.konu]||0,
                oncelik:x.oncelik,kilit:x.kilit,kapsam:x.kapsam,agirlik:x.agirlik});
      if(out.length>=adet) return out;
    }
    return out;
  }
  for(const [u,ks] of (KONU[sk]||[])){
    for(const t of ks){
      if((m[t]||0)===2) continue;
      if(verilmis.has(t)) continue;
      out.push({konu:t,unite:u,durum:m[t]||0});
      if(out.length>=adet) return out;
    }
  }
  return out;
}

/* konu bazında ödev dökümü */
function odevDokum(st){
  const agg={};
  st.tasks.forEach(t=>{
    const key=t.sub+'||'+(t.konu||'—');
    const a=agg[key]=agg[key]||{sub:t.sub,konu:t.konu||'—',kez:0,soru:0,yap:0,kis:0,yok:0,bek:0,son:''};
    a.kez++; a.soru+=+t.q||0;
    if(t.s===1)a.yap++; else if(t.s===2)a.kis++; else if(t.s===3)a.yok++; else a.bek++;
    if(t.date>a.son)a.son=t.date;
  });
  const rows=Object.values(agg).sort((a,b)=>b.kez-a.kez||b.soru-a.soru);
  if(!rows.length) return '';
  const tKez=rows.reduce((s,r)=>s+r.kez,0), tSoru=rows.reduce((s,r)=>s+r.soru,0);
  return `<div class="card"><h2>Konu bazında ödev dökümü — ${rows.length} konu · ${tKez} ödev · ${tSoru} soru<small>Çok tekrar edilen ama uyumu düşük konular, öğrencinin kaçındığı konulardır.</small></h2>
    <div class="body" style="padding:0;max-height:520px;overflow:auto">
    <table><thead><tr><th>Ders</th><th>Ünite</th><th>Konu</th><th class="num">Kaç kez</th><th class="num">Toplam soru</th>
      <th class="num">Yapıldı</th><th class="num">Kısmen</th><th class="num">Yapılmadı</th><th class="num">Uyum</th><th class="num">Son</th></tr></thead><tbody>
    ${rows.map(r=>{
      const bitmis=r.kez-r.bek;
      const u=(uniteOf[r.sub]||{})[r.konu]||'—';
      const or=bitmis?Math.round((r.yap+r.kis*0.5)/bitmis*100):null;
      return `<tr><td>${subName(r.sub)}</td><td style="color:var(--ink-3);font-size:12px">${esc(u)}</td><td><b>${esc(r.konu)}</b></td>
        <td class="num" style="font-weight:650">${r.kez}</td><td class="num">${r.soru||'—'}</td>
        <td class="num">${r.yap}</td><td class="num">${r.kis}</td><td class="num" style="color:${r.yok?'var(--bad)':'inherit'}">${r.yok}</td>
        <td class="num" style="font-weight:600;color:${or===null?'var(--ink-3)':or>=70?'var(--ok)':or>=50?'var(--warn)':'var(--bad)'}">${or===null?'—':or+'%'}</td>
        <td class="num" style="color:var(--ink-3)">${r.son.slice(5)}</td></tr>`;
    }).join('')}
    </tbody></table></div>
    <div class="body" style="border-top:1px solid var(--line-soft)">
      <div class="hint">Çok tekrar edilen ama uyumu düşük konular, öğrencinin kaçındığı konulardır. Üç kez verilip üç kez yapılmayan bir konu, ödev sorunu değil <b>korku</b> sorunudur — planı değil konuşmayı değiştir.</div>
    </div></div>`;
}

function sureIceAktar(ev){

      const s=d.sureler||d;
      if(typeof s!=='object') throw new Error('biçim uygun değil');
      let n=0; for(const k in s) n+=Object.keys(s[k]).length;

    }catch(e){ alert('Dosya okunamadı: '+e.message); }

  r.readAsText(f); ev.target.value='';
}

function liveCalc(){
  const st=cur(); const r=hesapla(st.track,PN,+st.obp||0,!!st.yerlesti);
  document.getElementById('pvTyt').textContent=n1(r.tytPuan);
  document.getElementById('pvYer').textContent=n1(r.yerPuan);
  document.getElementById('pvObp').textContent=n1(r.obpPay);
  const h=parseFloat(String(st.score).replace(',','.'));
  const f=document.getElementById('pvFark');
  if(isFinite(h)){const d=r.yerPuan-h;f.textContent=(d>0?'+':'')+n1(d);f.style.color=d<0?'var(--bad)':'var(--ok)';}
  document.querySelectorAll('[data-kk]').forEach(td=>{
    const k=td.dataset.kk, kat=KTYT[k]?KTYT[k]*0.4:(KAYT[st.track]||{})[k];
    td.textContent=n1((+PN[k]||0)*kat);
  });
}
function setDip(v){const st=cur();st.dip=v===''?'':+v;st.obp=v===''?'':Math.round(+v*5*100)/100;document.getElementById('pObp').value=st.obp;save();liveCalc();
  const b=document.querySelector('.stat .n');if(b)b.textContent='OBP dahil · en fazla 560';}
function setYerlesti(b){const st=cur();st.yerlesti=b;save();render();}
function saveAsRef(){
  const st=cur(); let c=0;
  subs(st).forEach(([k])=>{ if(PN[k]!==undefined&&PN[k]!==''){st.refNets[k]=+PN[k];c++;} });
  save(); alert(c+' ders için hedef net kaydedildi. Durum sekmesindeki karşılaştırma güncellendi.'); TAB='durum'; render();
}

/* ---------- hedefe uzaklık özeti (Hedef sekmesi) ---------- */
function hedefeUzaklik(st){
  const a=avgNets(st,3), list=subs(st);
  const hp=parseFloat(String(st.score||'').replace(',','.'));
  const su=a.count?hesapla(st.track,a.nets,+st.obp||0,!!st.yerlesti):null;
  let cN=0,hN=0,varH=false;
  list.forEach(([k])=>{cN+=a.nets[k]||0; const t=+st.refNets[k]||0; if(t){hN+=t;varH=true;}});
  const bl={TYT:list.filter(x=>x[0].startsWith('tyt_')),AYT:list.filter(x=>!x[0].startsWith('tyt_'))};
  const bar=([k,nm])=>{
    const c=a.nets[k], t=+st.refNets[k]||0;
    if(c===undefined&&!t) return '';
    const o=Math.max(t,c||0,1);
    const cw=Math.max(0,Math.min(100,(c||0)/o*100)), tw=Math.max(0,Math.min(100,t/o*100));
    const d=(c===undefined||!t)?null:c-t;
    const yuzde=(t&&c!==undefined)?Math.round(Math.min(100,c/t*100)):null;
    return `<div class="gap-row" style="grid-template-columns:145px 1fr 62px 150px">
      <div class="gap-name">${nm}</div>
      <div class="gap-bar"><div class="gap-fill" style="width:${cw}%"></div>
        ${t?`<div class="gap-tick" style="left:calc(${tw}% - 1px)"></div>`:''}</div>
      <div class="gap-nums"><b style="color:${yuzde===null?'var(--ink-3)':yuzde>=90?'var(--ok)':yuzde>=60?'var(--warn)':'var(--bad)'}">${yuzde===null?'—':'%'+yuzde}</b></div>
      <div class="gap-nums"><span class="cur">${c===undefined?'—':n1(c)}</span><span class="t">/ ${t?n1(t):'—'}</span>
        <span class="d ${d===null?'':d<0?'neg':'pos'}">${d===null?'':(d>0?'+':'')+n1(d)}</span></div></div>`;
  };
  const blok=(ad,l)=>{
    let c=0,t=0,v=false;
    l.forEach(([k])=>{c+=a.nets[k]||0; const r=+st.refNets[k]||0; if(r){t+=r;v=true;}});
    const y=(v&&a.count)?Math.round(Math.min(100,c/t*100)):null;
    return `<tr><td colspan="4" style="background:#F3F7F8;padding:7px 10px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:650">
      ${ad} — ${a.count?n1(c):'—'} / ${v?n1(t):'—'} ${y!==null?`· hedefin %${y}'i`:''}</td></tr>`;
  };
  return `<div class="card"><h2>Hedefe uzaklık — son ${a.count||3} deneme ortalaması</h2>
    <div class="stats">
      <div class="stat"><div class="k">Tahmini puanı</div><div class="v" style="font-size:22px">${su?n1(su.yerPuan):'—'}</div><div class="n">${a.count?a.count+' deneme ort. · OBP dahil':'deneme gir'}</div></div>
      <div class="stat"><div class="k">Hedef puan</div><div class="v" style="font-size:22px">${isFinite(hp)?n1(hp):'—'}</div><div class="n">${esc((st.dept||'').slice(0,24))||'bölüm seç'}</div></div>
      <div class="stat"><div class="k">Puan farkı</div><div class="v" style="font-size:22px;color:${(su&&isFinite(hp))?(su.yerPuan-hp<0?'var(--bad)':'var(--ok)'):'inherit'}">${(su&&isFinite(hp))?((su.yerPuan-hp>0?'+':'')+n1(su.yerPuan-hp)):'—'}</div><div class="n">hedefe uzaklık</div></div>
      <div class="stat"><div class="k">Hedefin yüzdesi</div><div class="v" style="font-size:22px;color:${(varH&&a.count)?(cN/hN>=0.9?'var(--ok)':cN/hN>=0.6?'var(--warn)':'var(--bad)'):'inherit'}">${(varH&&a.count)?'%'+Math.round(Math.min(100,cN/hN*100)):'—'}</div><div class="n">${varH&&a.count?n1(cN)+' / '+n1(hN)+' net':'hedef net gir'}</div></div>
    </div>
    <div class="body">
      ${a.count?`<table style="margin:-6px 0 10px"><tbody>${blok('TYT',bl.TYT)}</tbody></table>${bl.TYT.map(bar).join('')}
        <table style="margin:14px 0 10px"><tbody>${blok(trLabel(st.track)+' AYT',bl.AYT)}</tbody></table>${bl.AYT.map(bar).join('')}`
       :'<div class="empty">Deneme girildiğinde bu tablo dolar.</div>'}
      <div class="hint" style="margin-top:10px">Dolu çubuk mevcut ortalama, dikey çizgi hedef. Yüzde sütunu hedefin ne kadarına ulaştığını gösterir. Puan tahmini yaklaşıktır (±10-15 puan).</div>
    </div></div>`;
}

/* ---------- HEDEFE YAKLAŞMA (Hedef sekmesi üstü) ---------- */
function yaklasmaKarti(st){
  const a=avgNets(st,3), list=subs(st);
  let cN=0,hN=0,varH=false;
  list.forEach(([k])=>{ cN+=a.nets[k]||0; const t=+st.refNets[k]||0; if(t){hN+=t;varH=true;} });
  const hp=parseFloat(String(st.score||'').replace(',','.'));
  const su=a.count?hesapla(st.track,a.nets,+st.obp||0,!!st.yerlesti):null;
  // ilk denemeye göre kat edilen yol
  const ex=[...st.exams].filter(e=>e.tur!=='brans').sort((x,y)=>x.date.localeCompare(y.date));
  let ilkTop=null,sonTop=null;
  if(ex.length){ const t=e=>{let s=0;for(const k in e.n)s+=net(e.n[k].d||0,e.n[k].y||0);return s;};
    ilkTop=t(ex[0]); sonTop=t(ex[ex.length-1]); }
  const yol = (varH&&ilkTop!==null&&hN>ilkTop) ? Math.max(0,Math.min(100,(sonTop-ilkTop)/(hN-ilkTop)*100)) : null;

  const bar=([k,nm,q])=>{
    const c=a.nets[k], t=+st.refNets[k]||0;
    if(c===undefined&&!t) return '';
    const o=Math.max(t,c||0,1);
    const cw=Math.max(0,Math.min(100,(c||0)/o*100)), tw=Math.max(0,Math.min(100,t/o*100));
    const d=(c===undefined||!t)?null:c-t;
    const yuzde=(c!==undefined&&t)?Math.min(100,Math.round(c/t*100)):null;
    return `<div class="gap-row" style="grid-template-columns:150px 1fr 190px">
      <div class="gap-name">${nm}</div>
      <div class="gap-bar"><div class="gap-fill" style="width:${cw}%"></div>
        ${t?`<div class="gap-tick" style="left:calc(${tw}% - 1px)"></div>`:''}</div>
      <div class="gap-nums"><span class="cur">${c===undefined?'—':n1(c)}</span>
        <span class="t">/ ${t?n1(t):'—'}</span>
        <span class="d ${d===null?'':d<0?'neg':'pos'}">${d===null?'':(d>0?'+':'')+n1(d)}</span>
        <span style="color:var(--ink-3);min-width:38px">${yuzde!==null?'%'+yuzde:''}</span></div></div>`;
  };
  return `<div class="card"><div class="stats">
    <div class="stat"><div class="k">Şu anki puan</div><div class="v" style="font-size:21px">${su?n1(su.yerPuan):'—'}</div><div class="n">${a.count?a.count+' deneme ort.':'deneme gir'}</div></div>
    <div class="stat"><div class="k">Hedef puan</div><div class="v" style="font-size:21px">${isFinite(hp)?n1(hp):'—'}</div><div class="n">${esc((st.dept||'').slice(0,24))||'bölüm seç'}</div></div>
    <div class="stat"><div class="k">Puan farkı</div><div class="v" style="font-size:21px;color:${(su&&isFinite(hp))?(su.yerPuan-hp<0?'var(--bad)':'var(--ok)'):'inherit'}">${(su&&isFinite(hp))?((su.yerPuan-hp>0?'+':'')+n1(su.yerPuan-hp)):'—'}</div><div class="n">hedefe uzaklık</div></div>
    <div class="stat"><div class="k">Net farkı</div><div class="v" style="font-size:21px;color:${(varH&&a.count)?(cN-hN<0?'var(--bad)':'var(--ok)'):'inherit'}">${(varH&&a.count)?((cN-hN>0?'+':'')+n1(cN-hN)):'—'}</div><div class="n">${varH&&a.count?n1(cN)+' / '+n1(hN):'hedef net gir'}</div></div>
  </div>
  ${yol!==null?`<div class="body" style="border-top:1px solid var(--line-soft)">
    <div style="display:flex;align-items:center;gap:12px">
      <div style="font-size:12px;color:var(--ink-3);white-space:nowrap">İlk denemeden hedefe kat edilen yol</div>
      <div style="flex:1;height:18px;background:#EDF1F3;border-radius:3px;overflow:hidden">
        <div style="height:100%;width:${yol}%;background:var(--accent)"></div></div>
      <b style="font-family:var(--mono);font-size:14px">%${Math.round(yol)}</b></div>
    <div class="hint" style="margin-top:6px">İlk deneme ${n1(ilkTop)} net → şu an ${n1(sonTop)} net → hedef ${n1(hN)} net</div>
  </div>`:''}
  </div>

  <div class="card"><h2>Ders ders hedefe yaklaşma<small>Dolu çubuk son denemelerin ortalaması, dikey çizgi hedef. Sağdaki yüzde hedefin ne kadarına ulaşıldığını gösterir.</small></h2><div class="body">
    ${a.count?(list.map(bar).join('')||'<div class="empty">Hedef netleri girilmemiş.</div>'):'<div class="empty">Deneme girildiğinde bu tablo dolar.</div>'}
    <div class="hint" style="margin-top:10px">Dolu çubuk son ${a.count||3} denemenin ortalaması, dikey çizgi hedef. Sağdaki yüzde, hedefin ne kadarına ulaşıldığını gösterir.</div>
  </div></div>`;
}

function saveGoal(){const st=cur();st.dept=document.getElementById('hD').value.trim();st.rank=document.getElementById('hR').value.trim();st.score=document.getElementById('hS').value.trim();
  st.tabanPuan=document.getElementById('hTP').value.trim();st.tabanSira=document.getElementById('hTS').value.trim();st.tabanYil=document.getElementById('hTY').value.trim();
  st.sinavTarihi=document.getElementById('hSD').value;st.haftalikSaat=document.getElementById('hHS').value===''?'':+document.getElementById('hHS').value;
  st.tel=document.getElementById('hTel').value.trim();save();render();}
function openAtlas(){
  const st=cur(), q=(document.getElementById('hD')?.value||st.dept||'').trim();
  if(!q){alert('Önce bölüm adını yaz.');return;}
  window.open('https://yokatlas.yok.gov.tr/','_blank','noopener');
}
function saveRef(){const st=cur();subs(st).forEach(([k])=>{const v=document.getElementById('r_'+k).value;if(v==='')delete st.refNets[k];else st.refNets[k]=+v;});save();render();}
function saveMeta(){const st=cur();st.grade=document.getElementById('hG').value.trim();st.track=document.getElementById('hT').value;save();render();}

/* Bağlantı açar; tarayıcı engellerse ekranda tıklanabilir bağlantı bırakır. */
let SONLINK=null, DEMO=false;
function baglantiAc(url,etiket){
  try{ const w=window.open(url,'_blank','noopener'); if(w){ SONLINK=null; return true; } }catch(e){}
  try{
    const a=document.createElement('a');
    a.href=url; a.target='_blank'; a.rel='noopener'; a.style.display='none';
    document.body.appendChild(a); a.click(); a.remove(); SONLINK=null; return true;
  }catch(e){}
  SONLINK={url,etiket}; render(); return false;
}

let REFERANS=null, REFDURUM='', REFHATA='', REFYUKLENIYOR=false, REFAD='';
async function referansOku(){
  if(REFYUKLENIYOR) return;
  REFYUKLENIYOR=true; REFHATA='';
  try{
    const r=await sbGuvenli(()=>sbCagri('/rest/v1/rpc/referans_durum',{method:'POST',body:{}}));
    if(r && r.kod){ REFERANS=r; }
    else if(r===null || r===undefined){ REFHATA='bos'; }
    else { REFERANS=r; }            // kod boş gelirse de göster; ekran uyarır
  }catch(e){
    const m=String((e&&e.message)||e);
    REFHATA = (e&&e.kod===404) || /could not find|not found|does not exist|schema cache|PGRST202|404/i.test(m)
      ? 'kurulmamis' : m;
  }
  REFYUKLENIYOR=false;
}
function refLinki(){
  if(!REFERANS||!REFERANS.kod) return '';
  return tabanAdres()+'kocluk-sunucu.html#REF:'+REFERANS.kod;
}

let LISANS=null, CIHAZLAR=[], CIHAZHATA='';
function cihazParmakIzi(){
  // Tarayıcı + ekran + saat dilimi karışımı. Kimlik değil, cihaz ayırt edici.
  const p=[navigator.userAgent, navigator.language, screen.width+'x'+screen.height,
           screen.colorDepth, new Date().getTimezoneOffset(),
           navigator.hardwareConcurrency||0, navigator.platform||''].join('|');
  let h1=5381, h2=52711;
  for(let i=0;i<p.length;i++){ const c=p.charCodeAt(i); h1=((h1<<5)+h1+c)|0; h2=((h2<<5)+h2^c)|0; }
  return (h1>>>0).toString(36)+'-'+(h2>>>0).toString(36);
}
function cihazAdi(){
  const u=navigator.userAgent;
  const s = /Android/i.test(u)?'Android':/iPhone|iPad/i.test(u)?'iPhone/iPad':
            /Windows/i.test(u)?'Windows':/Mac/i.test(u)?'Mac':/Linux/i.test(u)?'Linux':'Cihaz';
  const t = /Edg\//.test(u)?'Edge':/Chrome/.test(u)?'Chrome':/Firefox/.test(u)?'Firefox':/Safari/.test(u)?'Safari':'';
  return (s+(t?' · '+t:'')).slice(0,40);
}

/* ---------- ÖĞRENCİ HESABI YÖNETİMİ ---------- */
let DAVETDURUM='';
function kodUret(){
  const harf='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';  // karışan harfler yok (I,O,0,1)
  let s=''; for(let i=0;i<6;i++) s+=harf[Math.floor(Math.random()*harf.length)];
  return s;
}
async function davetUret(){
  const st=cur(); if(!st) return;
  if(st.ornek){ alert('Örnek öğrenci için davet kodu üretilemez.'); return; }
  if(!onayTam(st)){
    alert(st.name+' için VELİ ONAYI KAYDI EKSİK.\n\n'+
      'Sunucu, onay kaydı olmayan öğrencide değişiklik yapılmasına izin vermiyor — davet kodu da üretilemiyor.\n\n'+
      'Yapman gereken: bu sayfadaki "Veli onayı" kartını doldur (veli adı, telefonu ve onay kutusu), sonra tekrar dene.\n\n'+
      'Not: Tarayıcı sürümünden aktardığın öğrencilerde bu alan boş gelir; her biri için bir kez doldurman gerekiyor.');
    return;
  }
  DAVETDURUM='Kod üretiliyor...'; render();
  try{
    const kod=kodUret();
    // kayıt henüz sunucuda olmayabilir — önce onu garantiye al
    const v=await sbSorgu('ogrenciler','?id=eq.'+st.id+'&select=id');
    if(!v || !v.length) await ogrenciYaz(st);
    await sbGuncelle('ogrenciler','?id=eq.'+st.id, { davet_kodu:kod, auth_id:null });
    st.davetKodu=kod; st.authId=null;
    DAVETDURUM=''; render();
  }catch(e){
    const m=String(e.message||e);
    DAVETDURUM='HATA|'+(/row-level security|violates/i.test(m)
      ? 'Sunucu bu kaydı kabul etmedi. Neredeyse her zaman sebebi veli onayı kaydının eksik olmasıdır. Yukarıdaki "Veli onayı" kartını doldurup tekrar dene.'
      : m);
    render();
  }
}
async function davetKopar(){
  const st=cur(); if(!st) return;
  if(!confirm(`${st.name} adlı öğrencinin hesap bağlantısı kesilecek ve yeni bir kod üretilecek.\n\nÖğrenci hesabını kaybettiyse ya da yeni bir hesapla girecekse bunu kullan.\n\nVerilerine dokunulmaz. Devam?`)) return;
  try{
    const kod=kodUret();
    const r=await sbGuvenli(()=>sbCagri('/rest/v1/rpc/ogrenci_coz',{method:'POST',body:{ogr:st.id,yeni_kod:kod}}));
    if(!r||!r.ok) throw new Error((r&&r.hata)||'Olmadı');
    st.davetKodu=kod; st.authId=null; DAVETDURUM=''; render();
    alert('Bağlantı kesildi. Yeni kod: '+kod);
  }catch(e){ alert('Olmadı: '+(e.message||e)); }
}

function davetLinki(st){
  const taban=ogrenciPaneliAdresi();
  if(!st.davetKodu) return taban;

  const paket=b64e(JSON.stringify({u:SB.url,k:SB.key,d:st.davetKodu}))
    .replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  return taban+'#KUR:'+paket;
}
function davetWa(){
  const st=cur(); if(!st||!st.davetKodu) return;
  const link=davetLinki(st);
  const mesaj=`${st.name}, çalışma panelin hazır.\n\nAşağıdaki bağlantıya tıkla, e-posta ve şifre belirle. Hepsi bu kadar.\n\n${link}\n\nBundan sonra ödevlerin doğrudan panelinde görünecek; WhatsApp'tan kod göndermeye gerek kalmayacak.\n\n(Bağlantı açılmazsa: ${ogrenciPaneliAdresi()} adresine gir ve kodu elle yaz: ${st.davetKodu})`;
  let tel=String(st.tel||'').replace(/\D/g,'');
  if(tel.startsWith('0')) tel='90'+tel.slice(1); else if(tel.length===10&&tel.startsWith('5')) tel='90'+tel;
  baglantiAc((tel?'https://wa.me/'+tel:'https://wa.me/')+'?text='+encodeURIComponent(mesaj),'WhatsApp — davet');
}

  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(m)){ GIRISHATA='Geçerli bir e-posta adresi yaz.'; render(); return; }
  GIRISBEKLE=true; GIRISHATA=''; render();
  try{
    /* redirect_to GÖVDEDE değil SORGUDA gönderilir; yoksa Supabase
       Site URL'e (tanıtım sayfası) düşer ve şifre ekranı hiç açılmaz. */
    const geri = encodeURIComponent(location.origin+location.pathname);
    await sbCagri('/auth/v1/recover?redirect_to='+geri,{method:'POST',body:{ email:m }});
    GIRISHATA='OK|'+m+' adresine sıfırlama bağlantısı gönderildi.\n\nGelen kutunu (ve gereksiz/spam klasörünü) kontrol et. Bağlantıya tıklayıp yeni şifreni belirle, sonra buradan gir.';
  }catch(e){
    GIRISHATA = /rate|limit|too many/i.test(e.message||'')
      ? 'Çok fazla deneme yapıldı. Birkaç dakika bekleyip tekrar dene.'
      : 'Gönderilemedi: '+(e.message||e);
  }
  GIRISBEKLE=false; render();
}

async function yeniSifreKaydet(){

  if(a.length<8){ GIRISHATA='Şifre en az 8 karakter olmalı.'; render(); return; }
  if(a!==b){ GIRISHATA='İki şifre aynı değil.'; render(); return; }
  GIRISBEKLE=true; GIRISHATA=''; render();
  try{
    await sbCagri('/auth/v1/user',{method:'PUT',body:{password:a}});
    GIRISMOD='giris'; GIRISHATA='OK|Şifren değiştirildi. Şimdi yeni şifrenle giriş yapabilirsin.';
    sbCikis();
  }catch(e){ GIRISHATA='Değiştirilemedi: '+(e.message||e); }
  GIRISBEKLE=false; render();
}
async function girisYap(){
  const m=document.getElementById('gMail').value.trim();
  const s=document.getElementById('gSifre').value;
  if(!m||!s){ GIRISHATA='E-posta ve şifre gerekli.'; render(); return; }
  if(GIRISMOD==='kayit'){
    if(!KVKK_ONAY){
      GIRISHATA='Kayıt olabilmek için Aydınlatma Metni ve Kullanım Koşulları\'nı onaylaman gerekiyor.';
      render(); return;
    }
    const m2=(document.getElementById('gMail2')?.value||'').trim();
    if(m.toLowerCase()!==m2.toLowerCase()){
      GIRISHATA='İki e-posta aynı değil. Yazdığını kontrol et — şifreni unutursan sıfırlama bağlantısı bu adrese gidecek.';
      render(); return;
    }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(m)){ GIRISHATA='E-posta adresi geçerli görünmüyor.'; render(); return; }
    const s2=(document.getElementById('gSifre2')?.value||'');
    if(s!==s2){ GIRISHATA='İki şifre aynı değil.'; render(); return; }
    // Referans kodu: BOŞ ya da DOĞRU olmalı. Yanlışsa kayıt yapılmaz.
    const rk=(document.getElementById('gRef')?.value||'').trim().toUpperCase().replace(/[^A-Z0-9]/g,'');
    try{ if(rk) localStorage.setItem('bekleyen_referans',rk); else localStorage.removeItem('bekleyen_referans'); }catch(e){}
    if(rk){
      GIRISBEKLE=true; GIRISHATA='Referans kodu kontrol ediliyor...'; render();
      let gecerli=false;
      try{
        const c=await sbCagri('/rest/v1/rpc/referans_gecerli_mi',{method:'POST',body:{kod:rk}});
        gecerli = !!(c && c.gecerli);
        if(!gecerli){
          GIRISBEKLE=false;
          const sb=(c&&c.sebep)||'';
          GIRISHATA = sb==='karsilikli'
            ? 'Bu kod kabul edilemez: karşılıklı referans geçerli değildir.'
            : sb==='kendi'
            ? 'Kendi referans kodunu kullanamazsın.'
            : 'Girdiğin referans kodu bulunamadı: '+rk+
              '\n\nKodu doğru yazdığından emin ol. Referansın yoksa kutuyu boş bırakabilirsin.';
          render(); return;
        }
        REFAD = (c && c.ad) || '';
      }catch(e){
        GIRISBEKLE=false;
        GIRISHATA='Referans kodu doğrulanamadı. İnternetini kontrol et; kod yoksa kutuyu boş bırakıp devam edebilirsin.';
        render(); return;
      }
      GIRISHATA='';
    }
  }
  GIRISBEKLE=true; GIRISHATA=''; render();
  try{
    if(GIRISMOD==='kayit'){
      const ad=document.getElementById('gAd').value.trim();
      if(s.length<8){ throw new Error('Şifre en az 8 karakter olmalı'); }
      const r=await sbKayit(m,s,ad);
      if(!r.giris){ GIRISBEKLE=false; GIRISHATA='OK|Hesap açıldı. E-postana gelen bağlantıya tıkla, sonra giriş yap.'; GIRISMOD='giris'; render(); return; }
    } else {
      await sbGiris(m,s);
    }
    await sunucudanYukle();
  }catch(e){
    GIRISHATA = /Invalid login/i.test(e.message) ? 'E-posta ya da şifre yanlış.'
      : /already registered/i.test(e.message) ? 'Bu e-posta zaten kayıtlı. "Giriş yap" seç.'
      : (e.message||String(e));
  }
  GIRISBEKLE=false; render();
}
async function bekleyenReferans(){
  let k=null;
  try{ k=localStorage.getItem('bekleyen_referans'); }catch(e){}
  if(!k) return;
  try{
    const r=await sbGuvenli(()=>sbCagri('/rest/v1/rpc/referans_uygula',{method:'POST',body:{kod:k}}));
    if(r&&r.ok) REFDURUM='OK|Seni davet eden: '+(r.davet_eden_ad||'—')+'. Pakete geçtiğinde onun sayacı ilerler.';
    else if(r&&r.hata) REFDURUM='HATA|Referans kodu uygulanamadı: '+r.hata+' (Davet et sekmesinden tekrar deneyebilirsin.)';
  }catch(e){ REFDURUM='HATA|Referans kodu şimdilik uygulanamadı. Davet et sekmesinden tekrar deneyebilirsin.'; }
  try{ localStorage.removeItem('bekleyen_referans'); }catch(e){}
}
async function sunucudanYukle(){
  await bekleyenReferans();
  await lisansOku();
  await denemeOku();
  referansOku();
  const izin=await cihazKaydet();
  if(!izin){ GIRISHATA=CIHAZHATA; sbCikis(); render(); return; }

  const d=await sunucudanOku();

  TAB='hafta'; render();
}

  ABONE=false; YAZDURUM=''; CIHAZHATA=''; YONDURUM=''; DAVETDURUM='';

  const oncekiDB=DB; DB=yerel;

                <b>Yanlış kodla kayıt yapılmaz</b> — ya boş bırak ya doğrusunu yaz.</div></div></div>`; })()}`:''}
        ${GIRISMOD==='kayit'?`
        <div style="border:1px solid ${KVKK_ONAY?'var(--accent)':'var(--line)'};border-radius:8px;
             background:${KVKK_ONAY?'var(--accent-soft)':'#FBFCFC'};padding:12px;margin:14px 0">
          <label style="display:flex;gap:10px;align-items:flex-start;cursor:pointer">
            <input type="checkbox" id="kvkkChk" ${KVKK_ONAY?'checked':''}
              onchange="KVKK_ONAY=this.checked;render()"
              style="width:20px;height:20px;flex:none;margin-top:1px;accent-color:var(--accent)">
            <span style="font-size:13px;line-height:1.55">
              <b>Aydınlatma Metni ve Kullanım Koşulları</b>'nı okudum, kabul ediyorum.
              Sisteme ekleyeceğim öğrencilerin verilerini işlemek için gerekli izinleri
              <b>öğrenciden ve 18 yaşından küçükse velisinden</b> aldığımı beyan ederim.
              <a href="#" onclick="KVKK_AC=true;render();return false"
                 style="color:var(--accent);text-decoration:underline">Metnin tamamını oku</a>
            </span>
          </label>
        </div>`:''}
        <button class="btn wide" ${(GIRISBEKLE||(GIRISMOD==='kayit'&&!KVKK_ONAY))?'disabled':''}
          style="${(GIRISMOD==='kayit'&&!KVKK_ONAY)?'opacity:.5;cursor:not-allowed':''}" onclick="girisYap()">
          ${GIRISBEKLE?'Bekle...':(GIRISMOD==='kayit'?'Hesabı oluştur':'Giriş yap')}</button>
        <button class="btn ghost wide" style="margin-top:8px" onclick="GIRISMOD='${GIRISMOD==='kayit'?'giris':'kayit'}';GIRISHATA='';render()">
          ${GIRISMOD==='kayit'?'Zaten hesabım var — giriş yap':'Hesabım yok — 7 gün ücretsiz dene'}</button>
        ${GIRISMOD==='kayit'?`
          <div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--line-soft)">
            <div style="font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:650;margin-bottom:8px">Deneme sonrası paketler</div>

              <tr><td>Sınıf Paketi</td><td class="num" style="color:var(--ink-3)">40 öğrenci</td><td class="num" style="font-weight:650">3.000 TL/yıl</td></tr>

      ${h?`<div class="flag ${iyi?'ok':'bad'}" style="margin-top:12px"><span class="ic">${iyi?'✓':'!'}</span><span>${esc(h.replace(/^OK\|/,'')).replace(/\n/g,'<br>')}</span></div>`:''}
      ${kurulu?`<div class="hint" style="margin-top:12px"><a href="#" onclick="SB.url='';SB.key='';sbSakla();render();return false" style="color:var(--accent)">Sunucu adresini değiştir</a></div>`:''}

}

/* ---------- nereden açıldı? ---------- */
function kaynakBilgi(){
  const pr=location.protocol;
  if(pr==='file:') return {tip:'dosya',metin:'Bu panel BİLGİSAYARINDAKİ DOSYADAN açıldı',
    detay:'Verilerin ve sürümün internet adresindekinden AYRIDIR. Öğrenci raporları, atlas.json ve güncellemeler burada beklendiği gibi çalışmaz.'};
  if(pr==='http:'||pr==='https:') return {tip:'web',metin:location.host,detay:''};
  return {tip:'diger',metin:pr,detay:''};
}
function kaynakUyarisi(){
  const k=kaynakBilgi();
  if(k.tip!=='dosya') return '';
  return `<div class="card" style="border:2px solid var(--bad);background:#FDF4F3">
    <div class="body"><div class="flag bad"><span class="ic">!</span><span>
      <b>${k.metin}</b><br>${k.detay}<br><br>
      Doğru adres: <b>${esc(DB.siteUrl||'https://eserakkaba53-cyber.github.io/Kocluk')}/kocluk-paneli.html</b><br>
      Doğru adresten açtığında verilerin sunucudan gelir; bir şey taşımana gerek yoktur.
    </span></div></div></div>`;
}

/* ---------- AÇILIŞ ---------- */
(async()=>{
  sbYukle();
  sayaclariOku();
  agirlikYukle().then(()=>{ try{render();}catch(e){} });
  // şifre sıfırlama bağlantısından mı gelindi?
  const hh=location.hash||'';
  // Referans daveti: kodu sakla, kayıt/giriş sonrası uygulanır
  const refm=hh.match(/^#REF:([A-Za-z0-9]{4,10})$/);
  if(refm){
    try{ localStorage.setItem('bekleyen_referans', refm[1].toUpperCase()); }catch(e){}
    history.replaceState(null,'',location.pathname+location.search);
    if(!sbOturum()) GIRISMOD='kayit';
  }
  /* ---- ŞİFRE SIFIRLAMA: Supabase üç ayrı biçimde dönebilir ----
     1) #access_token=...&type=recovery      (implicit akış)
     2) ?token_hash=...&type=recovery        (doğrulama bağlantısı)
     3) ?code=...                            (PKCE akışı)
     Üçünü de tanıyoruz; hangisi gelirse gelsin yeni şifre ekranı açılır. */
  {
    const qp = new URLSearchParams(location.search||'');
    const hp = new URLSearchParams((location.hash||'').replace(/^#/,''));

    // 0) Bağlantı tüketilmiş / süresi dolmuşsa Supabase hata döner — sessiz kalma
    const hata = hp.get('error_code')||hp.get('error')||qp.get('error_code')||qp.get('error');
    if(hata){
      history.replaceState(null,'',location.pathname);
      GIRISHATA = /expired|otp/i.test(hata)
        ? 'Bu sıfırlama bağlantısı artık geçerli değil.\n\nBağlantılar tek kullanımlıktır ve 1 saat geçerlidir. Ayrıca bazı e-posta servisleri (Outlook, Hotmail) güvenlik taraması yaparken bağlantıyı sizin adınıza açıp tüketebiliyor.\n\nYeni bir bağlantı isteyin; mümkünse farklı bir e-posta adresi kullanın.'
        : 'Sıfırlama bağlantısı doğrulanamadı ('+hata+'). Yeni bir bağlantı isteyin.';
      GIRISMOD='giris'; render(); return;
    }

    /* TEŞHİS: sıfırlama bağlantısından gelindiği belli ama biçim tanınmadıysa
       sessizce panele düşme — ne geldiğini ekranda göster. */
    const sifirlamaIzi = (location.search+location.hash);
    const izVar = /token|code|recovery|error/i.test(sifirlamaIzi);

    // 1) hash içinde hazır oturum
    if(hh.indexOf('type=recovery')>=0 && hp.get('access_token')){
      SB.tok=hp.get('access_token'); SB.ref=hp.get('refresh_token')||''; sbSakla();
      history.replaceState(null,'',location.pathname);
      GIRISMOD='yenisifre'; render(); return;
    }

    // 2) token_hash ile doğrulama
    if(qp.get('token_hash') && (qp.get('type')||'')==='recovery'){
      try{
        const r = await sbCagri('/auth/v1/verify',{method:'POST',
          body:{ type:'recovery', token_hash: qp.get('token_hash') }});
        if(r && r.access_token){
          SB.tok=r.access_token; SB.ref=r.refresh_token||''; sbSakla();
          history.replaceState(null,'',location.pathname);
          GIRISMOD='yenisifre'; render(); return;
        }
      }catch(e){
        history.replaceState(null,'',location.pathname);
        GIRISHATA='Sıfırlama bağlantısı geçersiz ya da süresi dolmuş (bağlantılar 1 saat geçerlidir). Lütfen yeni bir bağlantı iste.';
        GIRISMOD='giris'; render(); return;
      }
    }

    // 3) PKCE kodu
    if(qp.get('code')){
      try{
        const r = await sbCagri('/auth/v1/token?grant_type=pkce',{method:'POST',
          body:{ auth_code: qp.get('code') }});
        if(r && r.access_token){
          SB.tok=r.access_token; SB.ref=r.refresh_token||''; sbSakla();
          history.replaceState(null,'',location.pathname);
          GIRISMOD='yenisifre'; render(); return;
        }
      }catch(e){
        history.replaceState(null,'',location.pathname);
        GIRISHATA='Sıfırlama bağlantısı doğrulanamadı ('+(e.message||e)+'). Yeni bir bağlantı iste.';
        GIRISMOD='giris'; render(); return;
      }
    }

    /* Hiçbir biçime uymadı ama sıfırlama izi var: adresi göster ki sebep anlaşılsın. */
    if(izVar){
      sbCikis();
      GIRISHATA='TEŞHİS · Sıfırlama bağlantısı tanınmadı.\n\nGelen adres:\n'+sifirlamaIzi+
                '\n\nBu metni Eser\'e ilet.';
      GIRISMOD='giris'; render(); return;
    }
  }
  if(sbOturum()){
    try{ await sunucudanYukle(); return; }
    catch(e){
      if(e.kod===401){ try{ await sbTazele(); await sunucudanYukle(); return; }catch(e2){ sbCikis(); } }
      else { GIRISHATA='Sunucuya ulaşılamadı: '+(e.message||e)+'  ·  İnternetini kontrol edip sayfayı yenile.'; }
    }
  }
  const d=await load();
  if(d&&d.students) DB=d;
  if(!DB.sel&&DB.students[0]) DB.sel=DB.students[0].id;
  const hs=decodeURIComponent(location.hash.slice(1)||'');
  if(/^demo$/i.test(hs)){                       // index.html'den "Önce sistemi gez"
    history.replaceState(null,'',location.pathname+location.search);
    demoBaslat(); return;
  }
  if(/KOCRAPOR[12]:/.test(hs)){
    history.replaceState(null,'',location.pathname+location.search);
    const m=hs.match(/KOCRAPOR[12]:([A-Za-z0-9+/=_\-]+)/);
    const bul=raporSahibi(hs);
    if(bul.hedef) DB.sel=bul.hedef.id;
    else if(bul.ad) setTimeout(()=>alert(`Bu rapor "${bul.ad}" adına gönderilmiş ama panelinde bu isimde bir öğrenci yok.\n\nÖnce öğrenciyi ekle, sonra raporu yeniden yapıştır.`),300);
    TAB='hafta'; render();
    const st=cur();
    if(st){ const P=raporKodOku(st,hs); if(P){ RAPOR_ON=P; render(); } }
    return;
  }
  render();
})();
</script>
